<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="title desc">
<title id="title">Portugal Current: nominal ORCA section span</title>
<desc id="desc">About 116 km between published longitude limits at 37 degrees north. OSW WGS84 geodesic calculation, not whole-current width. Cruise October-November 2009; exact section dates unknown.</desc>
<rect width="640" height="420" fill="#071b2b"/>
<g font-family="system-ui,sans-serif" fill="#eaf3f7">
<text x="28" y="38" font-size="22">Portugal Current</text>
<text x="28" y="67" font-size="17">Published section limits at 37 N</text>
<text x="28" y="108" font-size="15">ORCA, fall 2009 / stations 19-23</text>
<line x1="64" y1="162" x2="576" y2="162" stroke="#7ad9d5" stroke-width="5"/>
<line x1="64" y1="149" x2="64" y2="175" stroke="#eaf3f7" stroke-width="2"/>
<line x1="576" y1="149" x2="576" y2="175" stroke="#eaf3f7" stroke-width="2"/>
<text x="64" y="198" font-size="16">14.8 W</text>
<text x="576" y="198" text-anchor="end" font-size="16">13.5 W</text>
<text x="320" y="151" text-anchor="middle" font-size="22">~116 km</text>
<text x="28" y="238" font-size="15">OSW calculation: shortest WGS84 geodesic.</text>
<text x="28" y="266" font-size="15">Surface/thermocline flow; no fixed metre layer.</text>
<text x="28" y="294" font-size="15">15 Oct-11 Nov bounds the cruise, not this section.</text>
<text x="28" y="322" font-size="15">Whole-current width and annual range unknown.</text>
<text x="28" y="364" font-size="13">Perez-Hernandez et al. (2013), doi:10.1002/jgrc.20227</text>
<text x="28" y="391" font-size="13">Section-distance diagram; no current axis or footprint.</text>
</g></svg>
