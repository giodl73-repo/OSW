<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1040" viewBox="0 0 480 1040" role="img" aria-labelledby="title desc">
<title id="title">Madagascar Current: regional width and dated events</title>
<desc id="desc">Prepared evidence, not installed. Typical study-summary width60 to100km. The prior April2001 survey reports approximately120km with a different unspecified boundary operator. Eight dated events are an index, not a seasonal cycle.</desc>
<rect width="480" height="1040" fill="#f3f8fa"/>
<text x="24" y="35" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#18394b">MADAGASCAR CURRENT</text>
<text x="24" y="62" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#18394b">Regional evidence • nominal 23°S</text>
<text x="24" y="87" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#72521b">Prepared source evidence • not yet installed</text>
<rect x="16" y="108" width="448" height="279" rx="10" fill="white"/>
<text x="30" y="137" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#18394b">Width summaries (km)</text>
<text x="30" y="163" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#18394b">2010–2013 mooring study: about 60–100 km</text>
<line x1="40.0" y1="184" x2="40.0" y2="253" stroke="#dae5ea"/>
<text x="40.0" y="274" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#18394b">0</text>
<line x1="96.0" y1="184" x2="96.0" y2="253" stroke="#dae5ea"/>
<text x="96.0" y="274" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#18394b">20</text>
<line x1="152.0" y1="184" x2="152.0" y2="253" stroke="#dae5ea"/>
<text x="152.0" y="274" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#18394b">40</text>
<line x1="208.0" y1="184" x2="208.0" y2="253" stroke="#dae5ea"/>
<text x="208.0" y="274" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#18394b">60</text>
<line x1="264.0" y1="184" x2="264.0" y2="253" stroke="#dae5ea"/>
<text x="264.0" y="274" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#18394b">80</text>
<line x1="320.0" y1="184" x2="320.0" y2="253" stroke="#dae5ea"/>
<text x="320.0" y="274" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#18394b">100</text>
<line x1="376.0" y1="184" x2="376.0" y2="253" stroke="#dae5ea"/>
<text x="376.0" y="274" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#18394b">120</text>
<line x1="432.0" y1="184" x2="432.0" y2="253" stroke="#dae5ea"/>
<text x="432.0" y="274" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#18394b">140</text>
<line x1="208.0" y1="199" x2="320.0" y2="199" stroke="#167a85" stroke-width="12"/>
<text x="30" y="230" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#18394b">April 2001 survey: about 120 km</text>
<circle cx="376.0" cy="247" r="5" fill="#91663b"/>
<text x="30" y="302" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#18394b">Different studies; matching edges unverified.</text>
<text x="30" y="325" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#18394b">The interval is not an annual min/max or error bar.</text>
<text x="30" y="350" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#18394b">Mean reach ~1,000 m; core ~20 km offshore.</text>
<text x="30" y="372" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#18394b">Neither value supplies a paired width boundary.</text>
<text x="24" y="422" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#18394b">Selected dated flow events</text>
<text x="24" y="447" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#18394b">Figure 4, placed here in chronological order</text>
<circle cx="31" cy="475" r="4" fill="#167a85"/>
<text x="45" y="479" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#18394b">2010-11-17 • Figure4h</text>
<text x="45" y="499" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#18394b">Strong transport event</text>
<circle cx="31" cy="526" r="4" fill="#167a85"/>
<text x="45" y="530" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#18394b">2010-12-30 • Figure4b</text>
<text x="45" y="550" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#18394b">Nearshore flow reversal; offshore migration</text>
<circle cx="31" cy="577" r="4" fill="#167a85"/>
<text x="45" y="581" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#18394b">2011-01-19 • Figure4i</text>
<text x="45" y="601" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#18394b">Wider than the November 2010 event</text>
<circle cx="31" cy="628" r="4" fill="#167a85"/>
<text x="45" y="632" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#18394b">2011-06-02 • Figure4g</text>
<text x="45" y="652" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#18394b">Deep core excursion</text>
<circle cx="31" cy="679" r="4" fill="#167a85"/>
<text x="45" y="683" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#18394b">2011-07-07 • Figure4c</text>
<text x="45" y="703" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#18394b">Cyclonic-eddy-associated flow reversal</text>
<circle cx="31" cy="730" r="4" fill="#167a85"/>
<text x="45" y="734" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#18394b">2012-07-22 • Figure4f</text>
<text x="45" y="754" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#18394b">Exceptionally weak current</text>
<circle cx="31" cy="781" r="4" fill="#167a85"/>
<text x="45" y="785" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#18394b">2012-11-28 • Figure4d</text>
<text x="45" y="805" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#18394b">Weak surface and undercurrent example</text>
<circle cx="31" cy="832" r="4" fill="#167a85"/>
<text x="45" y="836" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#18394b">2012-12-25 • Figure4e</text>
<text x="45" y="856" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#18394b">Strong surface and undercurrent example</text>
<text x="24" y="908" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#18394b">Discrete events; no numerical event widths extracted.</text>
<text x="24" y="930" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#18394b">No annual interpolation or seasonal animation implied.</text>
<text x="24" y="960" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#18394b">Source: Ponsoni et al. (2016), JPO 46, 1045–1065</text>
<text x="24" y="981" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#18394b">doi:10.1175/JPO-D-15-0154.1 • Figures 1, 2, 4</text>
<text x="24" y="1002" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#18394b">Surface extrapolation and missing-instrument gaps apply.</text>
<text x="24" y="1023" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#18394b">Original OSW diagram; publication figures not reproduced.</text>
</svg>
