<text x="154" y="611" text-anchor="middle" class="small">20 JUL</text><text x="499.3" y="611" text-anchor="middle" class="small">1 AUG</text><text x="1046" y="611" text-anchor="middle" class="small">20 AUG</text>
<g transform="translate(72 645)"><rect width="336" height="91" rx="7" fill="#e5f2f2"/><text x="18" y="28" class="strong">18-day stable plateau</text><text x="18" y="51" class="body">21 Jul–7 Aug survives IoU ≥ .20 and .25.</text><text x="18" y="72" class="body">Both adjacencies give the same lifetime.</text></g>
<g transform="translate(432 645)"><rect width="336" height="91" rx="7" fill="#f6ecdc"/><text x="18" y="28" class="strong">The disputed edge is 7 → 8 Aug</text><text x="18" y="51" class="body">216 exact cells persist, but IoU = 0.198.</text><text x="18" y="72" class="body">Large absolute overlap; large simultaneous reshaping.</text></g>
<g transform="translate(792 645)"><rect width="336" height="91" rx="7" fill="#edf2f2"/><text x="18" y="28" class="strong">The temporal bridge is also invariant</text><text x="18" y="51" class="body">122 cells · IoU 0.254 · both adjacencies.</text><text x="18" y="72" class="body">Gap permission remains the deciding rule.</text></g>
<text x="72" y="758" class="small">Source: NOAA CRW Marine Heatwave Watch v1.0.1 daily category · native 0.05° grid · 20 Jul–20 Aug 2026 · IoU = shared cells / union.</text>
<text x="72" y="778" class="small">Illustrative threshold sweep · greatest-intersection branch held fixed · no claim of water-parcel, subsurface, mechanism, or impact continuity.</text>
