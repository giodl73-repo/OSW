<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" role="img" aria-labelledby="title desc">
<title id="title">East India Coastal Current: three source-reported width statements</title>
<desc id="desc">Separate reports of about100km on the inbound23-24December2013 ship transect, approximately200km at the westward turn south of Sri Lanka, and250km in broader south-and-west observation/model discussion. Different scopes, not an annual range. Errors and current edges unknown. Canonical admission pending.</desc>
<rect width="1000" height="660" fill="#f5f8fc"/>
<g font-family="Arial, sans-serif" fill="#152b40">
<text x="36" y="44" font-size="25" font-weight="bold">East India Coastal Current</text>
<text x="36" y="73" font-size="17">Source-reported widths | November-December2013 study</text>
<text x="36" y="101" font-size="15">Different locations and support. Three statements; no new independent samples.</text>
<text x="36" y="150" font-size="18" font-weight="bold">Inbound ship transect T24</text>
<text x="36" y="176" font-size="14">23-24Dec2013; near5.25N; 21m source context</text>
<text x="36" y="199" font-size="14">Shipboard survey summary | section3.2, PDF6-7</text>
<line x1="590" y1="172" x2="920" y2="172" stroke="#b8c7d5"/>
<circle cx="700" cy="172" r="8" stroke="#006b83" stroke-width="3" fill="#006b83"/>
<text x="700" y="149" text-anchor="middle" font-size="18" font-weight="bold">~100 km</text>
<text x="36" y="270" font-size="18" font-weight="bold">Westward turn south of Sri Lanka</text>
<text x="36" y="296" font-size="14">Nov-Dec2013 narrative; exact width-sample days unknown</text>
<text x="36" y="319" font-size="14">Observational synthesis | section3.2, PDF7</text>
<line x1="590" y1="292" x2="920" y2="292" stroke="#b8c7d5"/>
<circle cx="810" cy="292" r="8" stroke="#006b83" stroke-width="3" fill="#006b83"/>
<text x="810" y="269" text-anchor="middle" font-size="18" font-weight="bold">~200 km</text>
<text x="36" y="390" font-size="18" font-weight="bold">South and west discussion context</text>
<text x="36" y="416" font-size="14">December2013 study context; precise support window unknown</text>
<text x="36" y="439" font-size="14">Combined observation/model discussion | section4, PDF14</text>
<line x1="590" y1="412" x2="920" y2="412" stroke="#b8c7d5"/>
<circle cx="865" cy="412" r="8" stroke="#006b83" stroke-width="3" fill="#f5f8fc"/>
<text x="865" y="389" text-anchor="middle" font-size="18" font-weight="bold">250 km</text>
<text x="590" y="477" text-anchor="middle" font-size="13">0</text>
<text x="700" y="477" text-anchor="middle" font-size="13">100</text>
<text x="810" y="477" text-anchor="middle" font-size="13">200</text>
<text x="920" y="477" text-anchor="middle" font-size="13">300</text>
<text x="755" y="499" text-anchor="middle" font-size="13">Reported width (km); marker position only</text>
<text x="36" y="533" font-size="15">250km covers a broader south-and-west scope; it is not an error bound on200km.</text>
<text x="36" y="558" font-size="15">Unknown edges, cutoff and errors. No annual range, geographic footprint or seasonal animation.</text>
<text x="36" y="583" font-size="15">Full primary article retained; selected passages reviewed. Canonical identity/width delivery pending.</text>
