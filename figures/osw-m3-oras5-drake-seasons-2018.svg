          <text x="72" y="667" class="temp">T<tspan baseline-shift="sub">net</tspan> 2.43°C</text></g>
<g aria-label="Reference-relative heat"><text x="820" y="178" class="label">NET ADVECTIVE HEAT · PW · REFERENCE TEMPERATURE CHANGES THE NUMBER</text><line x1="882.50" y1="205" x2="882.50" y2="675" class="grid"/><text x="882.50" y="700" class="axis">-1 PW</text><line x1="1007.50" y1="205" x2="1007.50" y2="675" class="grid"/><text x="1007.50" y="700" class="axis">+0 PW</text><line x1="1132.50" y1="205" x2="1132.50" y2="675" class="grid"/><text x="1132.50" y="700" class="axis">+1 PW</text><line x1="1257.50" y1="205" x2="1257.50" y2="675" class="grid"/><text x="1257.50" y="700" class="axis">+2 PW</text><path d="M1297.57,255L1292.90,375L1282.10,495L1291.31,615" fill="none" stroke="#ffb454" stroke-width="2" opacity=".65"/><path d="M1176.55,255L1173.57,375L1163.19,495L1166.90,615" fill="none" stroke="#62d7ce" stroke-width="2" opacity=".65"/><path d="M858.07,255L859.52,375L850.27,495L839.52,615" fill="none" stroke="#dc83ff" stroke-width="2" opacity=".65"/><circle cx="1297.57" cy="255" r="7" fill="#ffb454"/><text x="1297.57" y="242" class="heatvalue" fill="#ffb454">+2.32</text><circle cx="1176.55" cy="255" r="7" fill="#62d7ce"/><text x="1176.55" y="242" class="heatvalue" fill="#62d7ce">+1.35</text><circle cx="858.07" cy="255" r="7" fill="#dc83ff"/><text x="858.07" y="242" class="heatvalue" fill="#dc83ff">-1.20</text><circle cx="1292.90" cy="375" r="7" fill="#ffb454"/><text x="1292.90" y="362" class="heatvalue" fill="#ffb454">+2.28</text><circle cx="1173.57" cy="375" r="7" fill="#62d7ce"/><text x="1173.57" y="362" class="heatvalue" fill="#62d7ce">+1.33</text><circle cx="859.52" cy="375" r="7" fill="#dc83ff"/><text x="859.52" y="362" class="heatvalue" fill="#dc83ff">-1.18</text><circle cx="1282.10" cy="495" r="7" fill="#ffb454"/><text x="1282.10" y="482" class="heatvalue" fill="#ffb454">+2.20</text><circle cx="1163.19" cy="495" r="7" fill="#62d7ce"/><text x="1163.19" y="482" class="heatvalue" fill="#62d7ce">+1.25</text><circle cx="850.27" cy="495" r="7" fill="#dc83ff"/><text x="850.27" y="482" class="heatvalue" fill="#dc83ff">-1.26</text><circle cx="1291.31" cy="615" r="7" fill="#ffb454"/><text x="1291.31" y="602" class="heatvalue" fill="#ffb454">+2.27</text><circle cx="1166.90" cy="615" r="7" fill="#62d7ce"/><text x="1166.90" y="602" class="heatvalue" fill="#62d7ce">+1.28</text><circle cx="839.52" cy="615" r="7" fill="#dc83ff"/><text x="839.52" y="602" class="heatvalue" fill="#dc83ff">-1.34</text><g transform="translate(835 735)"><circle r="6" fill="#ffb454"/><text x="14" y="4" class="note">Tref −1.9°C</text><circle cx="130" r="6" fill="#62d7ce"/><text x="144" y="4" class="note">Tref 0°C</text><circle cx="240" r="6" fill="#dc83ff"/><text x="254" y="4" class="note">Tref 5°C</text></g></g>
<path d="M48 790H1352" stroke="#345157"/><g transform="translate(48 825)"><text class="metric">124.18 SV</text><text y="22" class="label">FOUR-SAMPLE NET MEAN</text><text x="245" class="metric">5.64 SV</text><text x="245" y="22" class="label">NET RANGE</text><text x="485" class="metric">12.92 / 12.48</text><text x="485" y="22" class="label">EAST / WEST BRANCH RANGES · SV</text><text x="935" class="metric">0.22°C</text><text x="935" y="22" class="label">TNET RANGE</text></g>
<rect x="48" y="895" width="1304" height="48" rx="12" fill="#0d242a"/><text x="68" y="916" class="note">THE NET LOOKS STEADIER THAN ITS BRANCHES: east and west each vary ~12–13 Sv while cancellation leaves a 5.64 Sv net range.</text><text x="68" y="934" class="fine">FOUR SAMPLED MONTHLY MEANS · ONE REANALYSIS MEMBER · ARITHMETIC T-TO-U COLLOCATION · NOT AN ANNUAL MEAN, CLIMATOLOGY, MASS CLOSURE, EDDY FLUX, CONVERGENCE, OR ANTARCTIC HEAT DELIVERY</text>
<metadata>Four sampled 2018 monthly means from one assimilative-reanalysis member and one grid-aligned gate. Not an annual mean, climatology, ensemble uncertainty, mass closure, eddy heat flux, convergence, or Antarctic heat-delivery estimate.</metadata></svg>