<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 890" role="img" aria-labelledby="title desc">
<title id="title">East Australian Current regional mean-core dimensions</title>
<desc id="desc">Five published model cross sections. Offshore extent and maximum contour depth have separate scales. These are dimensions of a long-term mean, not seasonal ranges, uniform thickness or mapped current edges.</desc>
<rect width="480" height="890" fill="#f5f9f9"/>
<style>text{font-family:Arial,sans-serif;fill:#173b49}.title{font-weight:700;font-size:24px}.label{font-size:16px}.small{font-size:14px}.value{font-size:17px;font-weight:700}.grid{stroke:#cbdcdd;stroke-width:1}</style>
<text x="24" y="36" class="title">East Australian Current</text>
<text x="24" y="64" class="label">Regional mean core · 1994–2016 model</text>
<text x="24" y="92" class="small">Mean alongshore velocity contour: −0.05 m/s</text>
<text x="24" y="132" class="label">27.5°S · Brisbane</text>
<text x="24" y="157" class="small">Offshore extent</text><line x1="155" y1="152" x2="420" y2="152" class="grid"/>
<circle cx="329.02" cy="152" r="5" fill="#087f8c"/><text x="155" y="177" class="value">157.6 km</text>
<text x="24" y="202" class="small">Maximum depth</text><line x1="155" y1="197" x2="420" y2="197" class="grid"/>
<circle cx="310.21" cy="197" r="5" fill="#ad5c14"/><text x="155" y="222" class="value">820 m</text>
<text x="24" y="264" class="label">30.3°S · Coffs Harbour</text>
<text x="24" y="289" class="small">Offshore extent</text><line x1="155" y1="284" x2="420" y2="284" class="grid"/>
<circle cx="327.36" cy="284" r="5" fill="#087f8c"/><text x="155" y="309" class="value">156.1 km</text>
<text x="24" y="334" class="small">Maximum depth</text><line x1="155" y1="329" x2="420" y2="329" class="grid"/>
<circle cx="346.18" cy="329" r="5" fill="#ad5c14"/><text x="155" y="354" class="value">1,010 m</text>
<text x="24" y="396" class="label">32.3°S · Forster</text>
<text x="24" y="421" class="small">Offshore extent</text><line x1="155" y1="416" x2="420" y2="416" class="grid"/>
<circle cx="352.31" cy="416" r="5" fill="#087f8c"/><text x="155" y="441" class="value">178.7 km</text>
<text x="24" y="466" class="small">Maximum depth</text><line x1="155" y1="461" x2="420" y2="461" class="grid"/>
<circle cx="380.25" cy="461" r="5" fill="#ad5c14"/><text x="155" y="486" class="value">1,190 m</text>
<text x="24" y="528" class="label">33.9°S · Sydney</text>
<text x="24" y="553" class="small">Offshore extent</text><line x1="155" y1="548" x2="420" y2="548" class="grid"/>
<circle cx="374.40" cy="548" r="5" fill="#087f8c"/><text x="155" y="573" class="value">198.7 km</text>
<text x="24" y="598" class="small">Maximum depth</text><line x1="155" y1="593" x2="420" y2="593" class="grid"/>
<circle cx="340.50" cy="593" r="5" fill="#ad5c14"/><text x="155" y="618" class="value">980 m</text>
<text x="24" y="660" class="label">36.2°S · Narooma</text>
<text x="24" y="685" class="small">Offshore extent</text><line x1="155" y1="680" x2="420" y2="680" class="grid"/>
<circle cx="337.19" cy="680" r="5" fill="#087f8c"/><text x="155" y="705" class="value">165.0 km</text>
<text x="24" y="730" class="small">Maximum depth</text><line x1="155" y1="725" x2="420" y2="725" class="grid"/>
<circle cx="391.61" cy="725" r="5" fill="#ad5c14"/><text x="155" y="750" class="value">1,250 m</text>
<text x="24" y="808" class="small">Extent scale: 0–240 km · depth: 0–1,400 m</text>
<text x="24" y="832" class="small">Spatial sections; annual ranges unknown.</text>
<text x="24" y="856" class="small">Kerry &amp; Roughan (2020), Table 1 · OSW chart</text>
</svg>
