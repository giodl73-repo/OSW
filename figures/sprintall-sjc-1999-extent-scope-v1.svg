<svg xmlns="http://www.w3.org/2000/svg" width="520" height="850" viewBox="0 0 520 850" role="img" aria-labelledby="title desc">
<title id="title">South Java: cited flow extent and mooring evidence</title><desc id="desc">The cited90nm southward extent is kept separate from vertical core context and a single1997–1998 mooring. No paired current width or seasonal dimension range is admitted.</desc>
<rect width="520" height="850" fill="#f4f8f8"/>
<text x="24" y="35" font-family="Arial,sans-serif" font-size="14" fill="#087f8c" font-weight="700">SOUTH JAVA CURRENT</text>
<text x="24" y="68" font-family="Arial,sans-serif" font-size="25" fill="#153e4c" font-weight="700">Three different quantities</text>
<text x="30" y="100" font-family="Arial,sans-serif" font-size="15" fill="#153e4c">Sprintall et al. (1999) · Source evidence review</text>
<rect x="18" y="130" width="484" height="205" rx="12" fill="white" stroke="#aac5cd"/>
<text x="30" y="165" font-family="Arial,sans-serif" font-size="25" fill="#153e4c" font-weight="700">90 nm</text>
<text x="30" y="193" font-family="Arial,sans-serif" font-size="16" fill="#153e4c" font-weight="700">Cited southward flow extent</text>
<text x="30" y="221" font-family="Arial,sans-serif" font-size="15" fill="#153e4c">Toward approximately 10°S and the boundary with the</text>
<text x="30" y="244" font-family="Arial,sans-serif" font-size="15" fill="#153e4c">westward South Equatorial Current.</text>
<text x="30" y="275" font-family="Arial,sans-serif" font-size="14" fill="#153e4c">May/November context cites Fieux (1994) and Meyers</text>
<text x="30" y="298" font-family="Arial,sans-serif" font-size="14" fill="#153e4c">(1995). Not a new mooring width.</text>
<rect x="18" y="350" width="484" height="185" rx="12" fill="white" stroke="#aac5cd"/>
<text x="30" y="385" font-family="Arial,sans-serif" font-size="25" fill="#153e4c" font-weight="700">150–250 m</text>
<text x="30" y="413" font-family="Arial,sans-serif" font-size="16" fill="#153e4c" font-weight="700">Cited vertical core context</text>
<text x="30" y="441" font-family="Arial,sans-serif" font-size="15" fill="#153e4c">Depth reach described in the same historical</text>
<text x="30" y="464" font-family="Arial,sans-serif" font-size="15" fill="#153e4c">sentence. It is a different dimension.</text>
<text x="30" y="495" font-family="Arial,sans-serif" font-size="14" fill="#153e4c">Not horizontal width, a fixed sampling layer, annual</text>
<text x="30" y="518" font-family="Arial,sans-serif" font-size="14" fill="#153e4c">extrema or uncertainty.</text>
<rect x="18" y="550" width="484" height="205" rx="12" fill="white" stroke="#aac5cd"/>
<text x="30" y="585" font-family="Arial,sans-serif" font-size="25" fill="#153e4c" font-weight="700">55 · 115 · 175 m</text>
<text x="30" y="613" font-family="Arial,sans-serif" font-size="16" fill="#153e4c" font-weight="700">One mooring · March 1997–March 1998</text>
<text x="30" y="641" font-family="Arial,sans-serif" font-size="15" fill="#153e4c">Instrument depths describe the paper’s own time</text>
<text x="30" y="664" font-family="Arial,sans-serif" font-size="15" fill="#153e4c">series, not a cross-current array.</text>
<text x="30" y="695" font-family="Arial,sans-serif" font-size="14" fill="#153e4c">55 m speed magnitude requires caution: one VMCM hub</text>
<text x="30" y="718" font-family="Arial,sans-serif" font-size="14" fill="#153e4c">failed calibration. Other two depths passed.</text>
<text x="24" y="790" font-family="Arial,sans-serif" font-size="15" fill="#153e4c" font-weight="700">Paired width · annual range · uncertainty: unresolved</text>
<text x="24" y="817" font-family="Arial,sans-serif" font-size="14" fill="#153e4c">No current length or physical map geometry added.</text>
</svg>
