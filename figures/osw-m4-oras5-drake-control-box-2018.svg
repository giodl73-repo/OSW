<g transform="translate(48 785)"><text class="metric">0.007 SV</text><text y="22" class="metric-label">MEAN OUTWARD VOLUME IMBALANCE</text><text x="420" class="metric">0.055 PW</text><text x="420" y="22" class="metric-label">MEAN NET OUTWARD ADVECTIVE HEAT · TREF 0°C</text><text x="900" class="metric">0.000203 PW</text><text x="900" y="22" class="metric-label">MEAN HEAT RANGE ACROSS THREE REFERENCES</text></g>
<rect x="48" y="853" width="1304" height="50" rx="12" fill="#0d242a"/><text x="68" y="873" class="note">VOLUME NEARLY CLOSES; THE HEAT RESIDUAL DOES NOT YET MEAN ACCUMULATION. Matched storage tendency and non-advective boundary/surface terms are still absent.</text><text x="68" y="890" class="fine">ONE SMALL BOX · ONE REANALYSIS MEMBER · FOUR MONTHS · OFFLINE T-TO-FACE COLLOCATION · NOT A CLIMATOLOGY, COMPLETE MODEL BUDGET, CAUSAL ATTRIBUTION, OR ANTARCTIC HEAT DELIVERY</text><metadata>Signed outward advective boundary flux around one small grid-aligned box. Without matched storage tendency, surface freshwater/heat flux, diffusion, and other model budget terms, net boundary flux is not closure, accumulation, convergence attribution, or Antarctic heat delivery.</metadata></svg>