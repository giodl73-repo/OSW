<line x1="430" y1="665" x2="430" y2="710" class="out" stroke-width="3" marker-end="url(#arrow-out)"/><text x="535" y="687" class="boundary">OUT 0.77 SV</text><text x="535" y="704" class="detail">-0.003 PW · SOUTH</text>
<text x="250" y="725" class="detail">69.125°W</text><text x="610" y="725" class="detail">65.125°W</text>
