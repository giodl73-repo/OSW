<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img">
<title>OSW-D6 marine heatwave branch-policy sensitivity</title>
<desc>Three branch rules select the same 21 daily components. Maximizing only the fraction of each candidate inherited selects a 12-cell splinter on July 30 and a one-cell splinter on August 3, ending after 14 days.</desc>
<style>.eyebrow{font:700 14px Inter,"Segoe UI",sans-serif;letter-spacing:2.2px;fill:#327487}.title{font:700 40px Georgia,serif;fill:#112f3b}.lead{font:400 18px Inter,"Segoe UI",sans-serif;fill:#49636c}.section{font:700 12px Inter,"Segoe UI",sans-serif;letter-spacing:1.4px;fill:#2e7182}.rowlabel{font:700 11px Inter,"Segoe UI",sans-serif;letter-spacing:.55px;fill:#294b56}.bartext{font:700 12px Inter,"Segoe UI",sans-serif;fill:#fff}.date{font:500 11px Inter,"Segoe UI",sans-serif;fill:#667b82}.cardtitle{font:700 15px Inter,"Segoe UI",sans-serif;fill:#173d49}.metric{font:700 27px Georgia,serif;fill:#153946}.body{font:400 13px Inter,"Segoe UI",sans-serif;fill:#506a73}.small{font:500 11px Inter,"Segoe UI",sans-serif;fill:#657b82}</style>
<rect width="1200" height="800" fill="#f8fbfa"/><path d="M0 0H1200V12H0Z" fill="#1f7185"/>
<text x="72" y="61" class="eyebrow">OSW · DETECTED OBJECT 06 · BRANCH IDENTITY</text>
<text x="72" y="113" class="title">A fraction-only rule follows the splinter</text>
<text x="72" y="149" class="lead">Matching lifetimes are not enough; the score’s denominator decides which child inherits the name.</text>
<g transform="translate(72 179)"><rect width="1056" height="43" rx="7" fill="#e2f1f1"/><text x="528" y="27" text-anchor="middle" class="section">3 RULES AGREE CELL FOR CELL FOR 21 DAYS · 1 RULE SELECTS TWO TINY FULLY INHERITED FRAGMENTS</text></g>
<text x="72" y="269" class="rowlabel">LARGEST SHARED FOOTPRINT</text><rect x="330" y="251" width="760" height="30" rx="4" fill="#e6eeee"/><rect x="364.5" y="251" width="725.5" height="30" rx="4" fill="#267b87"/><text x="1080.0" y="271" text-anchor="end" class="bartext">21 days</text><text x="72" y="335" class="rowlabel">BEST IoU</text><rect x="330" y="317" width="760" height="30" rx="4" fill="#e6eeee"/><rect x="364.5" y="317" width="725.5" height="30" rx="4" fill="#267b87"/><text x="1080.0" y="337" text-anchor="end" class="bartext">21 days</text><text x="72" y="401" class="rowlabel">HIGHEST INHERITED FRACTION</text><rect x="330" y="383" width="760" height="30" rx="4" fill="#e6eeee"/><rect x="364.5" y="383" width="483.6" height="30" rx="4" fill="#b66a3c"/><text x="838.2" y="403" text-anchor="end" class="bartext">14 days</text><text x="72" y="467" class="rowlabel">LARGEST OVERLAPPING COMPONENT</text><rect x="330" y="449" width="760" height="30" rx="4" fill="#e6eeee"/><rect x="364.5" y="449" width="725.5" height="30" rx="4" fill="#267b87"/><text x="1080.0" y="469" text-anchor="end" class="bartext">21 days</text><path d="M675.5 374v30" stroke="#fff" stroke-width="2"/><circle cx="675.5" cy="389" r="5" fill="#fff" stroke="#7d3f26" stroke-width="2"/><path d="M813.6 374v30" stroke="#fff" stroke-width="2"/><circle cx="813.6" cy="389" r="5" fill="#fff" stroke="#7d3f26" stroke-width="2"/>
<text x="364.5" y="527" text-anchor="middle" class="date">21 JUL</text><text x="675.5" y="527" text-anchor="middle" class="date">30 JUL</text><text x="813.6" y="527" text-anchor="middle" class="date">3 AUG</text><text x="1055.5" y="527" text-anchor="middle" class="date">10 AUG</text>
<path d="M72 550H1128" stroke="#c6d6d9"/><text x="72" y="584" class="section">WHY THE FRACTION SCORE BREAKS</text>
<g transform="translate(72 608)"><rect width="326" height="112" rx="7" fill="#e5f2f2"/><text x="18" y="28" class="cardtitle">30 July fork</text><text x="18" y="62" class="metric">1,233 vs 12</text><text x="18" y="84" class="body">main component vs selected splinter</text><text x="18" y="103" class="small">splinter inherited: 100% · main: 82%</text></g>
<g transform="translate(437 608)"><rect width="326" height="112" rx="7" fill="#f7eadc"/><text x="18" y="28" class="cardtitle">3 August fork</text><text x="18" y="62" class="metric">1,977 vs 1</text><text x="18" y="84" class="body">main component vs selected splinter</text><text x="18" y="103" class="small">1 / 1 cell inherited → 100% → lineage stops 4 Aug</text></g>
