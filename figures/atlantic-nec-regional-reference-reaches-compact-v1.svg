<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1000" viewBox="0 0 360 1000" role="img" aria-labelledby="title desc">
<title id="title">Atlantic NEC interior reference reaches</title><desc id="desc">Two editorial schematic lines from30W to55W. Gates are not current endpoints; lengths do not establish a whole-current ranking.</desc>
<rect width="360" height="1000" fill="#f2f7f8"/><g font-family="Arial,sans-serif" fill="#163b49">
<text x="14" y="30" font-size="22" font-weight="bold">Atlantic NEC</text>
<text x="14" y="58" font-size="19">Two interior reference reaches</text>
<text x="22" y="115" font-size="20" font-weight="bold">Northern spring schematic</text>
<path d="M57 301.1111111111111H337" stroke="#d0dfe4"/><text x="50" y="306.1111111111111" text-anchor="end" font-size="17">12°N</text>
<path d="M57 225.55555555555554H337" stroke="#d0dfe4"/><text x="50" y="230.55555555555554" text-anchor="end" font-size="17">16°N</text>
<path d="M57 150.0H337" stroke="#d0dfe4"/><text x="50" y="155.0" text-anchor="end" font-size="17">20°N</text>
<path d="M57.0 150V320" stroke="#d0dfe4"/><text x="57.0" y="347" text-anchor="middle" font-size="17">55°W</text>
<path d="M225.0 150V320" stroke="#d0dfe4"/><text x="225.0" y="347" text-anchor="middle" font-size="17">40°W</text>
<path d="M337.0 150V320" stroke="#d0dfe4"/><text x="337.0" y="347" text-anchor="middle" font-size="17">30°W</text>
<path d="M337.00,199.11 L281.00,235.00 L225.00,265.22 L169.00,284.11 L113.00,289.78 L57.00,286.00" fill="none" stroke="#087f8c" stroke-width="4"/>
<circle cx="337.0" cy="199.11111111111114" r="5" fill="#98621c"/>
<circle cx="57.0" cy="286.0" r="5" fill="#98621c"/>
<text x="22" y="381" font-size="20" font-weight="bold">About 2,800 km</text>
<text x="22" y="420" font-size="20" font-weight="bold">Northern fall schematic</text>
<path d="M57 606.1111111111111H337" stroke="#d0dfe4"/><text x="50" y="611.1111111111111" text-anchor="end" font-size="17">12°N</text>
<path d="M57 530.5555555555555H337" stroke="#d0dfe4"/><text x="50" y="535.5555555555555" text-anchor="end" font-size="17">16°N</text>
<path d="M57 455.0H337" stroke="#d0dfe4"/><text x="50" y="460.0" text-anchor="end" font-size="17">20°N</text>
<path d="M57.0 455V625" stroke="#d0dfe4"/><text x="57.0" y="652" text-anchor="middle" font-size="17">55°W</text>
<path d="M225.0 455V625" stroke="#d0dfe4"/><text x="225.0" y="652" text-anchor="middle" font-size="17">40°W</text>
<path d="M337.0 455V625" stroke="#d0dfe4"/><text x="337.0" y="652" text-anchor="middle" font-size="17">30°W</text>
<path d="M337.00,479.56 L281.00,509.78 L225.00,536.22 L169.00,557.00 L113.00,564.56 L57.00,564.56" fill="none" stroke="#087f8c" stroke-width="4"/>
<circle cx="337.0" cy="479.55555555555554" r="5" fill="#98621c"/>
<circle cx="57.0" cy="564.5555555555555" r="5" fill="#98621c"/>
<text x="22" y="686" font-size="20" font-weight="bold">About 2,700 km</text>
<text x="14" y="765" font-size="17">Brown points: chosen interior gates.</text>
<text x="14" y="788" font-size="17">Not current origin or termination.</text>
<text x="14" y="811" font-size="17">Rounded editorial lines, not observed axes.</text>
<text x="14" y="834" font-size="17">Drawing/gate spread is not uncertainty.</text>
<text x="14" y="857" font-size="17">Not measured seasonal length changes.</text>
<text x="14" y="880" font-size="17">Whole-current length and annual range</text>
<text x="14" y="903" font-size="17">remain unknown. No physical footprint.</text>
<text x="14" y="926" font-size="17">Source: Stramma &amp; Schott (1999), Fig.4</text>
<text x="14" y="949" font-size="17">doi:10.1016/S0967-0645(98)00109-X</text>
</g></svg>
