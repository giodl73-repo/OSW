<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 700" role="img" aria-labelledby="title desc">
<title id="title">Nordic current names in the NGA 2024 glossary</title>
<desc id="desc">Conceptual source connections. Norwegian Current is an alias of Norway Current in this edition. The separate Norway Coastal Current joins it near63 degrees north. Norway Current branches into North Cape and Spitzbergen Atlantic currents; the latter joins East Greenland Current. No modern identity equivalence, map scale, observed boundaries or seasonal dimensions are established.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#526b7c"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#153346}.title{font-size:25px;font-weight:700}.sub{font-size:15px}.name{font-size:19px;font-weight:700}.note{font-size:14px}.edge{fill:none;stroke:#526b7c;stroke-width:2.5;marker-end:url(#arrow)}.box{fill:#f1f6f9;stroke:#52778c;stroke-width:1.5}.coast{fill:#f5f8ed;stroke:#657b43;stroke-width:1.5}</style>
<rect width="1080" height="700" fill="white"/>
<text x="32" y="36" class="title" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#153346">Nordic current names: the NGA 2024 source convention</text>
<text x="32" y="64" class="sub" font-family="Arial,sans-serif" font-size="15" fill="#153346">Conceptual connections • publication year, not observation date • no geographic scale</text>
<path class="edge" fill="none" stroke="#526b7c" stroke-width="2.5" d="M610 159V235"/>
<path class="edge" fill="none" stroke="#526b7c" stroke-width="2.5" d="M350 277H460"/>
<path class="edge" fill="none" stroke="#526b7c" stroke-width="2.5" d="M610 319V352H365V395"/>
<path class="edge" fill="none" stroke="#526b7c" stroke-width="2.5" d="M610 319V352H885V395"/>
<path class="edge" fill="none" stroke="#526b7c" stroke-width="2.5" d="M365 479V545"/>
<path d="M605 225L615 225L610 235Z" fill="#526b7c"/>
<path d="M450 272L450 282L460 277Z" fill="#526b7c"/>
<path d="M360 385L370 385L365 395Z" fill="#526b7c"/>
<path d="M880 385L890 385L885 395Z" fill="#526b7c"/>
<path d="M360 535L370 535L365 545Z" fill="#526b7c"/>
<rect x="460" y="95" width="300" height="64" rx="10" fill="#f1f6f9" stroke="#52778c" stroke-width="1.5"/>
<text x="610.0" y="122" class="name" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#153346" text-anchor="middle">North Atlantic Current</text>
<rect x="460" y="235" width="300" height="84" rx="10" fill="#f1f6f9" stroke="#52778c" stroke-width="1.5"/>
<text x="610.0" y="262" class="name" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#153346" text-anchor="middle">Norway Current</text>
<text x="610.0" y="283" class="note" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#153346" text-anchor="middle">Alias: Norwegian Current</text>
<rect x="40" y="235" width="310" height="84" rx="10" fill="#f5f8ed" stroke="#657b43" stroke-width="1.5"/>
<text x="195.0" y="262" class="name" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#153346" text-anchor="middle">Norway Coastal Current</text>
<text x="195.0" y="283" class="note" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#153346" text-anchor="middle">About 20 miles</text>
<text x="195.0" y="304" class="note" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#153346" text-anchor="middle">May approach 30 miles near 63°N</text>
<rect x="160" y="395" width="410" height="84" rx="10" fill="#f1f6f9" stroke="#52778c" stroke-width="1.5"/>
<text x="365.0" y="422" class="name" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#153346" text-anchor="middle">Spitzbergen Atlantic Current</text>
<text x="365.0" y="443" class="note" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#153346" text-anchor="middle">Alias: Spitzbergen Current</text>
<rect x="740" y="395" width="290" height="70" rx="10" fill="#f1f6f9" stroke="#52778c" stroke-width="1.5"/>
<text x="885.0" y="422" class="name" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#153346" text-anchor="middle">North Cape Current</text>
<rect x="160" y="545" width="410" height="70" rx="10" fill="#f1f6f9" stroke="#52778c" stroke-width="1.5"/>
<text x="365.0" y="572" class="name" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#153346" text-anchor="middle">East Greenland Current</text>
<text x="620" y="195" class="note" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#153346" text-anchor="start">Northern branch continues</text>
<text x="405" y="260" class="note" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#153346" text-anchor="middle">Joins ~63°N</text>
<text x="435" y="340" class="note" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#153346" text-anchor="middle">Northwest branch</text>
<text x="805" y="340" class="note" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#153346" text-anchor="middle">Northeast branch</text>
<text x="385" y="516" class="note" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#153346" text-anchor="start">Gradual merge in Greenland Sea</text>
<text x="32" y="645" class="note" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#153346" text-anchor="start">Coastal width statements stay with the coastal entry. Raw mile units retain an unresolved conversion.</text>
<text x="32" y="669" class="note" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#153346" text-anchor="start">Source: American Practical Navigator, Vol II (2024), glossary pp.463–464 and497. Modern identity joins need further evidence.</text>
</svg>
