<rect x="48" y="856" width="1304" height="38" rx="12" fill="#0d242a"/><text x="68" y="874" class="note">TEMPERATURE CLASSES ARE NOT WATER MASSES: salinity, density, neutral surfaces, source history, and mixing are absent.</text><text x="68" y="888" class="fine">ARITHMETIC T-TO-U COLLOCATION · FOUR MONTHS, ONE REANALYSIS MEMBER · NOT MODEL-NATIVE TRACER FLUX, CONVERGENCE, OR ANTARCTIC HEAT DELIVERY</text><metadata>Potential-temperature classes partition the same collocated section cells. They are not water masses: salinity, density, neutral surfaces, source history, mixing, and model-native tracer flux are not represented.</metadata></svg>