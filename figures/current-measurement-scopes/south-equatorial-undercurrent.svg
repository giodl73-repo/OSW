<svg aria-labelledby="title description" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 310" role="img"><title id="title">South Equatorial Undercurrent: measurement scope</title><desc id="description">Measure basin members separately. Define layer, period and paired boundaries for each member; the family has no shared global width. Member evidence is not inherited by the parent. This is a relationship diagram, not a geographic map.</desc><rect width="800" height="310" fill="#f5f8fa" /><text font-size="19" font-family="sans-serif" x="22" y="30" fill="#203747">South Equatorial Undercurrent</text><text font-size="14" font-family="sans-serif" x="22" y="75" fill="#203747">basin family</text><rect x="20" y="98" width="260" height="76" rx="6" fill="#e0edf2" stroke="#426579" /><text font-size="15" font-family="sans-serif" x="32" y="123" fill="#203747">Define this object before</text><text font-size="15" font-family="sans-serif" x="32" y="143" fill="#203747">measuring its width</text><line stroke-dasharray="none" x1="280" y1="136" x2="355" y2="121" stroke="#607d89" /><rect stroke-dasharray="none" x="355" y="96" width="420" height="58" rx="5" fill="#fff" stroke="#607d89" /><text font-size="14" font-family="sans-serif" x="367" y="115" fill="#203747">Atlantic South Equatorial Undercurrent</text><text font-size="11" font-family="sans-serif" x="367" y="144" fill="#203747">member owns 1 scoped width records</text><line stroke-dasharray="none" x1="280" y1="136" x2="355" y2="193" stroke="#607d89" /><rect stroke-dasharray="none" x="355" y="168" width="420" height="58" rx="5" fill="#fff" stroke="#607d89" /><text font-size="14" font-family="sans-serif" x="367" y="187" fill="#203747">Indian Ocean South Equatorial Undercurrent</text><text font-size="11" font-family="sans-serif" x="367" y="216" fill="#203747">member owns 1 scoped width records</text><text font-size="13" font-family="sans-serif" x="22" y="265" fill="#203747">Relationships only. No current path, shared width or physical boundary is drawn.</text><text font-size="13" font-family="sans-serif" x="22" y="287" fill="#203747">Member values and observation dates stay with their original records.</text></svg>
