<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc" data-motion-level="m2-arctic-entrances-sensitivity"><title id="title">Arctic entrance surface-screen sensitivity</title><desc id="desc">Thirty eastern Fram variants change sign when the screen moves north, while all eighteen western Fram variants remain southward and all eleven Barents variants remain eastward.</desc><metadata>Nearby placements and lane bounds challenge unweighted nominal-15-m OSCAR surface screens only. Directional robustness is not uncertainty, probability, transport, or a full-depth gateway definition. Fram sensitivity reinforces the need to derive the M3 section and branches from native geometry and signed transport rather than copy one M2 line.</metadata><defs><style>text{font-family:Inter,ui-sans-serif,system-ui,sans-serif}.panel{fill:#0b252c;stroke:#49666b}.head{fill:#eef9f7;font-size:16px;font-weight:950}.sub{fill:#8ca7a7;font-size:8.5px;font-weight:900;letter-spacing:.9px}.axis-label{fill:#8ca7a7;font:800 8px ui-monospace,Consolas,monospace;text-anchor:end}.column-label{fill:#8ca7a7;font:800 8px ui-monospace,Consolas,monospace;text-anchor:middle}.cell-value{fill:#f5fbfa;font:850 9px ui-monospace,Consolas,monospace;text-anchor:middle}.tiny{fill:#8ca7a7;font:800 7px ui-monospace,Consolas,monospace;text-anchor:middle}.metric{fill:#eef9f7;font:950 27px ui-monospace,Consolas,monospace}.metric-label{fill:#8ca7a7;font-size:8.5px;font-weight:900;letter-spacing:1px}.note{fill:#a8bfbd;font-size:10px}.fine{fill:#607d80;font-size:8px}</style></defs><rect width="1400" height="900" fill="#06171c"/><text x="48" y="43" fill="#62d7ce" font-size="14" font-weight="900" letter-spacing="2.4">OSW / ARCTIC HEAT ROUTES · M2 SCREEN CHALLENGE</text><text x="48" y="87" fill="#eef9f7" font-size="34" font-weight="950">FRAM INFLOW MOVES WITH THE SCREEN</text><text x="48" y="116" fill="#9db3b2" font-size="12">Nearby latitude and lane-boundary bakeoff · annual mean normal surface velocity · m/s</text>
