<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920" role="img" aria-labelledby="title desc" data-motion-level="m4-drake-control-box-sensitivity">
<title id="title">Nested Drake control-box geometry sensitivity</title><desc id="desc">Two matched panels expand the native control box eastward and northward, showing that every box remains tightly volume-balanced while mean zero-degree-reference advective heat divergence changes with box geometry.</desc>
<defs><style>text{font-family:Inter,ui-sans-serif,system-ui,sans-serif}.kicker{fill:#62d7ce;font-size:14px;font-weight:900;letter-spacing:2.4px}.title{fill:#eef9f7;font-size:34px;font-weight:950}.sub{fill:#9db3b2;font-size:12px}.panel{fill:#0b2127;stroke:#29464c}.head{fill:#eef9f7;font-size:15px;font-weight:950}.label{fill:#9db3b2;font-size:9px;font-weight:900;letter-spacing:1.1px}.row{fill:#eef9f7;font-size:11px;font-weight:950}.heat{stroke:#29464c;stroke-width:8;stroke-linecap:round}.value{fill:#eef9f7;font:900 10px ui-monospace,Consolas,monospace}.fine{fill:#789596;font:800 8.5px ui-monospace,Consolas,monospace}.metric{fill:#eef9f7;font:950 28px ui-monospace,Consolas,monospace}.metric-label{fill:#9db3b2;font-size:8.5px;font-weight:900;letter-spacing:1px}.note{fill:#a9bfbe;font-size:9.5px}</style></defs>
<rect width="1400" height="920" fill="#06171c"/><text x="48" y="44" class="kicker">OSW / HEAT MOTION · M4 GEOMETRY CHALLENGE</text><text x="48" y="88" class="title">THE BOX CLOSES / THE HEAT RESIDUAL MOVES</text><text x="48" y="118" class="sub">Nested native boxes · four-sample means · signed outward advective flux</text>
<rect x="40" y="155" width="690" height="545" rx="16" class="panel"/><text x="72" y="190" class="head">EXPAND EASTWARD</text><text x="72" y="211" class="label">WEST FIXED AT 69.125°W · NORTH/SOUTH FIXED · NET HEAT AT TREF 0°C</text><path d="M85 235H690" stroke="#29464c"/><text x="72" y="290" class="row">TO 68.125°W</text><line x1="250" y1="285" x2="397.71" y2="285" class="heat"/><circle cx="397.71" cy="285" r="7" fill="#62d7ce"/><text x="410.71" y="290" class="value">0.021 PW</text><text x="72" y="308" class="fine">Q imbalance 0.0011 Sv</text><text x="72" y="382" class="row">TO 67.125°W</text><line x1="250" y1="377" x2="430.87" y2="377" class="heat"/><circle cx="430.87" cy="377" r="7" fill="#62d7ce"/><text x="443.87" y="382" class="value">0.026 PW</text><text x="72" y="400" class="fine">Q imbalance 0.0024 Sv</text><text x="72" y="474" class="row">TO 66.125°W</text><line x1="250" y1="469" x2="476.12" y2="469" class="heat"/><circle cx="476.12" cy="469" r="7" fill="#62d7ce"/><text x="489.12" y="474" class="value">0.032 PW</text><text x="72" y="492" class="fine">Q imbalance 0.0045 Sv</text><text x="72" y="566" class="row">TO 65.125°W</text><line x1="250" y1="561" x2="632.73" y2="561" class="heat"/><circle cx="632.73" cy="561" r="7" fill="#62d7ce"/><text x="645.73" y="566" class="value">0.055 PW</text><text x="72" y="584" class="fine">Q imbalance 0.0072 Sv</text>
<rect x="750" y="155" width="610" height="545" rx="16" class="panel"/><text x="800" y="190" class="head">EXPAND NORTHWARD</text><text x="800" y="211" class="label">SOUTH FIXED AT 66.162°S · EAST/WEST FIXED · NET HEAT AT TREF 0°C</text><path d="M800 235H1328" stroke="#29464c"/><text x="800" y="290" class="row">TO 63.949°S</text><line x1="965" y1="285" x2="982.95" y2="285" class="heat"/><circle cx="982.95" cy="285" r="7" fill="#62d7ce"/><text x="995.95" y="290" class="value">0.003 PW</text><text x="800" y="308" class="fine">Q imbalance 0.0021 Sv</text><text x="800" y="382" class="row">TO 61.428°S</text><line x1="965" y1="377" x2="971.63" y2="377" class="heat"/><circle cx="971.63" cy="377" r="7" fill="#62d7ce"/><text x="984.63" y="382" class="value">0.001 PW</text><text x="800" y="400" class="fine">Q imbalance 0.0038 Sv</text><text x="800" y="474" class="row">TO 58.684°S</text><line x1="965" y1="469" x2="1143.47" y2="469" class="heat"/><circle cx="1143.47" cy="469" r="7" fill="#62d7ce"/><text x="1156.47" y="474" class="value">0.032 PW</text><text x="800" y="492" class="fine">Q imbalance 0.0057 Sv</text><text x="800" y="566" class="row">TO 55.847°S</text><line x1="965" y1="561" x2="1265.71" y2="561" class="heat"/><circle cx="1265.71" cy="561" r="7" fill="#62d7ce"/><text x="1278.71" y="566" class="value">0.055 PW</text><text x="800" y="584" class="fine">Q imbalance 0.0072 Sv</text>
<g transform="translate(48 750)"><text class="metric">0.0336 PW</text><text y="23" class="metric-label">HEAT RANGE · EASTWARD EXTENT</text><text x="420" class="metric">0.0535 PW</text><text x="420" y="23" class="metric-label">HEAT RANGE · NORTHWARD EXTENT</text><text x="860" class="metric">&lt; 0.010 SV</text><text x="860" y="23" class="metric-label">WORST MONTHLY VOLUME IMBALANCE · ALL BOXES</text></g>
<rect x="48" y="837" width="1304" height="58" rx="12" fill="#0d242a"/><text x="68" y="857" class="note">VERDICT: near-zero volume imbalance is robust across these boxes; the advective heat residual is geometry-dependent.</text><text x="68" y="875" class="note">Therefore 0.055 PW belongs to one declared box—not to “Drake Passage” as a universal heat-convergence number.</text><text x="68" y="890" class="fine">METHOD SENSITIVITY, NOT OBSERVATIONAL UNCERTAINTY · NO STORAGE, SURFACE FLUX, DIFFUSION, NATIVE TRACER-BUDGET CLOSURE, OR ANTARCTIC DELIVERY</text><metadata>Nested eastward-extent and northward-extent boxes test geometric dependence of offline advective boundary divergence. They do not quantify observational uncertainty, storage tendency, surface flux, diffusion, native tracer-budget closure, or Antarctic heat delivery.</metadata></svg>