<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="770" viewBox="0 0 1120 770" role="img" aria-labelledby="title desc"><title id="title">Characteristic tropical Atlantic velocities</title><desc id="desc">Ten source-table rows in original order. Mean-vector speed and three variation metrics retain separate definitions. No annual extrema, uncertainty or monthly series inferred.</desc><rect width="1120" height="770" fill="#071d2c"/><g font-family="Arial,sans-serif" fill="#e8f3f8"><text x="32" y="42" font-size="25" font-weight="bold">Tropical Atlantic: characteristic velocities</text><text x="32" y="73" font-size="17">Richardson and Walsh (1986), Table 1 · source-selected map values · PREPARED</text><text x="32" y="121" font-size="16" font-weight="bold">Source current</text><text x="426" y="121" font-size="16" font-weight="bold">Mean-vector speed</text><text x="606" y="121" font-size="16" font-weight="bold">Seasonal variation</text><text x="800" y="121" font-size="16" font-weight="bold">Annual harmonic</text><text x="975" y="121" font-size="16" font-weight="bold">Semiannual</text><text x="426" y="146" font-size="15">cm/s</text><text x="606" y="146" font-size="15">cm/s</text><text x="800" y="146" font-size="15">cm/s</text><text x="975" y="146" font-size="15">cm/s</text><path d="M32 199H1088" stroke="#274353"/><text x="32" y="184" font-size="17">Caribbean Current</text><text x="426" y="184" font-size="18">35</text><text x="606" y="184" font-size="18">5</text><text x="800" y="184" font-size="18">4</text><text x="975" y="184" font-size="18">3</text><path d="M32 241H1088" stroke="#274353"/><text x="32" y="226" font-size="17">Guyana Current</text><text x="426" y="226" font-size="18">40</text><text x="606" y="226" font-size="18">10</text><text x="800" y="226" font-size="18">10</text><text x="975" y="226" font-size="18">3</text><path d="M32 283H1088" stroke="#274353"/><text x="32" y="268" font-size="17">North Brazil Current</text><text x="426" y="268" font-size="18">75</text><text x="606" y="268" font-size="18">16</text><text x="800" y="268" font-size="18">14</text><text x="975" y="268" font-size="18">6</text><path d="M32 325H1088" stroke="#274353"/><text x="32" y="310" font-size="17">Brazil Current</text><text x="426" y="310" font-size="18">10</text><text x="606" y="310" font-size="18">5</text><text x="800" y="310" font-size="18">5</text><text x="975" y="310" font-size="18">1</text><path d="M32 367H1088" stroke="#274353"/><text x="32" y="352" font-size="17">Guinea Current</text><text x="426" y="352" font-size="18">40</text><text x="606" y="352" font-size="18">15</text><text x="800" y="352" font-size="18">12</text><text x="975" y="352" font-size="18">6</text><path d="M32 409H1088" stroke="#274353"/><text x="32" y="394" font-size="17">North Equatorial Current</text><text x="426" y="394" font-size="18">14</text><text x="606" y="394" font-size="18">4</text><text x="800" y="394" font-size="18">3</text><text x="975" y="394" font-size="18">2</text><path d="M32 451H1088" stroke="#274353"/><text x="32" y="436" font-size="17">North Equatorial Countercurrent</text><text x="426" y="436" font-size="18">5–10</text><text x="606" y="436" font-size="18">20</text><text x="800" y="436" font-size="18">15</text><text x="975" y="436" font-size="18">5</text><path d="M32 493H1088" stroke="#274353"/><text x="32" y="478" font-size="17">South Equatorial Current (SEC)</text><text x="426" y="478" font-size="18">14</text><text x="606" y="478" font-size="18">5</text><text x="800" y="478" font-size="18">2</text><text x="975" y="478" font-size="18">2</text><path d="M32 535H1088" stroke="#274353"/><text x="32" y="520" font-size="17">SEC, 2N</text><text x="426" y="520" font-size="18">30</text><text x="606" y="520" font-size="18">15</text><text x="800" y="520" font-size="18">10</text><text x="975" y="520" font-size="18">10</text><path d="M32 577H1088" stroke="#274353"/><text x="32" y="562" font-size="17">SEC, 4S</text><text x="426" y="562" font-size="18">30</text><text x="606" y="562" font-size="18">10</text><text x="800" y="562" font-size="18">6</text><text x="975" y="562" font-size="18">5</text><text x="32" y="650" font-size="16">The authors chose these characteristic values from maps with large geographic variation.</text><text x="32" y="680" font-size="16">Seasonal variation and harmonic amplitudes are separate metrics; they are not annual min/max bounds.</text><text x="32" y="710" font-size="16">Historical ship drifts: 1875–1976, strongly weighted toward 1920–1940. No fixed sampling depth.</text><text x="32" y="740" font-size="16">No pooled-speed equivalence, monthly reconstruction, whole-current dimensions or global speed ranking.</text></g></svg>