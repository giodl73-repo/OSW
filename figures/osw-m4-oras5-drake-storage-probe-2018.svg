<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920" role="img" aria-labelledby="title desc" data-motion-level="m4-drake-storage-probe">
<title id="title">Sparse Drake control-box heat-storage probe</title><desc id="desc">Four volume-weighted monthly temperatures and three sparse interval comparisons place heat-content storage tendency beside endpoint-average outward advective heat divergence and the remaining unclosed term.</desc>
<defs><style>text{font-family:Inter,ui-sans-serif,system-ui,sans-serif}.kicker{fill:#62d7ce;font-size:14px;font-weight:900;letter-spacing:2.4px}.title{fill:#eef9f7;font-size:34px;font-weight:950}.sub{fill:#9db3b2;font-size:12px}.panel{fill:#0b2127;stroke:#29464c}.head{fill:#eef9f7;font-size:15px;font-weight:950}.label{fill:#9db3b2;font-size:9px;font-weight:900;letter-spacing:1.1px}.temp{fill:#eef9f7;font:900 11px ui-monospace,Consolas,monospace;text-anchor:middle}.month{fill:#9db3b2;font-size:10px;font-weight:950;text-anchor:middle}.interval{fill:#eef9f7;font-size:10px;font-weight:950}.storage{stroke:#7e9dff;stroke-width:12;stroke-linecap:round}.advective{stroke:#ffb454;stroke-width:12;stroke-linecap:round}.remainder{stroke:#dc83ff;stroke-width:12;stroke-linecap:round}.value{fill:#eef9f7;font:900 9px ui-monospace,Consolas,monospace}.end{text-anchor:end}.axis{stroke:#48646a;stroke-width:1}.metric{fill:#eef9f7;font:950 26px ui-monospace,Consolas,monospace}.metric-label{fill:#9db3b2;font-size:8.5px;font-weight:900;letter-spacing:1px}.note{fill:#a9bfbe;font-size:9.5px}.fine{fill:#617d80;font-size:8px}</style></defs>
<rect width="1400" height="920" fill="#06171c"/><text x="48" y="44" class="kicker">OSW / HEAT MOTION · M4 STORAGE PROBE</text><text x="48" y="88" class="title">STORAGE ENTERS THE BUDGET / IT DOES NOT CLOSE IT</text><text x="48" y="118" class="sub">Native T-cell area + partial thickness · sparse monthly-mean endpoints · primary control box</text>
<rect x="40" y="155" width="690" height="555" rx="16" class="panel"/><text x="70" y="190" class="head">THE BOX COOLS, THEN TURNS SLIGHTLY WARMER</text><text x="70" y="211" class="label">VOLUME-WEIGHTED POTENTIAL TEMPERATURE · NOT HEAT TRANSPORT</text><path d="M160.00,335.80L315.00,405.91L470.00,535.15L625.00,521.02" fill="none" stroke="#62d7ce" stroke-width="3" opacity=".55"/><circle cx="160" cy="335.80" r="8" fill="#62d7ce"/><text x="160" y="318.80" class="temp">1.362°C</text><text x="160" y="635" class="month">FEB</text><circle cx="315" cy="405.91" r="8" fill="#62d7ce"/><text x="315" y="388.91" class="temp">1.319°C</text><text x="315" y="635" class="month">MAY</text><circle cx="470" cy="535.15" r="8" fill="#62d7ce"/><text x="470" y="518.15" class="temp">1.240°C</text><text x="470" y="635" class="month">AUG</text><circle cx="625" cy="521.02" r="8" fill="#62d7ce"/><text x="625" y="504.02" class="temp">1.248°C</text><text x="625" y="635" class="month">NOV</text>
<rect x="750" y="155" width="610" height="555" rx="16" class="panel"/><text x="785" y="190" class="head">THREE TERMS / ONLY TWO ARE MEASURED HERE</text><text x="785" y="211" class="label">PW · STORAGE + ENDPOINT-MEAN OUTWARD ADVECTION = UNCLOSED REMAINDER</text><line x1="1000" y1="235" x2="1000" y2="675" class="axis"/>
          <text x="785" y="250" class="interval">FEB → MAY · 89 DAYS</text>
          <line x1="1000" y1="285" x2="960.87" y2="285" class="storage"/><text x="950.87" y="289" class="value end">-0.0157</text>
          <line x1="1000" y1="313" x2="1071.38" y2="313" class="advective"/><text x="1081.38" y="317" class="value">+0.0286</text>
          <line x1="1000" y1="341" x2="1032.25" y2="341" class="remainder"/><text x="1042.25" y="345" class="value">+0.0129</text>
          <text x="785" y="385" class="interval">MAY → AUG · 92 DAYS</text>
          <line x1="1000" y1="420" x2="930.22" y2="420" class="storage"/><text x="920.22" y="424" class="value end">-0.0279</text>
          <line x1="1000" y1="448" x2="1176.13" y2="448" class="advective"/><text x="1186.13" y="452" class="value">+0.0705</text>
          <line x1="1000" y1="476" x2="1106.35" y2="476" class="remainder"/><text x="1116.35" y="480" class="value">+0.0425</text>
          <text x="785" y="520" class="interval">AUG → NOV · 92 DAYS</text>
          <line x1="1000" y1="555" x2="1007.63" y2="555" class="storage"/><text x="997.63" y="559" class="value end">+0.0031</text>
          <line x1="1000" y1="583" x2="1202.00" y2="583" class="advective"/><text x="1212.00" y="587" class="value">+0.0808</text>
          <line x1="1000" y1="611" x2="1209.62" y2="611" class="remainder"/><text x="1219.62" y="615" class="value">+0.0838</text>
<g transform="translate(48 755)"><text class="metric">75,782</text><text y="22" class="metric-label">WET NATIVE T CELLS</text><text x="330" class="metric">6.832 ×10¹⁴ M³</text><text x="330" y="22" class="metric-label">FIXED BOX VOLUME</text><text x="810" class="metric">REFERENCE-INVARIANT</text><text x="810" y="22" class="metric-label">STORAGE TENDENCY AT FIXED VOLUME</text></g>
<g transform="translate(785 681)"><line x1="0" y1="0" x2="35" y2="0" class="storage"/><text x="48" y="4" class="note">STORAGE</text><line x1="145" y1="0" x2="180" y2="0" class="advective"/><text x="193" y="4" class="note">OUTWARD ADVECTION</text><line x1="365" y1="0" x2="400" y2="0" class="remainder"/><text x="413" y="4" class="note">UNCLOSED</text></g>
<rect x="48" y="839" width="1304" height="62" rx="12" fill="#0d242a"/><text x="68" y="859" class="note">THE REMAINDER IS NOT A DISCOVERED HEAT SOURCE. Sparse endpoint sampling and omitted surface, mixing, diffusion, ice, and native tracer terms are inseparable here.</text><text x="68" y="878" class="note">A complete budget requires time-integrated, model-consistent tendencies and fluxes over identical intervals.</text><text x="68" y="894" class="fine">CONSTANT ρ/CP · FOUR MONTHLY MEANS · THREE 89–92 DAY DIFFERENCES · NOT BUDGET CLOSURE, CAUSAL ATTRIBUTION, OR ANTARCTIC DELIVERY</text><metadata>Heat content uses constant density/heat capacity and native T-cell area/partial thickness. Three tendencies connect sparse monthly-mean representative dates and compare only with endpoint-average offline advective divergence. This is not a time-integrated model budget, closure residual, surface-flux estimate, mixing estimate, causal attribution, or Antarctic heat delivery.</metadata></svg>