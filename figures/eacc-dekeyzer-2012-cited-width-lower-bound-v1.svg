  </g>
  <g id="text_10">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start" x="41.58" y="281.664" transform="rotate(-0 41.58 281.664)">Width dates, numerical depth, edge definition and uncertainty are unreported. No annual range inferred.</text>
  </g>
  <g id="text_11">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start" x="41.58" y="305.856" transform="rotate(-0 41.58 305.856)">The cited Bell (1972) original methods and edition remain unverified.</text>
