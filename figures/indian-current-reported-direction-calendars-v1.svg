<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
<title id="title">Source-described current direction calendars</title>
<desc id="desc">Source-described directions, not observations or forecasts. WICC: northward January, February, November, December; southward April to September; March and October unspecified. EACC: source-described northward orientation throughout the year. WICC can reverse on shorter timescales. No velocity, dimensions, seasonal envelope or physical geometry inferred.</desc>
