<svg xmlns="http://www.w3.org/2000/svg" width="520" height="760" viewBox="0 0 520 760" role="img" aria-labelledby="title desc">
<title id="title">Azores Countercurrent: evidence support and cited width</title>
<desc id="desc">Onken1993 reviews evidence at several longitudes from17 to55 degrees west. The locations are not endpoints or a current path. A separate cited historical regional width is about200 kilometres. Whole-current length, seasonal width range and uncertainty remain unknown.</desc>
<rect width="520" height="760" rx="12" fill="#f1f7f7"/>
<g font-family="Arial,sans-serif" fill="#173e49">
<text x="24" y="35" font-size="13" font-weight="bold">OSW / ORIGINAL-SOURCE EVIDENCE</text>
<text x="24" y="70" font-size="25" font-weight="bold">Azores Countercurrent</text>
<text x="24" y="97" font-size="15">Onken 1993 / JPO 23, 1638-1646</text>
<rect x="20" y="120" width="480" height="281" rx="8" fill="white" stroke="#b2cbd0"/>
<text x="36" y="149" font-size="18" font-weight="bold">Where evidence is discussed</text>
<text x="36" y="176" font-size="14">Longitude support, not current length or a route</text>
<line x1="48" y1="215" x2="472" y2="215" stroke="#c5dadd" stroke-width="2"/>
<g font-size="13" text-anchor="middle">
<text x="48" y="241">55W</text><text x="104" y="241">50W</text><text x="160" y="241">45W</text><text x="272" y="241">35W</text><text x="384" y="241">25W</text><text x="472" y="241">17W</text>
</g>
<g fill="#087f90"><circle cx="104" cy="215" r="6"/><circle cx="272" cy="215" r="6"/><circle cx="384" cy="215" r="6"/><rect x="466" y="209" width="12" height="12"/></g>
<circle cx="160" cy="215" r="6" fill="white" stroke="#9a6724" stroke-width="2"/>
<text x="36" y="276" font-size="14">Filled dots: historical sections cited by Onken</text>
<text x="36" y="301" font-size="14">Square: NEADS2 cited mooring / nominal 750 m</text>
<text x="36" y="326" font-size="14">Open dot: mooring indication not significant</text>
<text x="36" y="357" font-size="14">Different years and methods. Source locations</text>
<text x="36" y="379" font-size="14">are not diagnosed current axes or boundaries.</text>
<rect x="20" y="417" width="480" height="191" rx="8" fill="white" stroke="#b2cbd0"/>
<text x="36" y="448" font-size="18" font-weight="bold">Cited regional width: about 200 km</text>
<line x1="48" y1="480" x2="464" y2="480" stroke="#c5dadd" stroke-width="3"/>
<rect x="48" y="473" width="333" height="14" fill="#087f90"/>
<text x="48" y="507" font-size="13">0</text><text x="381" y="507" font-size="13" text-anchor="middle">200</text><text x="464" y="507" font-size="13" text-anchor="end">250km</text>
<text x="36" y="537" font-size="14">Historical sections / Worthington 1962 and 1976</text>
<text x="36" y="560" font-size="14">Dependent summary; originals not yet reviewed.</text>
<text x="36" y="583" font-size="14">Width-edge method and fixed layer: unknown.</text>
<text x="24" y="642" font-size="16" font-weight="bold">Whole-current length: unknown</text>
<text x="24" y="669" font-size="14">Seasonal width range / numerical uncertainty: unknown</text>
<text x="24" y="695" font-size="14">Prepared evidence only. No axis traced; no annual cycle.</text>
