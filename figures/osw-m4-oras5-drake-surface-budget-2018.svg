<rect x="48" y="884" width="1304" height="58" rx="12" fill="#0d242a"/><text x="68" y="904" class="equation">dH/dt + outward advection − downward surface input = remaining</text><text x="68" y="922" class="note">Every interval remains positive after the surface term. The unresolved mean falls from 0.0622 to 0.0427 PW.</text><text x="68" y="937" class="fine">ORAS5 MODEL/REANALYSIS FLUX, INCLUDING SURFACE-RESTORING CONTEXT · NOT DIRECT OBSERVATION OR MODEL-NATIVE TRACER-BUDGET CLOSURE · ICE/MIXING/DIFFUSION/INCREMENTS UNRESOLVED</text><metadata>The native monthly ORAS5 sohefldo term reduces the offline remainder but does not close or attribute it. Monthly means and endpoint trapezoids are not model-native time-integrated diagnostics. Ice-ocean exchange, mixing, diffusion, freshwater/reference-temperature effects, assimilation increments, and other tracer-budget terms remain unresolved; ORAS5 surface restoring is part of the reanalysis context.</metadata></svg>