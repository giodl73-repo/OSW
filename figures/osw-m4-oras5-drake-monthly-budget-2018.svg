<rect x="48" y="842" width="1304" height="58" rx="12" fill="#0d242a"/><text x="68" y="862" class="note">DENSER SAMPLING CHANGES THE CURVE, NOT THE VERDICT: every interval retains a positive unclosed remainder.</text><text x="68" y="880" class="note">The twelve compact states reproduce all four prior anchor calculations exactly; maximum monthly volume imbalance is 0.01009 Sv.</text><text x="68" y="895" class="fine">MONTHLY-MEAN ENDPOINTS + TRAPEZOIDAL ADVECTION · NOT TIME-INTEGRATED NATIVE BUDGET CLOSURE, SURFACE/ICE/MIXING/DIFFUSIVE ATTRIBUTION, OR ANTARCTIC DELIVERY</text><metadata>Twelve monthly means support eleven adjacent-month storage differences and trapezoidal endpoint advection over 15 January–15 December 2018. This is denser sampling, not a complete time-integrated model budget; surface/ice fluxes, mixing, diffusion, and native tracer tendencies remain absent.</metadata></svg>