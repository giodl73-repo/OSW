<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc" data-motion-level="m3-barents-section-sensitivity"><title id="title">Barents anchors move the line more than the path-cost rule</title><desc id="desc">Fifty-four native geometry cases show scale-invariant paths within each endpoint case but nine proxy paths and six model-closure paths across endpoint perturbations.</desc><metadata>Endpoint and graph-cost sensitivity of surface geometry only. Differences are construction-method sensitivity, not ocean variability, transport uncertainty, observational error, or heat-delivery uncertainty.</metadata><defs><style>text{font-family:Inter,ui-sans-serif,system-ui,sans-serif}.panel{fill:#092229;stroke:#36575d}.body{fill:#aac0bf;font-size:13px}.fine{fill:#78979a;font-size:10px}.tiny{fill:#8ca7a7;font-size:8px}.rowlabel{fill:#d8e6e2;font-size:9px;font-weight:900;letter-spacing:.5px}.metric{fill:#eef8f5;font-size:25px;font-weight:950}.head{fill:#eef8f5;font-size:13px;font-weight:950;letter-spacing:1px}</style></defs><rect width="1400" height="900" fill="#06171c"/><text x="52" y="42" fill="#55ded3" font-size="12" font-weight="950" letter-spacing="2">OSW / BARENTS · CONSTRUCTION SENSITIVITY</text><text x="52" y="86" fill="#eef8f5" font-size="35" font-weight="950">THE COST RULE HOLDS. THE ANCHORS MOVE THE LINE.</text><text x="52" y="117" class="body">Nine endpoint intents × three corridor penalties × two section meanings. These are method choices—not ocean uncertainty.</text>
