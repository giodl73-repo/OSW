<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" role="img" aria-labelledby="title desc" data-motion-level="m3-indonesian-grid-bakeoff"><title id="title">Indonesian gate grid bakeoff</title><desc id="desc">Five rows compare surface wet-point support on one-third-degree OSCAR and one-twelfth-degree HYCOM, followed by a one-day full-depth normal-velocity profile.</desc><metadata>OSCAR values are annual nominal-15-m diagnostics; HYCOM values are one 2018-11-16 daily field on standard z levels. Their velocities must not be treated as a like-for-like skill comparison. The bakeoff tests grid support only. HYCOM sections remain provisional axis-aligned, collocated standard-grid samples rather than native-face fluxes or INSTANT mooring arrays; no area-weighted volume or heat transport is calculated.</metadata><defs><marker id="arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#698486"/></marker><style>text{font-family:Inter,ui-sans-serif,system-ui,sans-serif}.row{fill:#0c252b;stroke:#3f5e62}.code{font:950 18px ui-monospace,Consolas,monospace}.name{fill:#eef9f7;font-size:16px;font-weight:950}.role,.label{fill:#89a2a2;font-size:8px;font-weight:900;letter-spacing:.9px}.count{fill:#eef9f7;font:850 11px ui-monospace,Consolas,monospace}.fine{fill:#698588;font-size:7.5px}.zero{stroke:#587276;stroke-width:.8;stroke-dasharray:3 3}</style></defs><rect width="1400" height="980" fill="#06171c"/><text x="45" y="43" fill="#62d7ce" font-size="14" font-weight="900" letter-spacing="2.4">OSW / INDONESIAN HEAT ROUTES · M3 GRID BAKEOFF</text><text x="45" y="87" fill="#eef9f7" font-size="34" font-weight="950">THE FINER GRID OPENS ALL FIVE.</text><text x="45" y="116" fill="#9db3b2" font-size="12">More wet cells restore candidate sections. They do not validate the section or calculate transport.</text><rect x="1050" y="39" width="305" height="30" rx="15" fill="#102a30" stroke="#f0cf70"/><text x="1202.5" y="59" fill="#f0cf70" text-anchor="middle" font-size="9.5" font-weight="950" letter-spacing="1">ONE DAILY FIELD · NOT A MEAN</text><g><rect x="45" y="170" width="1310" height="112" rx="13" class="row"/><rect x="45" y="170" width="5" height="112" rx="2.5" fill="#62d7ce"/><text x="67" y="201" fill="#62d7ce" class="code">MAK</text><text x="125" y="199" class="name">MAKASSAR STRAIT</text><text x="67" y="223" class="role">PRIMARY UPPER-OCEAN INFLOW</text><text x="318" y="193" class="label">OSCAR 1/3° · SURFACE</text><rect x="318" y="208" width="210" height="13" rx="6.5" fill="#18343a"/><rect x="318" y="208" width="131.2" height="13" rx="6.5" fill="#62d7ce"/><text x="542" y="219" class="count">5/8</text><text x="318" y="247" class="fine">71-FIELD MINIMUM WET SUPPORT</text><path d="M580 221h45" stroke="#698486" stroke-width="1.5" marker-end="url(#arrow)"/><text x="664" y="193" class="label">HYCOM 1/12° · SURFACE</text><rect x="664" y="208" width="210" height="13" rx="6.5" fill="#18343a"/><rect x="664" y="208" width="131.2" height="13" rx="6.5" fill="#62d7ce"/><text x="888" y="219" class="count">20/32</text><text x="664" y="247" class="fine">+0.261 M/S DECLARED-POSITIVE</text><text x="1010" y="186" class="label">ONE-DAY VERTICAL MOTION PROFILE</text><path d="M1010 230h315" class="zero"/><path d="M1010.0,203.8L1029.9,203.4L1038.2,204.4L1044.5,205.6L1054.5,207.8L1064.6,206.7L1073.0,201.4L1080.4,203.1L1087.2,205.0L1099.1,207.9L1109.6,209.2L1119.1,216.1L1136.0,220.9L1150.9,222.3L1164.3,222.9L1176.7,225.4L1188.2,227.1L1199.0,229.3L1209.2,231.2L1218.9,232.4L1228.2,233.4L1237.1,234.0L1245.7,235.2L1254.0,235.4L1273.5,241.8L1291.7,231.0" fill="none" stroke="#62d7ce" stroke-width="2.2"/><text x="1010" y="269" class="fine">0 M</text><text x="1325" y="269" text-anchor="end" class="fine">DEEPEST WET 2000 M</text></g><g><rect x="45" y="302" width="1310" height="112" rx="13" class="row"/><rect x="45" y="302" width="5" height="112" rx="2.5" fill="#7e9dff"/><text x="67" y="3