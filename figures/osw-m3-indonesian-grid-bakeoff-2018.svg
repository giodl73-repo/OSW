 rx="6.5" fill="#dc83ff"/><text x="888" y="615" class="count">10/15</text><text x="664" y="643" class="fine">+0.432 M/S DECLARED-POSITIVE</text><text x="1010" y="582" class="label">ONE-DAY VERTICAL MOTION PROFILE</text><path d="M1010 626h315" class="zero"/><path d="M1010.0,597.4L1029.9,599.7L1038.2,602.3L1044.5,602.3L1054.5,605.9L1064.6,609.0L1073.0,614.6L1080.4,614.8L1087.2,616.1L1099.1,616.9L1109.6,618.4L1119.1,620.1L1136.0,620.3L1150.9,621.3L1164.3,621.2L1176.7,621.7L1188.2,623.2L1199.0,625.2L1209.2,625.8L1218.9,626.0L1228.2,625.9L1237.1,625.7L1245.7,625.5L1254.0,625.1L1273.5,624.8L1291.7,626.3L1325.0,625.7" fill="none" stroke="#dc83ff" stroke-width="2.2"/><text x="1010" y="665" class="fine">0 M</text><text x="1325" y="665" text-anchor="end" class="fine">DEEPEST WET 2500 M</text></g><g><rect x="45" y="698" width="1310" height="112" rx="13" class="row"/><rect x="45" y="698" width="5" height="112" rx="2.5" fill="#ff9a68"/><text x="67" y="729" fill="#ff9a68" class="code">TIM</text><text x="125" y="727" class="name">TIMOR PASSAGE</text><text x="67" y="751" class="role">EASTERN BROAD OUTFLOW</text><text x="318" y="721" class="label">OSCAR 1/3° · SURFACE</text><rect x="318" y="736" width="210" height="13" rx="6.5" fill="#18343a"/><rect x="318" y="736" width="210.0" height="13" rx="6.5" fill="#ff9a68"/><text x="542" y="747" class="count">9/9</text><text x="318" y="775" class="fine">71-FIELD MINIMUM WET SUPPORT</text><path d="M580 749h45" stroke="#698486" stroke-width="1.5" marker-end="url(#arrow)"/><text x="664" y="721" class="label">HYCOM 1/12° · SURFACE</text><rect x="664" y="736" width="210" height="13" rx="6.5" fill="#18343a"/><rect x="664" y="736" width="210.0" height="13" rx="6.5" fill="#ff9a68"/><text x="888" y="747" class="count">38/38</text><text x="664" y="775" class="fine">+0.186 M/S DECLARED-POSITIVE</text><text x="1010" y="714" class="label">ONE-DAY VERTICAL MOTION PROFILE</text><path d="M1010 758h315" class="zero"/><path d="M1010.0,729.4L1029.9,732.5L1038.2,734.0L1044.5,735.3L1054.5,731.9L1064.6,734.3L1073.0,740.5L1080.4,742.9L1087.2,746.3L1099.1,749.3L1109.6,749.5L1119.1,750.9L1136.0,754.7L1150.9,758.0L1164.3,759.9L1176.7,759.4L1188.2,758.9L1199.0,758.0L1209.2,757.1L1218.9,756.5L1228.2,755.4L1237.1,754.0L1245.7,753.7L1254.0,754.3L1273.5,754.9L1291.7,741.7" fill="none" stroke="#ff9a68" stroke-width="2.2"/><text x="1010" y="797" class="fine">0 M</text><text x="1325" y="797" text-anchor="end" class="fine">DEEPEST WET 2000 M</text></g><rect x="45" y="846" width="1310" height="82" rx="13" fill="#0d242a"/><text x="67" y="873" fill="#eef9f7" font-size="13" font-weight="950">RESOLUTION PASSES. TRANSPORT HAS NOT STARTED.</text><text x="67" y="896" fill="#a8bfbd" font-size="9.5">HYCOM restores 7–38 surface wet cells at every candidate and exposes 900–2500 m of standard-level structure. Lifamatola's surface still runs opposite its declared deep route.</text><text x="67" y="916" fill="#a8bfbd" font-size="9.5">Next: section-angle sensitivity, connected wet-column checks, face geometry, thickness, and T/S-defined branch accounting before volume or heat.</text><text x="45" y="960" fill="#536f72" font-size="8">OSCAR: 71 FIVE-DAY FIELDS, DEC 2017–NOV 2018, NOMINAL 15 M · HYCOM GLBA0.08 EXPT 91.2: 2018-11-16, 33 STANDARD Z LEVELS · VELOCITY CURVES ARE NOT CROSS-PRODUCT SKILL SCORES</text></svg>