<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
<title id="title">Atlantic NEC interior reference reaches</title><desc id="desc">Two editorial schematic lines from30W to55W. Gates are not current endpoints; lengths do not establish a whole-current ranking.</desc>
<rect width="1000" height="650" fill="#f2f7f8"/><g font-family="Arial,sans-serif" fill="#163b49">
<text x="30" y="38" font-size="25" font-weight="bold">Atlantic North Equatorial Current · interior references</text>
<text x="30" y="70" font-size="18">One NEC-labelled schematic curve per phase; other parallel flows are excluded.</text>
<text x="40" y="130" font-size="22" font-weight="bold">Northern spring schematic</text>
<path d="M75 351.66666666666663H450" stroke="#d0dfe4"/><text x="68" y="356.66666666666663" text-anchor="end" font-size="17">12°N</text>
<path d="M75 258.3333333333333H450" stroke="#d0dfe4"/><text x="68" y="263.3333333333333" text-anchor="end" font-size="17">16°N</text>
<path d="M75 165.0H450" stroke="#d0dfe4"/><text x="68" y="170.0" text-anchor="end" font-size="17">20°N</text>
<path d="M75.0 165V375" stroke="#d0dfe4"/><text x="75.0" y="402" text-anchor="middle" font-size="17">55°W</text>
<path d="M300.0 165V375" stroke="#d0dfe4"/><text x="300.0" y="402" text-anchor="middle" font-size="17">40°W</text>
<path d="M450.0 165V375" stroke="#d0dfe4"/><text x="450.0" y="402" text-anchor="middle" font-size="17">30°W</text>
<path d="M450.00,225.67 L375.00,270.00 L300.00,307.33 L225.00,330.67 L150.00,337.67 L75.00,333.00" fill="none" stroke="#087f8c" stroke-width="4"/>
<circle cx="450.0" cy="225.66666666666669" r="5" fill="#98621c"/>
<circle cx="75.0" cy="333.0" r="5" fill="#98621c"/>
<text x="40" y="436" font-size="20" font-weight="bold">About 2,800 km</text>
<text x="515" y="130" font-size="22" font-weight="bold">Northern fall schematic</text>
<path d="M550 351.66666666666663H925" stroke="#d0dfe4"/><text x="543" y="356.66666666666663" text-anchor="end" font-size="17">12°N</text>
<path d="M550 258.3333333333333H925" stroke="#d0dfe4"/><text x="543" y="263.3333333333333" text-anchor="end" font-size="17">16°N</text>
<path d="M550 165.0H925" stroke="#d0dfe4"/><text x="543" y="170.0" text-anchor="end" font-size="17">20°N</text>
<path d="M550.0 165V375" stroke="#d0dfe4"/><text x="550.0" y="402" text-anchor="middle" font-size="17">55°W</text>
<path d="M775.0 165V375" stroke="#d0dfe4"/><text x="775.0" y="402" text-anchor="middle" font-size="17">40°W</text>
<path d="M925.0 165V375" stroke="#d0dfe4"/><text x="925.0" y="402" text-anchor="middle" font-size="17">30°W</text>
<path d="M925.00,195.33 L850.00,232.67 L775.00,265.33 L700.00,291.00 L625.00,300.33 L550.00,300.33" fill="none" stroke="#087f8c" stroke-width="4"/>
<circle cx="925.0" cy="195.33333333333334" r="5" fill="#98621c"/>
<circle cx="550.0" cy="300.33333333333337" r="5" fill="#98621c"/>
<text x="515" y="436" font-size="20" font-weight="bold">About 2,700 km</text>
<text x="30" y="485" font-size="18">Chosen30°W and55°W gates are not current origin or termination. Studied reaches excluded from ranking.</text>
<text x="30" y="519" font-size="18">WGS84 path sums; rounded editorial vertices, not velocity cores. Drawing/gate spread is not physical uncertainty.</text>
<text x="30" y="553" font-size="18">Whole-current length, width, annual ranges and physical footprint remain unresolved.</text>
<text x="30" y="587" font-size="18">Source: Stramma &amp; Schott (1999), Figure4 · doi:10.1016/S0967-0645(98)00109-X · OSW redraw</text>
<text x="30" y="621" font-size="18">Differences between these schematic paths are not measured seasonal length changes.</text>
</g></svg>
