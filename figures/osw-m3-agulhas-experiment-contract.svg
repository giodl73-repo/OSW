<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="960" viewBox="0 0 1400 960" role="img" aria-labelledby="title desc" data-motion-level="m3-agulhas-contract"><title id="title">Agulhas M3 experiment contract</title><desc id="desc">Five failed promotion checks and one acquired geometry separate the current surface-pathway pilot from a full-depth, transport-weighted, four-year Agulhas leakage experiment.</desc><metadata>This artifact specifies a new experiment and contains no raw M3 velocity or new OSW leakage, volume, heat, or AMOC estimate. The published section geometry and derived INALT20/Parcels outputs are now acquired for attributed replication; a new execution still requires eddy-rich 3-D velocity and target-grid section mapping. Schmidt et al. 2021 doi:10.5194/os-17-1067-2021. Schwarzkopf et al. 2022 doi:10.1038/s43247-022-00643-y. Daher et al. 2020 doi:10.1029/2019JC015753.</metadata><defs><marker id="arrowhead" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#58777b"/></marker><style>text{font-family:Inter,ui-sans-serif,system-ui,sans-serif}.row{fill:#0d272e;stroke:#38585e}.dimension{fill:#eef9f7;font-size:11px;font-weight:950;letter-spacing:1px}.m2{fill:#d995a3;font-size:11px;font-weight:750}.m3{fill:#79ded6;font-size:11px;font-weight:800}.small{fill:#58777b;font-size:7px;font-weight:900;letter-spacing:1px}.fail{fill:#e26f86;font-size:7px;font-weight:950;letter-spacing:1px}.resolved{fill:#54d8d0;font-size:7px;font-weight:950;letter-spacing:1px}.arrow{stroke:#58777b;stroke-width:1.2;marker-end:url(#arrowhead)}.note{fill:#a7bdbc;font-size:10px}.fine{fill:#587477;font-size:8px}</style></defs><rect width="1400" height="960" fill="#06171c"/><text x="50" y="42" fill="#54d8d0" font-size="14" font-weight="900" letter-spacing="2.4">OSW / AGULHAS · M3 EXPERIMENT CONTRACT</text><text x="50" y="86" fill="#eef9f7" font-size="35" font-weight="950">SURFACE PATHS ARE NOT YET LEAKAGE TRANSPORT.</text><text x="50" y="117" fill="#9db3b2" font-size="12">Six promotion checks derived from published Lagrangian experiment design</text><rect x="1058" y="37" width="297" height="30" rx="15" fill="#102a30" stroke="#e26f86"/><text x="1206.5" y="57" fill="#e26f86" text-anchor="middle" font-size="9.5" font-weight="950" letter-spacing="1">REFERENCE GEOMETRY ACQUIRED · RAW 3-D OPEN</text><g transform="translate(255 139)"><text class="small">M2</text><text x="445" class="small">M3</text></g><g transform="translate(50 154)"><rect width="1300" height="82" rx="12" class="row"/><text x="20" y="25" class="dimension">RELEASE</text><text x="205" y="25" class="m2">four surface centers with equal-count neighborhoods</text><path d="M632 18h35" class="arrow"/><text x="700" y="25" class="m3">full-width/full-depth native 32S section with transport weights</text><text x="20" y="56" class="fail">NOT PROMOTED</text><text x="205" y="56" class="small">CURRENT M2 EVIDENCE</text><text x="700" y="56" class="small">REQUIRED M3 CONTRACT</text></g><g transform="translate(50 248)"><rect width="1300" height="82" rx="12" class="row"/><text x="20" y="25" class="dimension">TIME</text><text x="205" y="25" class="m2">three dates and 150-day paths</text><path d="M632 18h35" class="arrow"/><text x="700" y="25" class="m3">five-day releases for one year and four-year advection</text><text x="20" y="56" class="fail">NOT PROMOTED</text><text x="205" y="56" class="small">CURRENT M2 EVIDENCE</text><text x="700" y="56" class="small">REQUIRED M3 CONTRACT</text></g><g transform="translate(50 342)"><rect width="1300" height="82" rx="12" class="row"/><text x="20" y="25" class="dimension">VELOCITY</text><text x="205" y="25" class="m2">nominal-15-m horizontal OSCAR</text><path d="M632 18h35" class="arrow"/><text x="700" y="25" class="m3">time-varying 3-D eddy-rich velocity</text><text x="20" y="56" class="fail">NOT PROMOTED</text><text x="205" y="56" class="small">CURRENT M2 EVIDENCE</text><text x="700" y="56" class="small">REQUIRED M3 CONTRACT</text></g><g transform="translate(50 436)"><rect width="1300" height="82" rx="12" class="row"/><text x="20" y="25" class="dimension">DESTINATION</text><text x="205" y="25" class="m2">straight 12/15/18E thresholds</text><path d="M632 18h35" class="arrow"/><text x="700" y="25" class="m3">archived West + Northwest GoodHope composite mapped to target grid</text><text x="20" y="56" class="resolved">GEOMETRY ACQUIRED</text><text x="205" y="56" class="small">CURRENT M2 EVIDENCE</text><text x="700" y="56" class="small">REQUIRED M3 CONTRACT</text></g><g transform="translate(50 530)"><rect width="1300" height="82" rx="12" class="row"/><text x="20" y="25" class="dimension">IDENTITY</text><text x="205" y="25" class="m2">first threshold encounter</text><path d="M632 18h35" class="arrow"/><text x="700" y="25" class="m3">Indian-origin transport with complete crossing event log and parity</text><text x="20" y="56" class="fail">NOT PROMOTED</text><text x="205" y="56" class="small">CURRENT M2 EVIDENCE</text><text x="700" y="56" class="small">REQUIRED M3 CONTRACT</text></g><g transform="translate(50 624)"><rect width="1300" height="82" rx="12" class="row"/><text x="20" y="25" class="dimension">THERMODYNAMICS</text><text x="205" y="25" class="m2">none</text><path d="M632 18h35" class="arrow"/><text x="700" y="25" class="m3">temperature, salinity, density classes; heat only under explicit convention</text><text x="20" y="56" class="fail">NOT PROMOTED</text><text x="205" y="56" class="small">CURRENT M2 EVIDENCE</text><text x="700" y="56" class="small">REQUIRED M3 CONTRACT</text></g><rect x="50" y="730" width="1300" height="165" rx="14" fill="#0b242a" stroke="#38585e"/><text x="72" y="758" fill="#eef9f7" font-size="14" font-weight="950">THE TARGET EXPERIMENT</text><text x="72" y="786" fill="#54d8d0" font-size="18" font-weight="950">32°S FULL WIDTH + DEPTH</text><path d="M344 780h82" class="arrow"/><text x="458" y="786" fill="#54d8d0" font-size="18" font-weight="950">5-DAY RELEASES × 1 YEAR</text><path d="M748 780h82" class="arrow"/><text x="862" y="786" fill="#54d8d0" font-size="18" font-weight="950">3-D TRACKS × 4 YEARS</text><text x="72" y="821" class="note">Each particle carries native-cell volume transport. Every GoodHope crossing retains time and direction.</text><text x="72" y="845" fill="#ffad55" font-size="12" font-weight="900">ALL CROSSINGS</text><text x="200" y="845" class="note">exchange and thermohaline transformation</text><text x="620" y="845" fill="#d78cff" font-size="12" font-weight="900">ODD CROSSINGS</text><text x="755" y="845" class="note">water remaining in the South Atlantic for overturning questions</text><text x="72" y="874" class="fine">PUBLISHED 55-RECORD GOODHOPE COMPOSITE ACQUIRED · NEW RUN MUST MAP IT TO THE TARGET GRID · 32°S / ACT RELEASE SENSITIVITY REQUIRED · HEAT REMAINS A SEPARATE CONVENTION</text><text x="50" y="928" class="fine">CONTRACT + ATTRIBUTED REPLICATION · NO RAW 3-D VELOCITY DOWNLOADED · NO LEAKAGE, VOLUME, HEAT, OR AMOC ESTIMATE · SOURCES AND ACCEPTANCE TESTS IN THE JSON RECEIPT</text></svg>