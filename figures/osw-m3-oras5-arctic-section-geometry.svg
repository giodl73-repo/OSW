<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc" data-motion-level="m3-arctic-section-geometry"><title id="title">Same grid, three different Arctic cross-sections</title><desc id="desc">Full-depth native geometry compares deep Fram Strait with two shallow Barents section meanings after zero mask mismatches and exact depth-bin area closure.</desc><metadata>Internal native mask/thickness/area consistency only. Passing does not independently validate exact ORAS5 face thickness, choose between Barents semantics, align state fields, or calculate volume, heat, uncertainty, or Arctic delivery.</metadata><defs><style>text{font-family:Inter,ui-sans-serif,system-ui,sans-serif}.panel{fill:#092229;stroke:#36575d}.head{fill:#eef8f5;font-size:13px;font-weight:950;letter-spacing:1px}.metric{fill:#55ded3;font-size:32px;font-weight:950}.body{fill:#aac0bf;font-size:12px}.fine{fill:#78979a;font-size:9px}.pct{fill:#dce9e5;font-size:10px;font-weight:900}.label{fill:#aac0bf;font-size:10px;font-weight:900;letter-spacing:1px}.check{fill:#55ded3;font-size:11px;font-weight:900}</style></defs><rect width="1400" height="900" fill="#06171c"/><text x="52" y="42" fill="#55ded3" font-size="12" font-weight="950" letter-spacing="2">OSW / ARCTIC ENTRANCES · FULL-DEPTH GEOMETRY</text><text x="52" y="87" fill="#eef8f5" font-size="36" font-weight="950">SAME GRID. THREE DIFFERENT CROSS-SECTIONS.</text><text x="52" y="119" class="body">Area and depth constrain what future velocity can carry. They are not transport by themselves.</text><g><rect x="52" y="160" width="404" height="596" rx="14" class="panel"/><text x="72" y="190" class="head">FRAM STRAIT</text><text x="72" y="222" class="metric">814 km²</text><text x="72" y="244" class="body">native wet cross-sectional area</text><text x="72" y="285" fill="#eef8f5" font-size="18" font-weight="950">60 FACES · 2,373 WET CELLS</text><text x="72" y="310" class="fine">COAST ↔ COAST · M