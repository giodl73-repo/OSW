<rect x="48" y="842" width="1304" height="44" rx="12" fill="#0d242a"/><text x="68" y="862" class="note">Depth changes the story: substantial net water transport persists below 700 m, while temperature weighting concentrates the 0°C-reference heat signal upward.</text><text x="68" y="878" class="fine">DECLARED MIDPOINT DEPTH BINS · NOT WATER MASSES, OVERTURNING CLASSES, CONVERGENCE, MODEL-NATIVE TRACER FLUX, OR ANTARCTIC HEAT DELIVERY</text><metadata>Five declared depth strata summarize native layer contributions. Midpoint binning is descriptive and does not create water masses, neutral-density classes, overturning streamfunctions, convergence, or Antarctic heat delivery.</metadata></svg>