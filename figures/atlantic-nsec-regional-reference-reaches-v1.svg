<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="690" viewBox="0 0 1060 690" role="img" aria-labelledby="title desc"><title id="title">Northern Atlantic SEC branch reference reaches</title><desc id="desc">Two editorial paths between 0 degrees and 35 degrees west, from published seasonal circulation schematics. Their geodesic lengths are about 3900 kilometres each. These are partial reference distances, not measured whole-current lengths.</desc><rect width="1060" height="690" fill="#f3f8fa"/><g font-family="Arial,sans-serif" fill="#153a49"><text x="35" y="45" font-size="27" font-weight="bold">Northern SEC branch · middle-Atlantic reference reaches</text><text x="35" y="79" font-size="18">Source: Stramma &amp; Schott (1999), Figure 4 · editorial regional references</text><rect x="35" y="110" width="480" height="365" rx="10" fill="white" stroke="#9bbac6"/><text x="55" y="148" font-size="21" font-weight="bold">Northern spring schematic</text><path d="M70 180V380" stroke="#d8e5e9"/><text x="70" y="404" text-anchor="middle" font-size="14">40°W</text><path d="M115 180V380" stroke="#d8e5e9"/><text x="115" y="404" text-anchor="middle" font-size="14">35°W</text><path d="M160 180V380" stroke="#d8e5e9"/><text x="160" y="404" text-anchor="middle" font-size="14">30°W</text><path d="M250 180V380" stroke="#d8e5e9"/><text x="250" y="404" text-anchor="middle" font-size="14">20°W</text><path d="M340 180V380" stroke="#d8e5e9"/><text x="340" y="404" text-anchor="middle" font-size="14">10°W</text><path d="M430 180V380" stroke="#d8e5e9"/><text x="430" y="404" text-anchor="middle" font-size="14">0°</text><path d="M70 380H430" stroke="#d8e5e9"/><text x="62" y="385" text-anchor="end" font-size="14">0°N</text><path d="M70 328H430" stroke="#d8e5e9"/><text x="62" y="333" text-anchor="end" font-size="14">2°N</text><path d="M70 276H430" stroke="#d8e5e9"/><text x="62" y="281" text-anchor="end" font-size="14">4°N</text><path d="M70 224H430" stroke="#d8e5e9"/><text x="62" y="229" text-anchor="end" font-size="14">6°N</text><polyline points="430.00,328.00 340.00,328.00 250.00,328.00 205.00,325.40 160.00,322.80 115.00,307.20" fill="none" stroke="#006e80" stroke-width="4"/><circle cx="430" cy="328" r="6" fill="#955e22"/><circle cx="115" cy="307.2" r="6" fill="#955e22"/><text x="55" y="447" font-size="20" font-weight="bold">About 3,900 km · selected 0°–35°W reach</text><rect x="545" y="110" width="480" height="365" rx="10" fill="white" stroke="#9bbac6"/><text x="565" y="148" font-size="21" font-weight="bold">Northern fall schematic</text><path d="M580 180V380" stroke="#d8e5e9"/><text x="580" y="404" text-anchor="middle" font-size="14">40°W</text><path d="M625 180V380" stroke="#d8e5e9"/><text x="625" y="404" text-anchor="middle" font-size="14">35°W</text><path d="M670 180V380" stroke="#d8e5e9"/><text x="670" y="404" text-anchor="middle" font-size="14">30°W</text><path d="M760 180V380" stroke="#d8e5e9"/><text x="760" y="404" text-anchor="middle" font-size="14">20°W</text><path d="M850 180V380" stroke="#d8e5e9"/><text x="850" y="404" text-anchor="middle" font-size="14">10°W</text><path d="M940 180V380" stroke="#d8e5e9"/><text x="940" y="404" text-anchor="middle" font-size="14">0°</text><path d="M580 380H940" stroke="#d8e5e9"/><text x="572" y="385" text-anchor="end" font-size="14">0°N</text><path d="M580 328H940" stroke="#d8e5e9"/><text x="572" y="333" text-anchor="end" font-size="14">2°N</text><path d="M580 276H940" stroke="#d8e5e9"/><text x="572" y="281" text-anchor="end" font-size="14">4°N</text><path d="M580 224H940" stroke="#d8e5e9"/><text x="572" y="229" text-anchor="end" font-size="14">6°N</text><polyline points="940.00,328.00 850.00,328.00 760.00,322.80 715.00,320.20 670.00,320.20 625.00,320.20" fill="none" stroke="#006e80" stroke-width="4"/><circle cx="940" cy="328" r="6" fill="#955e22"/><circle cx="625" cy="320.2" r="6" fill="#955e22"/><text x="565" y="447" font-size="20" font-weight="bold">About 3,900 km · selected 0°–35°W reach</text><text x="35" y="518" font-size="19" font-weight="bold">Brown points are OSW interior gates, not current origin or termination.</text><text x="35" y="553" font-size="18">Rounded waypoints follow the labelled nSEC schematic. The other SEC branches are excluded.</text><text x="35" y="587" font-size="18">54 drawing and gate cases are retained separately; their spread is not scientific uncertainty.</text><text x="35" y="621" font-size="18">Whole-current length, annual ranges and observed velocity-core geometry remain unresolved.</text><text x="35" y="658" font-size="16">WGS84 segment sums · approximate 0–100 m schematic context · no physical footprint or seasonal animation</text></g></svg>