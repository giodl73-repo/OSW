<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img" aria-labelledby="title desc">
<title id="title">Pemba Channel seasonal drifter speeds</title>
<desc id="desc">Pooled summaries. Lines show observed minima to maxima; dots show medians. These are regional speeds, not current dimensions or confidence intervals.</desc>
<rect width="800" height="330" fill="#f8fafc"/>
<g font-family="system-ui,sans-serif" fill="#172e46">
<text x="24" y="32" font-size="21">Pemba Channel: seasonal near-surface speed</text>
<text x="24" y="57" font-size="13">Semba et al. 2019 · Table 2 · pooled 1986–2017 observations</text>
<text x="24" y="105" font-size="15">SE · n=197</text>
<line x1="220.8" x2="677.1" y1="100" y2="100" stroke="#387a9c" stroke-width="5"/>
<circle cx="436.79999999999995" cy="100" r="6" fill="#182e46"/>
<text x="700" y="105" font-size="14">0.84</text>
<text x="24" y="153" font-size="15">IN · n=80</text>
<line x1="226.2" x2="633.9000000000001" y1="148" y2="148" stroke="#387a9c" stroke-width="5"/>
<circle cx="374.7" cy="148" r="6" fill="#182e46"/>
<text x="700" y="153" font-size="14">0.61</text>
<text x="24" y="201" font-size="15">NE · n=51</text>
<line x1="223.5" x2="571.8" y1="196" y2="196" stroke="#387a9c" stroke-width="5"/>
<circle cx="363.9" cy="196" r="6" fill="#182e46"/>
<text x="700" y="201" font-size="14">0.57</text>
<text x="210" y="232" text-anchor="middle" font-size="13">0</text>
<text x="345.0" y="232" text-anchor="middle" font-size="13">0.5</text>
<text x="480" y="232" text-anchor="middle" font-size="13">1</text>
<text x="615.0" y="232" text-anchor="middle" font-size="13">1.5</text>
<text x="750" y="232" text-anchor="middle" font-size="13">2</text>
<text x="445" y="253" text-anchor="middle" font-size="13">Speed (m/s) · line: observed range · dot: median</text>
<text x="24" y="280" font-size="12">SE: May–Sep · IN: Apr, Oct · NE: Nov–Mar. Unequal sampling; 45 unique drifters.</text>
<text x="24" y="300" font-size="12">NE minimum: table 0.05; prose 0.04 m/s. Conflict retained. Ranges are not uncertainty.</text>
