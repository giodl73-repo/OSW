<text x="70" y="822" font-size="14" fill="#f0a54b" font-weight="700" text-anchor="start" opacity="1">SECTION MEANING MATTERS</text>
<text x="70" y="854" font-size="21" fill="#e6f1f4" font-weight="600" text-anchor="start" opacity="1">The broader Barents closure carries +0.41 Sv (12.6%) more net flow than the observational proxy.</text>
<text x="70" y="884" font-size="14" fill="#8fb0bb" font-weight="400" text-anchor="start" opacity="1">That is an endpoint/domain difference—not an uncertainty interval. Heat is advective and reference-relative; it is not gateway convergence or an Arctic heat budget.</text>
<text x="1430" y="914" font-size="12" fill="#55747e" font-weight="700" text-anchor="end" opacity="1">OSW · OCEAN STATES OF THE WORLD</text>
