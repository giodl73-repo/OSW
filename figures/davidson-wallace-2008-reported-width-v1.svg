<title id="title">Davidson Current: reported regional transect width</title>
<desc id="description">Source reports about 35 nautical miles, normalized to About 65 km. An approximate poleward-flow transect span. Depth average 27–59 m, Line 67 off Monterey Bay. Campaign 23–30 January 2008; exact occupation date unknown. Course cruise report, not verified peer review. No paired edge coordinates, uncertainty or annual range supplied. No geographic axis or width footprint is drawn.</desc>
