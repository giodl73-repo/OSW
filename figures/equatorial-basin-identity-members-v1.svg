<svg xmlns="http://www.w3.org/2000/svg" width="600" height="690" viewBox="0 0 600 690" role="img" aria-labelledby="title desc">
  <title id="title">Equatorial current families and basin-qualified members</title>
  <desc id="desc">North Equatorial Current has Atlantic and Pacific qualifications. South Equatorial Current has Atlantic, Pacific and Indian qualifications. The Indian North Equatorial and Monsoon naming case remains unresolved. These editorial relationships do not provide lengths, widths, current trajectories or inherited observations.</desc>
  <rect width="600" height="690" fill="#f4f8f8"/>
  <g font-family="Arial,sans-serif" fill="#153e4c">
    <text x="24" y="35" font-size="14" fill="#087f8c" font-weight="700">OSW CURRENT IDENTITIES</text>
    <text x="24" y="69" font-size="25" font-weight="700">Separate basins, separate records</text>
    <text x="24" y="100" font-size="16">NOAA names the flows; OSW qualifies the basin labels.</text>
    <rect x="20" y="126" width="560" height="180" rx="12" fill="white" stroke="#aac5cd"/>
    <text x="38" y="159" font-size="20" font-weight="700">North Equatorial Current</text>
    <text x="38" y="184" font-size="14" fill="#496c77">Existing cross-basin family</text>
    <path d="M47 199 V273 M47 222 H66 M47 264 H66" fill="none" stroke="#8baeb8" stroke-width="2"/>
    <text x="76" y="228" font-size="18">Atlantic North Equatorial Current</text>
    <text x="76" y="270" font-size="18">Pacific North Equatorial Current</text>
    <rect x="20" y="322" width="560" height="218" rx="12" fill="white" stroke="#aac5cd"/>
    <text x="38" y="355" font-size="20" font-weight="700">South Equatorial Current</text>
    <text x="38" y="380" font-size="14" fill="#496c77">Existing cross-basin family</text>
    <path d="M47 395 V511 M47 418 H66 M47 460 H66 M47 502 H66" fill="none" stroke="#8baeb8" stroke-width="2"/>
    <text x="76" y="424" font-size="18">Atlantic South Equatorial Current</text>
    <text x="76" y="466" font-size="18">Pacific South Equatorial Current</text>
    <text x="76" y="508" font-size="18">Indian South Equatorial Current</text>
    <text x="24" y="575" font-size="16" font-weight="700">Membership is naming context, not a physical connection.</text>
    <text x="24" y="603" font-size="15">Lengths, widths, dates and map geometry are not inherited.</text>
    <text x="24" y="631" font-size="15">Indian NEC / Monsoon naming remains unresolved.</text>
    <text x="24" y="662" font-size="13" fill="#496c77">Source: NOAA Tides and Currents Glossary · NEC and SEC entries</text>
  </g>
</svg>
