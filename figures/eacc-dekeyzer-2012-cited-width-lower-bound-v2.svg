  <g id="text_10">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start" x="41.58" y="305.136" transform="rotate(-0 41.58 305.136)">Width dates, numerical depth, edge definition and uncertainty are unreported. No annual range inferred.</text>
