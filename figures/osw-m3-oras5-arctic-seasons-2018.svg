<text x="70" y="850" font-size="14" fill="#26bad8" font-weight="700" text-anchor="start" opacity="1">THE FRAM SIGN SPLIT IS THE RESULT</text>
<text x="70" y="882" font-size="21" fill="#e6f1f4" font-weight="650" text-anchor="start" opacity="1">Net volume is southward in every snapshot; warm northward flow still makes the 0°C-reference heat signal positive.</text>
<text x="70" y="913" font-size="14" fill="#8fb0bb" font-weight="400" text-anchor="start" opacity="1">Four snapshots are not an annual mean. Open-gate heat transport is reference-relative—not convergence, storage, or heat delivered inside the Arctic.</text>
<text x="1430" y="913" font-size="12" fill="#55747e" font-weight="700" text-anchor="end" opacity="1">OSW · OCEAN STATES OF THE WORLD</text>
