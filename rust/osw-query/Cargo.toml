[package]
name = "osw-query"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "osw-query-cli"
path = "src/main.rs"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
geo = { version = "=0.28.0", default-features = false }
sha2 = "=0.10.9"

[profile.release]
opt-level = "s"
lto = true
strip = true
