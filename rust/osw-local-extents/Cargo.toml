[package]
name = "osw-local-extents"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "osw-local-extents-cli"
path = "src/main.rs"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.149", features = ["float_roundtrip"] }
sha2 = "=0.10.9"

[profile.dev]
opt-level = 1
debug-assertions = true
overflow-checks = true

[profile.release]
opt-level = "s"
lto = true
strip = true
