name: EAC connected layer thickness v1
"on":
  push:
    branches: [codex/current-measurement-gaps]
    paths:
      - .github/workflows/eac-connected-layer-thickness-v1.yml
      - analysis/derive_eac_connected_layer_thickness_v1.py
      - analysis/test_eac_connected_layer_thickness_v1.py
      - research/eac-connected-layer-thickness-operator-v1.json
concurrency:
  group: osw-current-gap-delivery
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  derive:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            analysis/derive_eac_connected_layer_thickness_v1.py
            analysis/test_eac_connected_layer_thickness_v1.py
            research/eac-connected-layer-thickness-operator-v1.json
            research/source-data/eac-hycom-route-depth-v2/candidate.json
            research/eac-hycom-route-depth-operator-v2.json
            research/eac-hycom-route-depth-source-review-v2.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Verify and derive frozen profile layers on one idle CPU
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_eac_connected_layer_thickness_v1.py' -v
          taskset -c "$cpu" nice -n 15 python analysis/derive_eac_connected_layer_thickness_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: eac-connected-layer-thickness-v1
          path: eac-connected-layer-thickness-v1/
          retention-days: 7
