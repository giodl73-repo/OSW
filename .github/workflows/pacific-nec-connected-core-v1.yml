name: Diagnose Pacific NEC connected product cores v1
"on":
  push:
    branches: [codex/current-measurement-gaps]
    paths:
      - research/pacific-nec-connected-core-request-v1.json
      - .github/workflows/pacific-nec-connected-core-v1.yml
concurrency:
  group: osw-current-gap-delivery
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
env:
  GH_TOKEN: ${{ github.token }}
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  OSW_PACIFIC_NEC_CONNECTED_CORE_V1: "1"
jobs:
  select-request:
    runs-on: ubuntu-24.04
    outputs:
      execute: ${{ steps.request.outputs.execute }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: research/pacific-nec-connected-core-request-v1.json
      - id: request
        run: |
          python - <<'PY'
          import json,os,pathlib
          r=json.loads(pathlib.Path('research/pacific-nec-connected-core-request-v1.json').read_bytes())
          assert r['schema']=='osw.pacific-nec-connected-core-request.v1'
          assert type(r['execute']) is bool
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('execute='+str(r['execute']).lower()+'\n')
          PY
  diagnose:
    needs: select-request
    if: needs.select-request.outputs.execute == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install pinned diagnostic dependencies on one CPU
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python -m pip install --only-binary=:all: numpy==2.2.6 pyproj==3.7.2 matplotlib==3.10.3
      - name: Test disconnections, ties, vector direction, branch anchoring and custody
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p test_pacific_nec_connected_core_v1.py -v
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p test_run_pacific_nec_connected_core_v1.py -v
      - name: Replay saved source and diagnose all connected-core and temporal cases
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 timeout 900s python analysis/run_pacific_nec_connected_core_v1.py
      - name: Retain compact diagnostics and figures only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pacific-nec-connected-core-evidence-v1
          path: .pytest_cache/pacific-nec-connected-core-v1/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 90
      - name: Preserve full scenario witnesses on cloud
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pacific-nec-connected-core-witnesses-v1
          path: .pytest_cache/pacific-nec-connected-core-witnesses-v1/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 90
