name: Current depth NWASC selected noncore water mass extents v7
"on":
  push:
    branches: [codex/current-measurement-gaps]
    paths:
      - .github/workflows/current-depth-reference-inventory-v7.yml
      - analysis/build_current_depth_reference_inventory_v7.py
      - analysis/derive_nwasc_selected_noncore_depths_v1.py
