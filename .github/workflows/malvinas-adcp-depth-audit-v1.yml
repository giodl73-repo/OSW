name: Malvinas native ADCP depth audit v1
"on":
  push:
    branches: [codex/current-measurement-gaps]
    paths:
      - .github/workflows/malvinas-adcp-depth-audit-v1.yml
      - analysis/audit_malvinas_adcp_depth_v1.py
      - analysis/test_malvinas_adcp_depth_audit_v1.py
      - research/malvinas-adcp-depth-audit-operator-v1.json
concurrency:
  group: osw-current-gap-delivery
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            analysis/audit_malvinas_adcp_depth_v1.py
            analysis/test_malvinas_adcp_depth_audit_v1.py
            research/malvinas-adcp-depth-audit-operator-v1.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Verify audit rules then retrieve one dated crossing sequentially
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p test_malvinas_adcp_depth_audit_v1.py -v
          taskset -c "$cpu" nice -n 15 python analysis/audit_malvinas_adcp_depth_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: malvinas-adcp-depth-audit-v1
          path: malvinas-adcp-depth-audit-v1/
          retention-days: 7
