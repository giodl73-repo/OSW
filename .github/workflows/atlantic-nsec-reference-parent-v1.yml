name: Atlantic SEC northern-branch parent and reference geography
on:
  push:
    branches: [codex/current-measurement-gaps]
    paths:
      - research/atlantic-nsec-reference-parent-request-v1.json
      - .github/workflows/atlantic-nsec-reference-parent-v1.yml
concurrency:
  group: osw-current-gap-delivery
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
env:
  GH_TOKEN: ${{ github.token }}
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
jobs:
  select-request:
    runs-on: ubuntu-24.04
    outputs:
      execute: ${{ steps.request.outputs.execute }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: research/atlantic-nsec-reference-parent-request-v1.json
      - id: request
        run: |
          python - <<'PY'
          import json,os,pathlib
          r=json.loads(pathlib.Path('research/atlantic-nsec-reference-parent-request-v1.json').read_bytes())
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('execute='+str(r['execute'] is True).lower()+'\n')
          PY
  geography:
    needs: select-request
    if: needs.select-request.outputs.execute == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Verify frozen case before geographic dependencies or coast data
        run: |
          cpu=$(python -c "import os;print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python analysis/check_atlantic_nsec_reference_parent_v1.py --preflight-only
      - name: Install pinned geographic dependencies on one CPU
        run: |
          cpu=$(python -c "import os;print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python -m pip install pyproj==3.7.2 shapely==2.1.2 pyshp==2.3.1 matplotlib==3.10.8
      - name: Synthetic geodesic and local-refusal checks
        run: |
          cpu=$(python -c "import os;print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p test_atlantic_nsec_reference_reaches_v1.py -v
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p test_atlantic_nsec_reference_parent_v1.py -v
      - name: Audit installed duplicates and screen all54 schematic geography cases
        run: |
          cpu=$(python -c "import os;print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python analysis/check_atlantic_nsec_reference_parent_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlantic-nsec-reference-parent-evidence-v1
          path: |
            .pytest_cache/atlantic-nsec-reference-parent-v1/*.json
            .pytest_cache/atlantic-nsec-reference-parent-v1/*.png
          include-hidden-files: true
          if-no-files-found: ignore
