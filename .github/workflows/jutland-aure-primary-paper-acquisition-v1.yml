name: Jutland Aure primary depth paper custody v1
"on":
  push:
    branches: [codex/current-measurement-gaps]
    paths:
      - .github/workflows/jutland-aure-primary-paper-acquisition-v1.yml
      - analysis/acquire_jutland_aure_primary_paper_v1.py
      - analysis/test_jutland_aure_primary_paper_acquisition_v1.py
      - plans/jutland-aure-primary-depth-reference-protocol-v1.md
      - research/jutland-aure-primary-paper-acquisition-operator-v1.json
concurrency:
  group: osw-current-gap-delivery
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            analysis/acquire_jutland_aure_primary_paper_v1.py
            analysis/acquire_ncc_skagseth_table1_v1.py
            analysis/test_jutland_aure_primary_paper_acquisition_v1.py
            plans/jutland-aure-primary-depth-reference-protocol-v1.md
            research/jutland-aure-primary-paper-acquisition-operator-v1.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Check custody guards then request the original paper once
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_jutland_aure_primary_paper_acquisition_v1.py' -v
          taskset -c "$cpu" nice -n 15 python analysis/acquire_jutland_aure_primary_paper_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jutland-aure-primary-paper-v1
          path: jutland-aure-primary-paper-v1/
          retention-days: 7
