name: EAC mooring depth benchmark v1
"on":
  push:
    branches: [codex/current-measurement-gaps]
    paths:
      - .github/workflows/eac-mooring-depth-benchmark-v1.yml
      - analysis/acquire_eac_mooring_depth_benchmark_v1.py
      - analysis/test_eac_mooring_depth_benchmark_v1.py
      - research/eac-mooring-depth-benchmark-operator-v1.json
concurrency:
  group: osw-current-gap-delivery
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            analysis/acquire_eac_mooring_depth_benchmark_v1.py
            analysis/test_eac_mooring_depth_benchmark_v1.py
            analysis/derive_eac_connected_layer_thickness_v1.py
            analysis/test_eac_connected_layer_thickness_v1.py
            research/eac-mooring-depth-benchmark-operator-v1.json
            research/source-data/eac-hycom-route-depth-v2/candidate.json
            research/eac-hycom-route-depth-source-review-v2.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Test and acquire bounded unfilled mooring profiles
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python -m pip install netCDF4==1.7.4 numpy==2.3.4 pyproj==3.7.2
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_eac_connected_layer_thickness_v1.py' -v
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_eac_mooring_depth_benchmark_v1.py' -v
          taskset -c "$cpu" nice -n 15 python analysis/acquire_eac_mooring_depth_benchmark_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eac-mooring-depth-benchmark-v1
          path: eac-mooring-depth-benchmark-v1/
          retention-days: 7
