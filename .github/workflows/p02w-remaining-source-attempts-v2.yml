name: P02W original remaining source attempts v2
"on":
  push:
    branches: [codex/current-measurement-gaps]
    paths:
      - .github/workflows/p02w-remaining-source-attempts-v2.yml
      - analysis/complete_p02w_remaining_source_attempts_v2.py
      - analysis/test_p02w_remaining_source_attempts_v2.py
      - research/p02w-remaining-source-attempts-operator-v2.json
      - plans/p02w-remaining-source-attempts-protocol-v2.md
concurrency:
  group: osw-current-gap-delivery
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  finish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/p02w-remaining-source-attempts-v2.yml
            analysis/complete_p02w_remaining_source_attempts_v2.py
            analysis/test_p02w_remaining_source_attempts_v2.py
            analysis/acquire_a20_gulf_stream_cast_headers_v1.py
            analysis/inspect_retained_a20_gulf_stream_headers_v2.py
            plans/p02w-remaining-source-attempts-protocol-v2.md
            research/p02w-remaining-source-attempts-operator-v2.json
            research/p02w-kuroshio-native-depth-operator-v1.json
            research/source-data/p02w-kuroshio-native-depths-v1/journal.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install bounded custody dependencies on one CPU
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python -m pip install numpy==2.3.4 netCDF4==1.7.4
      - name: Check original case ledger and attempt only the two unattempted files
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          export OSW_P02W_REMAINING_PHASE_START=$(python -c "import time;print(time.monotonic())")
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_p02w_remaining_source_attempts_v2.py' -v
          taskset -c "$cpu" nice -n 15 python analysis/complete_p02w_remaining_source_attempts_v2.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p02w-remaining-source-attempts-v2
          path: p02w-remaining-source-attempts-v2/
          retention-days: 7
          if-no-files-found: error
