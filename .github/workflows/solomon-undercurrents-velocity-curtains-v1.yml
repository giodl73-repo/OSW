      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Reproduce every original case and derive native depth variation without retrieval
        timeout-minutes: 5
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python -m pip install numpy==2.4.1 netCDF4==1.7.4 pyproj==3.7.2
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_solomon_undercurrents_interval_depth_sections_v1.py' -v
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_solomon_undercurrents_velocity_curtains_v1.py' -v
          taskset -c "$cpu" nice -n 15 python analysis/derive_solomon_undercurrents_velocity_curtains_v1.py --current current:new-ireland-coastal-undercurrent
          taskset -c "$cpu" nice -n 15 python analysis/derive_solomon_undercurrents_velocity_curtains_v1.py --current current:solomon-island-coastal-undercurrent
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: solomon-undercurrents-velocity-curtains-new-ireland-coastal-undercurrent-v1
          path: solomon-undercurrents-velocity-curtains-v1/new-ireland-coastal-undercurrent/
          retention-days: 7
      - uses: actions/upload-artifact@v4
