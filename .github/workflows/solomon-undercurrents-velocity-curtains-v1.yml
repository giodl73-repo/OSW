name: New Ireland and Solomon Islands undercurrent depth contours v1
"on":
  push:
    branches: [codex/current-measurement-gaps]
    paths:
      - .github/workflows/solomon-undercurrents-velocity-curtains-v1.yml
      - analysis/derive_solomon_undercurrents_velocity_curtains_v1.py
      - analysis/test_solomon_undercurrents_velocity_curtains_v1.py
      - plans/solomon-undercurrents-velocity-curtains-protocol-v1.md
      - research/solomon-undercurrents-velocity-curtains-operator-v1.json
concurrency:
  group: osw-current-gap-delivery
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  derive:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
