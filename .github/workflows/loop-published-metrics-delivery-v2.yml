name: Verify compatible Loop Current scalar delivery v2

"on":
  push:
    branches: [codex/current-measurement-gaps]
    paths:
      - research/loop-published-metrics-delivery-request-v2.json
      - .github/workflows/loop-published-metrics-delivery-v2.yml

concurrency:
  group: osw-current-gap-delivery
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}
  CARGO_BUILD_JOBS: "1"
  RUST_TEST_THREADS: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  compatible-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - id: request
        name: Read compatible scalar delivery request
        run: |
          python - <<'PY'
          import json, os, pathlib
          request=json.loads(pathlib.Path('research/loop-published-metrics-delivery-request-v2.json').read_bytes())
          assert request['schema']=='osw.loop-published-metrics-delivery-request.v2'
          assert type(request['execution_permitted']) is bool
          with open(os.environ['GITHUB_OUTPUT'],'a') as stream:
              stream.write('enabled='+str(request['execution_permitted']).lower()+'\n')
          PY
      - uses: actions/setup-python@v6
        if: steps.request.outputs.enabled == 'true'
        with:
          python-version: "3.14.8"
      - uses: actions/setup-node@v6
        if: steps.request.outputs.enabled == 'true'
        with:
          node-version: "24"
      - name: Verify compatible source and exact installed parent
        if: steps.request.outputs.enabled == 'true'
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python analysis/check_loop_published_metrics_delivery_v2.py --cloud-delivery --preflight-only
      - name: Check scalar admission and delivery preservation fixtures sequentially
        if: steps.request.outputs.enabled == 'true'
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p test_loop_published_metrics_query_v1.py -v
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p test_loop_published_metrics_delivery_v1.py -v
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p test_loop_published_metrics_cloud_v2.py -v
      - name: Install one matching compiler and its locked dependencies
        if: steps.request.outputs.enabled == 'true'
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 rustup toolchain install 1.95.0 --profile minimal --target wasm32-unknown-unknown
          taskset -c "$cpu" nice -n 15 cargo +1.95.0 fetch --locked --manifest-path rust/osw-query/Cargo.toml
      - name: Install the cloud browser dependency
        if: steps.request.outputs.enabled == 'true'
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python -m pip install playwright==1.58.0
          taskset -c "$cpu" nice -n 15 python -m playwright install --with-deps chromium
      - name: Append, build matching engine, compare both stores, then review UI
        if: steps.request.outputs.enabled == 'true'
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python analysis/check_loop_published_metrics_delivery_v2.py --cloud-delivery
      - name: Retain compact source, preservation, API and browser receipts
        if: always() && steps.request.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: loop-published-metrics-delivery-evidence-v2
          path: |
            .pytest_cache/loop-published-metrics-delivery-v2/prepared.json
            .pytest_cache/loop-published-metrics-delivery-v2/engine.json
            .pytest_cache/loop-published-metrics-delivery-v2/native-response-custody.json
            .pytest_cache/loop-published-metrics-delivery-v2/main-parity.json
            .pytest_cache/loop-published-metrics-delivery-v2/index-parity.json
            .pytest_cache/loop-published-metrics-delivery-v2/browser.json
            .pytest_cache/loop-published-metrics-delivery-v2/result.json
            .pytest_cache/loop-published-metrics-delivery-v2/failure.json
            .pytest_cache/loop-published-metrics-delivery-v2/browser-failure.json
            .pytest_cache/loop-published-metrics-delivery-v2/*.png
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 90
      - name: Retain verified derived files and matching engine only in cloud
        if: always() && steps.request.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: loop-published-metrics-derived-candidate-v2
          path: .pytest_cache/loop-published-metrics-delivery-v2/artifact/
          include-hidden-files: true
          if-no-files-found: ignore
          compression-level: 1
          retention-days: 90
