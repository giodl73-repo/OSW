      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install frozen reference-loader dependencies on one CPU
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python -m pip install numpy==2.3.4 netCDF4==1.7.4 pyproj==3.7.2
      - name: Check synthetic admission gates and compile actual scalar references offline
        timeout-minutes: 3
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          export OSW_OMAN_ADMISSION_START=$(python -c "import time;print(time.monotonic())")
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_current_depth_reference_inventory_v34.py' -v
          taskset -c "$cpu" nice -n 15 python analysis/build_current_depth_reference_inventory_v34.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-depth-reference-inventory-v34
          path: current-depth-reference-inventory-v34/
          retention-days: 7
          if-no-files-found: error
