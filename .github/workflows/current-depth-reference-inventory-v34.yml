name: Oman published plume descriptors canonical admission v34
"on":
  push:
    branches: [codex/current-measurement-gaps]
    paths:
      - analysis/load_current_depth_reference_inventory_v34.py
      - analysis/build_current_depth_reference_inventory_v34.py
      - analysis/test_current_depth_reference_inventory_v34.py
      - research/current-depth-reference-inventory-operator-v34.json
      - plans/oman-2025-published-depth-reference-admission-v34.md
      - .github/workflows/current-depth-reference-inventory-v34.yml
concurrency:
  group: osw-current-gap-delivery
  cancel-in-progress: false
permissions:
  contents: read
jobs:
