name: Bab al Mandab independent primary hydraulic evidence v1
"on":
  push:
    branches: [codex/current-measurement-gaps]
    paths:
      - analysis/acquire_pratt2000_bab_mandab_primary_v1.py
      - analysis/test_pratt2000_bab_mandab_primary_v1.py
      - plans/pratt2000-bab-mandab-primary-protocol-v1.md
      - research/pratt2000-bab-mandab-primary-operator-v1.json
      - .github/workflows/pratt2000-bab-mandab-primary-v1.yml
concurrency:
  group: osw-current-gap-delivery
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            analysis/acquire_pratt2000_bab_mandab_primary_v1.py
            analysis/test_pratt2000_bab_mandab_primary_v1.py
            plans/pratt2000-bab-mandab-primary-protocol-v1.md
            research/pratt2000-bab-mandab-primary-operator-v1.json
            .github/workflows/pratt2000-bab-mandab-primary-v1.yml
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Sequential one CPU checks and bounded primary source capture
        run: |
          cpu=$(python -c "import os;print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python -m pip install PyMuPDF==1.28.2
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_pratt2000_bab_mandab_primary_v1.py' -v
          taskset -c "$cpu" nice -n 15 timeout --signal=TERM --kill-after=5s 70s python analysis/acquire_pratt2000_bab_mandab_primary_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pratt2000-bab-mandab-primary-v1
          path: pratt2000-bab-mandab-primary-v1/
          retention-days: 7
