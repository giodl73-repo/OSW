name: Current depth additive inventory v38
"on":
  push:
    branches: [codex/current-measurement-gaps]
    paths:
      - .github/workflows/current-depth-route-projections-v38.yml
      - analysis/build_current_depth_route_projections_v38.py
      - analysis/test_current_depth_route_projections_v38.py
      - research/current-depth-route-projection-operator-v38.json
concurrency:
  group: osw-current-gap-delivery
  cancel-in-progress: false
permissions:
  contents: read
jobs:
