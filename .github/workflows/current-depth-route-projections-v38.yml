      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build and verify Mediterranean boundary interval additive inventory on one idle CPU
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python -m pip install netCDF4==1.7.4 numpy==2.3.4 pyproj==3.7.2
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_current_depth_route_projections_v38.py' -v
          taskset -c "$cpu" nice -n 15 python analysis/build_current_depth_route_projections_v38.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-depth-route-projections-v38
          path: current-depth-route-projections-v38/
          retention-days: 7
