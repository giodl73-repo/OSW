name: HTTP projected DDS and complete native coordinate controls v2
"on":
  push:
    branches: [codex/current-measurement-gaps]
    paths:
      - .github/workflows/hycom-http-coordinate-probe-v2.yml
      - analysis/probe_hycom_http_coordinates_v2.py
      - analysis/test_hycom_http_coordinates_v2.py
      - plans/hycom-projected-dds-coordinate-probe-protocol-v2.md
      - research/hycom-http-coordinate-probe-operator-v2.json
concurrency:
  group: osw-current-gap-delivery
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            analysis/probe_hycom_http_coordinates_v1.py
            analysis/probe_hycom_http_coordinates_v2.py
            analysis/probe_hycom_native_client_coordinates_v1.py
            analysis/test_hycom_http_coordinates_v1.py
            analysis/test_hycom_http_coordinates_v2.py
            analysis/test_hycom_native_client_coordinate_probe_v1.py
            plans/hycom-http-coordinate-probe-protocol-v1.md
            plans/hycom-native-client-coordinate-probe-protocol-v1.md
            plans/hycom-projected-dds-coordinate-probe-protocol-v2.md
            research/current-depth-hycom-http-coordinate-source-review-v1.json
            research/current-depth-hycom-native-client-coordinate-source-review-v1.json
            research/current-depth-hycom-ncc-metadata-diagnosis-source-review-v1.json
            research/current-depth-ncc-mid-norway-source-attempt-result-v1.json
            research/hycom-http-coordinate-probe-operator-v1.json
            research/hycom-http-coordinate-probe-operator-v2.json
            research/hycom-native-client-coordinate-probe-operator-v1.json
            research/source-data/hycom-ncc-mid-norway-metadata-probe-v1/probe-report.json
            research/source-data/hycom-ncc-mid-norway-metadata-probe-v1/response-1.json
            research/source-data/hycom-ncc-mid-norway-metadata-probe-v1/response-2.json
            research/source-data/hycom-ncc-mid-norway-metadata-probe-v1/response-7.json
            research/source-data/hycom-ncc-mid-norway-metadata-probe-v1/response-8.json
            research/source-data/ncc-north-joint-sections-v1/2022-03-15-section-61p5n.json
            research/source-data/ncc-north-joint-sections-v1/2022-12-15-section-62p25n.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Verify unchanged parsers controls and scoped structural metadata projection
        timeout-minutes: 1
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_hycom_http_coordinates_v1.py' -v
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_hycom_http_coordinates_v2.py' -v
      - name: Fetch coordinate structural DDS and unchanged full native arrays
        timeout-minutes: 4
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python analysis/probe_hycom_http_coordinates_v2.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hycom-http-coordinate-probe-v2
          path: hycom-http-coordinate-probe-v2/
          retention-days: 7
