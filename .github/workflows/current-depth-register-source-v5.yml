name: Current depth register source review v5
"on":
  push:
    branches: [codex/current-measurement-gaps]
    paths:
      - .github/workflows/current-depth-register-source-v5.yml
      - analysis/build_current_depth_register_v5.py
      - analysis/test_current_depth_register_v5.py
      - research/current-depth-source-facts-v5.json
      - research/current-depth-register-v5.json
      - research/current-depth-register-v5.csv
concurrency:
  group: osw-current-gap-delivery
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  source-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            analysis/build_current_depth_register_v*.py
            analysis/build_atlantic_cruise_widths.py
            analysis/test_current_depth_register_v5.py
            research/current-depth-*.json
            research/current-depth-register-v*.csv
            research/current-length-estimate-register-v1.json
            research/ocean-current-width-inventory.json
            research/source-data/cainzos-atlantic-2023/table-*.xlsx
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Verify additional Atlantic section depths and component scope
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_current_depth_register_v5.py' -v
