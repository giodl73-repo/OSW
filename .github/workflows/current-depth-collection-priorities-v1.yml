          python-version: "3.13"
      - name: Audit unchanged case scope and collection priorities on one idle CPU
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_current_depth_collection_priorities_v1.py' -v
          taskset -c "$cpu" nice -n 15 python analysis/build_current_depth_collection_priorities_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-depth-collection-priorities-v1
          path: current-depth-collection-priorities-v1/
          retention-days: 7
