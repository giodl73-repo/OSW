name: Current depth collection priorities and member refresh v1
"on":
  push:
    branches: [codex/current-measurement-gaps]
    paths:
      - .github/workflows/current-depth-collection-priorities-v1.yml
      - analysis/build_current_depth_collection_priorities_v1.py
      - analysis/test_current_depth_collection_priorities_v1.py
      - plans/current-depth-collection-priority-audit-v1.md
      - research/current-depth-collection-priorities-operator-v1.json
concurrency:
  group: osw-current-gap-delivery
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
