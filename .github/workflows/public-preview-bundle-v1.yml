name: Selected public preview bundle and first-visitor tasks v1
"on":
  push:
    branches: [codex/current-measurement-gaps]
    paths:
      - .github/workflows/public-preview-bundle-v1.yml
concurrency:
  group: osw-current-gap-delivery
  cancel-in-progress: false
permissions:
  contents: read
env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            preview-home.html
            preview-methods.html
            LICENSE
            almanac/atlas.html
            almanac/explore.html
            almanac/explore.js
            almanac/explore.css
            almanac/public-map.js
            almanac/public-map.css
            almanac/preview-data.js
            almanac/preview-data-screened-v1
            almanac/preview-review-v1
            figures/ocean-motion-dashboard-ground.svg
            analysis/build_public_preview_bundle_v1.py
            analysis/review_public_preview_bundle_v1.py
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Prepare the explicit site package on one idle CPU
        run: |
          cpu=$(python -c 'import os; print(min(os.sched_getaffinity(0)))')
          timeout --kill-after=1s 10s taskset -c "$cpu" nice -n 15 python analysis/build_public_preview_bundle_v1.py
      - name: Install the pinned browser on one idle CPU
        run: |
          cpu=$(python -c 'import os; print(min(os.sched_getaffinity(0)))')
          taskset -c "$cpu" nice -n 15 python -m pip install playwright==1.58.0
          taskset -c "$cpu" nice -n 15 python -m playwright install --with-deps chromium
      - name: Review only the selected bundle within the carried UI budget
        run: |
          cpu=$(python -c 'import os; print(min(os.sched_getaffinity(0)))')
          timeout --kill-after=1s 14s taskset -c "$cpu" nice -n 15 python analysis/review_public_preview_bundle_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-preview-bundle-v1
          path: .pytest_cache/public-preview-bundle-v1/delivery/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
