            research/source-data/sec-basin-depth-sections-v1/2022-07-15-indian-south-equatorial-section-70e.json
            research/source-data/sec-basin-depth-sections-v1/transport-ledger.json
            research/wsc-interval20-500-depth-reanalysis-v1.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build and verify three basin SEC additive inventory on one idle CPU
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python -m pip install pyproj==3.7.2
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_current_depth_route_projections_v27.py' -v
          taskset -c "$cpu" nice -n 15 python analysis/build_current_depth_route_projections_v27.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-depth-route-projections-v27
          path: current-depth-route-projections-v27/
          retention-days: 7
