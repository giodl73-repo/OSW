            analysis/load_current_depth_projection_inventory_v1.py
            research/source-data/sec-basin-depth-sections-v1/2022-01-15-atlantic-south-equatorial-section-31w.json
            research/source-data/sec-basin-depth-sections-v1/2022-01-15-atlantic-south-equatorial-section-32w.json
            research/source-data/sec-basin-depth-sections-v1/2022-01-15-atlantic-south-equatorial-section-33w.json
            research/source-data/sec-basin-depth-sections-v1/2022-01-15-atlantic-south-equatorial-section-34w.json
            research/source-data/sec-basin-depth-sections-v1/2022-01-15-atlantic-south-equatorial-section-35w.json
