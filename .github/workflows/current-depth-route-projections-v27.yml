            research/source-data/sec-basin-depth-sections-v1/2022-07-15-atlantic-south-equatorial-section-32w.json
            research/source-data/sec-basin-depth-sections-v1/2022-07-15-atlantic-south-equatorial-section-33w.json
            research/source-data/sec-basin-depth-sections-v1/2022-07-15-atlantic-south-equatorial-section-34w.json
            research/source-data/sec-basin-depth-sections-v1/2022-07-15-atlantic-south-equatorial-section-35w.json
            research/source-data/sec-basin-depth-sections-v1/2022-07-15-pacific-south-equatorial-section-100w.json
            research/source-data/sec-basin-depth-sections-v1/2022-07-15-pacific-south-equatorial-section-110w.json
