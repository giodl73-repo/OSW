name: Greenland Malvinas EACC paired component depths v2
"on":
  push:
    branches: [codex/current-measurement-gaps]
    paths:
      - analysis/derive_greenland_malvinas_eacc_paired_depth_v2.py
      - analysis/test_greenland_malvinas_eacc_paired_depth_v2.py
      - plans/greenland-malvinas-eacc-paired-depth-v2.md
      - .github/workflows/greenland-malvinas-eacc-paired-depth-v2.yml
      - research/greenland-malvinas-eacc-paired-depth-operator-v2.json
concurrency:
  group: osw-current-gap-delivery
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  derive:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            analysis/derive_greenland_malvinas_eacc_paired_depth_v2.py
            analysis/test_greenland_malvinas_eacc_paired_depth_v2.py
            plans/greenland-malvinas-eacc-paired-depth-v2.md
            .github/workflows/greenland-malvinas-eacc-paired-depth-v2.yml
            research/greenland-malvinas-eacc-paired-depth-operator-v2.json
            analysis/compiled_depth_catalog_query_guard_v3.py
            research/greenland-malvinas-eacc-velocity-depth-curtains-v1.json
            research/current-depth-greenland-malvinas-eacc-velocity-curtains-source-review-v1.json
            research/greenland-depth-sections-operator-v1.json
            research/malvinas-eacc-depth-sections-operator-v1.json
            research/greenland-malvinas-eacc-paired-depth-failed-query-ledger-v1.json
            research/greenland-malvinas-eacc-paired-depth-failure-review-v1.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Synthetic semantic checks then bounded offline geometry on one idle CPU
        timeout-minutes: 3
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          export OSW_GME_PAIRED_DEPTH_V2_START=$(python -c "import time;print(time.monotonic())")
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_greenland_malvinas_eacc_paired_depth_v2.py' -v
          taskset -c "$cpu" nice -n 15 python analysis/derive_greenland_malvinas_eacc_paired_depth_v2.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: greenland-malvinas-eacc-paired-depth-v2
          path: greenland-malvinas-eacc-paired-depth-v2/
          retention-days: 7
          if-no-files-found: error
