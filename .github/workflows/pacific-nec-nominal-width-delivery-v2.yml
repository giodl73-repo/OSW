name: Sequential Pacific NEC nominal width delivery v2
"on":
  push:
    branches: [codex/current-measurement-gaps]
    paths:
      - research/pacific-nec-nominal-width-delivery-request-v2.json
      - .github/workflows/pacific-nec-nominal-width-delivery-v2.yml
concurrency:
  group: osw-current-gap-delivery
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
env:
  GH_TOKEN: ${{ github.token }}
  OSW_PACIFIC_NEC_NOMINAL_WIDTH_DELIVERY_V1: "1"
  CARGO_BUILD_JOBS: "1"
  RUST_TEST_THREADS: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  PYTHONPATH: analysis
jobs:
  select-request:
    runs-on: ubuntu-latest
    outputs:
      execute: ${{ steps.request.outputs.execute }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: research/pacific-nec-nominal-width-delivery-request-v2.json
      - id: request
        run: |
          python - <<'PY'
          import json,os,pathlib
          r=json.loads(pathlib.Path('research/pacific-nec-nominal-width-delivery-request-v2.json').read_bytes())
          assert r['schema']=='osw.pacific-nec-nominal-width-delivery-request.v2'
          assert type(r['execute']) is bool
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('execute='+str(r['execute']).lower()+'\n')
          PY
  candidate-and-views:
    needs: select-request
    if: needs.select-request.outputs.execute == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install pinned geodesic dependency before contract imports
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python -m pip install pyproj==3.7.2
      - name: Verify frozen inputs and bounded preservation checks
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python analysis/check_pacific_nec_nominal_width_delivery_v2.py preflight
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p test_pacific_nec_nominal_width_v1.py -v
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p test_pacific_nec_nominal_width_query_v1.py -v
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p test_pacific_nec_nominal_width_index_v1.py -v
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p test_pacific_nec_nominal_width_runtime_v1.py -v
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p test_pacific_nec_nominal_width_cases_v1.py -v
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p test_pacific_nec_nominal_width_delivery_v2.py -v
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p test_pacific_nec_nominal_width_source_cases_v1.py -v
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p test_pacific_nec_nominal_width_dispatch_v2.py -v
          taskset -c "$cpu" nice -n 15 node --test --test-concurrency=1 analysis/test_pacific_nec_nominal_width_ui_v1.cjs analysis/test_equatorial_basin_identity_ui_v1.cjs
      - name: Install pinned compiler and locked dependencies
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 rustup toolchain install 1.95.0 --profile minimal --target wasm32-unknown-unknown
          taskset -c "$cpu" nice -n 15 cargo +1.95.0 fetch --locked --manifest-path rust/osw-query/Cargo.toml
      - id: engine
        name: Assemble indexed candidate, build native and WASM, verify complete responses
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python analysis/check_pacific_nec_nominal_width_delivery_v2.py engine
      - name: Install browser after successful engine verification
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python -m pip install playwright==1.58.0
          taskset -c "$cpu" nice -n 15 python -m playwright install --with-deps chromium
      - name: Verify actual desktop and narrow basin membership, current cards, atlas, seasons and dashboard views
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python analysis/check_pacific_nec_nominal_width_delivery_v2.py browser
      - name: Retain compact evidence and actual screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pacific-nec-nominal-width-delivery-evidence-v2
          include-hidden-files: true
          path: |
            .pytest_cache/pacific-nec-nominal-width-delivery-v2/*-failure.json
            .pytest_cache/pacific-nec-nominal-width-delivery-v2/engine-manifest.json
            .pytest_cache/pacific-nec-nominal-width-delivery-v2/engine.json
            .pytest_cache/pacific-nec-nominal-width-delivery-v2/browser.json
            .pytest_cache/pacific-nec-nominal-width-delivery-v2/result.json
            .pytest_cache/pacific-nec-nominal-width-delivery-v2/compile-inventory.json
            .pytest_cache/pacific-nec-nominal-width-delivery-v2/dependency-proof.json
            .pytest_cache/pacific-nec-nominal-width-delivery-v2/object-parity.json
            .pytest_cache/pacific-nec-nominal-width-delivery-v2/parent-object-capture.json
            .pytest_cache/pacific-nec-nominal-width-delivery-v2/object-native-review.json
            .pytest_cache/pacific-nec-nominal-width-delivery-v2/source-index-audit.json
            .pytest_cache/pacific-nec-nominal-width-delivery-v2/main-parity.json
            .pytest_cache/pacific-nec-nominal-width-delivery-v2/index-parity.json
            .pytest_cache/pacific-nec-nominal-width-delivery-v2/snapshots-parity.json
            .pytest_cache/pacific-nec-nominal-width-delivery-v2/parent-snapshots.json
            .pytest_cache/pacific-nec-nominal-width-delivery-v2/parent-speeds.json
            .pytest_cache/pacific-nec-nominal-width-delivery-v2/rust-tests.txt
            .pytest_cache/pacific-nec-nominal-width-delivery-v2/*.png
            .pytest_cache/pacific-nec-nominal-width-delivery-v2/*.geometry.json
          if-no-files-found: warn
          retention-days: 90
      - name: Retain verified engine candidate without installation
        if: always() && steps.engine.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: pacific-nec-nominal-width-delivery-candidate-v2
          include-hidden-files: true
          path: |
            .pytest_cache/pacific-nec-nominal-width-delivery-v2/artifact/**
            .pytest_cache/pacific-nec-nominal-width-delivery-v2/engine.json
          retention-days: 90
