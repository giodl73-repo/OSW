name: North Equatorial and Aleutian depth contours v1
"on":
  push:
    branches: [codex/current-measurement-gaps]
    paths:
      - .github/workflows/nec-subarctic-velocity-curtains-v1.yml
      - analysis/derive_nec_subarctic_velocity_curtains_v1.py
      - analysis/test_nec_subarctic_velocity_curtains_v1.py
      - plans/nec-subarctic-velocity-curtains-protocol-v1.md
      - research/nec-subarctic-velocity-curtains-operator-v1.json
concurrency:
  group: osw-current-gap-delivery
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  derive:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/nec-subarctic-depth-completion-v1.yml
            .github/workflows/nec-subarctic-depth-sections-v1.yml
            analysis/acquire_nec_subarctic_depth_completion_v1.py
            analysis/acquire_nec_subarctic_depth_sections_v1.py
            analysis/acquire_north_brazil_depth_sections_v1.py
            analysis/acquire_three_current_depth_sections_v1.py
            analysis/acquire_zonal_current_depth_sections_v1.py
            analysis/assemble_nec_subarctic_depth_completion_v1.py
            analysis/derive_barents_makassar_velocity_curtains_v1.py
            analysis/derive_eac_connected_layer_thickness_v1.py
            analysis/derive_nec_subarctic_velocity_curtains_v1.py
            analysis/derive_surface_regional_velocity_curtains_v1.py
            analysis/interval_depth_diagnostic_v1.py
            analysis/interval_transverse_section_audit_v1.py
            analysis/latitude_depth_section_geometry_v1.py
            analysis/latitude_interval_section_audit_v1.py
            analysis/mixed_interval_section_geometry_v1.py
            analysis/native_velocity_depth_curtain_v2.py
            analysis/sample_atlantic_current_depth_v1.py
            analysis/sample_eac_hycom_route_depth_v1.py
            analysis/sample_eac_hycom_route_depth_v2.py
            analysis/sample_kuroshio_hycom_depth_v1.py
            analysis/test_nec_subarctic_depth_completion_v1.py
            analysis/test_nec_subarctic_depth_sections_v1.py
            analysis/test_nec_subarctic_velocity_curtains_v1.py
            analysis/test_zonal_current_depth_sections_v1.py
            plans/nec-subarctic-velocity-curtains-protocol-v1.md
            research/aleutian-alaskan-stream-naming-scope-audit.json
            research/aleutian-reach-reference-path-candidate.json
            research/atlantic-nec-stramma-2005-source-facts-v2.json
            research/current-depth-reference-inventory-v18.json
            research/current-depth-source-facts-v13.json
            research/current-depth-source-facts-v27.json
            research/current-measurement-scopes/north-equatorial.json
            research/nec-subarctic-depth-completion-operator-v1.json
            research/nec-subarctic-depth-sections-operator-v1.json
            research/nec-subarctic-depth-sections-source-facts-v1.json
            research/nec-subarctic-depth-sections-source-review-v1.json
            research/nec-subarctic-depth-transport-recovery-v1.json
            research/nec-subarctic-velocity-curtains-operator-v1.json
            research/pacific-nec-nominal-width-prepared-v1.json
            research/qiu-pacific-nec-2015-source-facts-v1.json
            research/source-data/nec-subarctic-depth-sections-v1/2022-01-15-aleutian-section-140w.json
            research/source-data/nec-subarctic-depth-sections-v1/2022-01-15-aleutian-section-150w.json
            research/source-data/nec-subarctic-depth-sections-v1/2022-01-15-aleutian-section-160w.json
            research/source-data/nec-subarctic-depth-sections-v1/2022-01-15-aleutian-section-170w.json
            research/source-data/nec-subarctic-depth-sections-v1/2022-01-15-aleutian-section-175e.json
            research/source-data/nec-subarctic-depth-sections-v1/2022-01-15-aleutian-section-180e.json
            research/source-data/nec-subarctic-depth-sections-v1/2022-01-15-atlantic-north-equatorial-section-27w.json
            research/source-data/nec-subarctic-depth-sections-v1/2022-01-15-atlantic-north-equatorial-section-35w.json
            research/source-data/nec-subarctic-depth-sections-v1/2022-01-15-atlantic-north-equatorial-section-45w.json
            research/source-data/nec-subarctic-depth-sections-v1/2022-01-15-atlantic-north-equatorial-section-55w.json
            research/source-data/nec-subarctic-depth-sections-v1/2022-01-15-pacific-north-equatorial-section-130e.json
            research/source-data/nec-subarctic-depth-sections-v1/2022-01-15-pacific-north-equatorial-section-140e.json
            research/source-data/nec-subarctic-depth-sections-v1/2022-01-15-pacific-north-equatorial-section-150e.json
            research/source-data/nec-subarctic-depth-sections-v1/2022-01-15-pacific-north-equatorial-section-160e.json
            research/source-data/nec-subarctic-depth-sections-v1/2022-01-15-pacific-north-equatorial-section-170e.json
            research/source-data/nec-subarctic-depth-sections-v1/2022-01-15-pacific-north-equatorial-section-170w.json
            research/source-data/nec-subarctic-depth-sections-v1/2022-01-15-pacific-north-equatorial-section-180e.json
            research/source-data/nec-subarctic-depth-sections-v1/2022-07-15-aleutian-section-140w.json
            research/source-data/nec-subarctic-depth-sections-v1/2022-07-15-aleutian-section-150w.json
            research/source-data/nec-subarctic-depth-sections-v1/2022-07-15-aleutian-section-160w.json
            research/source-data/nec-subarctic-depth-sections-v1/2022-07-15-aleutian-section-170w.json
            research/source-data/nec-subarctic-depth-sections-v1/2022-07-15-aleutian-section-175e.json
            research/source-data/nec-subarctic-depth-sections-v1/2022-07-15-aleutian-section-180e.json
            research/source-data/nec-subarctic-depth-sections-v1/2022-07-15-atlantic-north-equatorial-section-27w.json
            research/source-data/nec-subarctic-depth-sections-v1/2022-07-15-atlantic-north-equatorial-section-35w.json
            research/source-data/nec-subarctic-depth-sections-v1/2022-07-15-atlantic-north-equatorial-section-45w.json
            research/source-data/nec-subarctic-depth-sections-v1/2022-07-15-atlantic-north-equatorial-section-55w.json
            research/source-data/nec-subarctic-depth-sections-v1/2022-07-15-pacific-north-equatorial-section-130e.json
            research/source-data/nec-subarctic-depth-sections-v1/2022-07-15-pacific-north-equatorial-section-140e.json
            research/source-data/nec-subarctic-depth-sections-v1/2022-07-15-pacific-north-equatorial-section-150e.json
            research/source-data/nec-subarctic-depth-sections-v1/2022-07-15-pacific-north-equatorial-section-160e.json
            research/source-data/nec-subarctic-depth-sections-v1/2022-07-15-pacific-north-equatorial-section-170e.json
            research/source-data/nec-subarctic-depth-sections-v1/2022-07-15-pacific-north-equatorial-section-170w.json
            research/source-data/nec-subarctic-depth-sections-v1/2022-07-15-pacific-north-equatorial-section-180e.json
            research/source-data/nec-subarctic-depth-sections-v1/manifest.json
            research/zonal-current-depth-sections-operator-v1.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Reproduce every original case and derive native depth variation without retrieval
        timeout-minutes: 5
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python -m pip install numpy==2.4.1 netCDF4==1.7.4 pyproj==3.7.2
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_zonal_current_depth_sections_v1.py' -v
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_nec_subarctic_depth_sections_v1.py' -v
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_nec_subarctic_depth_completion_v1.py' -v
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_nec_subarctic_velocity_curtains_v1.py' -v
          taskset -c "$cpu" nice -n 15 python analysis/derive_nec_subarctic_velocity_curtains_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nec-subarctic-velocity-curtains-v1
          path: nec-subarctic-velocity-curtains-v1/
          retention-days: 7
