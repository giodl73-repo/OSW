name: Sequential satellite core width delivery v1
"on":
  push:
    branches: [codex/current-measurement-gaps]
    paths:
      - research/satellite-core-width-delivery-request-v1.json
      - .github/workflows/satellite-core-width-delivery-v1.yml
concurrency:
  group: osw-current-gap-delivery
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
env:
  GH_TOKEN: ${{ github.token }}
  OSW_SATELLITE_CORE_WIDTH_DELIVERY_V1: "1"
  CARGO_BUILD_JOBS: "1"
  RUST_TEST_THREADS: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  PYTHONPATH: analysis
jobs:
  select-request:
    runs-on: ubuntu-latest
    outputs:
      execute: ${{ steps.request.outputs.execute }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: research/satellite-core-width-delivery-request-v1.json
      - id: request
        run: |
          python - <<'PY'
          import json,os,pathlib
          r=json.loads(pathlib.Path('research/satellite-core-width-delivery-request-v1.json').read_bytes())
          assert r['schema']=='osw.satellite-core-width-delivery-request.v1'
          assert type(r['execute']) is bool
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('execute='+str(r['execute']).lower()+'\n')
          PY
  delivery:
    needs: select-request
    if: needs.select-request.outputs.execute == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Verify frozen inputs and lightweight checks
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python analysis/check_satellite_core_width_delivery_v1.py preflight
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_satellite_core_width_delivery_v1.py' -v
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_published_satellite_core_widths_v1.py' -v
          taskset -c "$cpu" nice -n 15 node analysis/test_satellite_core_widths_ui_v1.mjs
          taskset -c "$cpu" nice -n 15 node analysis/test_published_current_speeds_ui_v1.mjs
          taskset -c "$cpu" nice -n 15 node analysis/test_published_current_speed_source_links_v1.mjs
      - name: Install pinned Rust toolchain and locked dependencies
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 rustup toolchain install 1.95.0 --profile minimal --target wasm32-unknown-unknown
          taskset -c "$cpu" nice -n 15 cargo +1.95.0 fetch --locked --manifest-path rust/osw-query/Cargo.toml
      - id: engine
        name: Assemble indexed candidate, build once and verify parity
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python analysis/check_satellite_core_width_delivery_v1.py engine
      - name: Install browser after engine verification
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python -m pip install playwright==1.58.0
          taskset -c "$cpu" nice -n 15 python -m playwright install --with-deps chromium
      - name: Verify desktop and narrow query, atlas, seasons and source links
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python analysis/check_satellite_core_width_delivery_v1.py browser
      - name: Retain compact evidence and actual screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: satellite-core-width-delivery-evidence-v1
          path: |
            .pytest_cache/satellite-core-width-delivery-v1/*-failure.json
            .pytest_cache/satellite-core-width-delivery-v1/engine.json
            .pytest_cache/satellite-core-width-delivery-v1/browser.json
            .pytest_cache/satellite-core-width-delivery-v1/result.json
            .pytest_cache/satellite-core-width-delivery-v1/compile-inventory.json
            .pytest_cache/satellite-core-width-delivery-v1/dependency-proof.json
            .pytest_cache/satellite-core-width-delivery-v1/source-index-audit.json
            .pytest_cache/satellite-core-width-delivery-v1/main-parity.json
            .pytest_cache/satellite-core-width-delivery-v1/index-parity.json
            .pytest_cache/satellite-core-width-delivery-v1/snapshots-parity.json
            .pytest_cache/satellite-core-width-delivery-v1/parent-snapshots.json
            .pytest_cache/satellite-core-width-delivery-v1/parent-speeds.json
            .pytest_cache/satellite-core-width-delivery-v1/rust-tests.txt
            .pytest_cache/satellite-core-width-delivery-v1/*.png
            .pytest_cache/satellite-core-width-delivery-v1/*.geometry.json
          if-no-files-found: warn
          retention-days: 14
      - name: Retain verified engine candidate
        if: always() && steps.engine.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: satellite-core-width-delivery-candidate-v1
          path: |
            .pytest_cache/satellite-core-width-delivery-v1/artifact/**
            .pytest_cache/satellite-core-width-delivery-v1/engine.json
          retention-days: 14
