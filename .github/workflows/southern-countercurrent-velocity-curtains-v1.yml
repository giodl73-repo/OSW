            research/zonal-current-depth-sections-operator-v1.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Reproduce every original case and derive native depth variation without retrieval
        timeout-minutes: 5
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python -m pip install numpy==2.4.1 netCDF4==1.7.4 pyproj==3.7.2
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_southern_countercurrent_interval_depth_sections_v1.py' -v
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_southern_countercurrent_velocity_curtains_v1.py' -v
          taskset -c "$cpu" nice -n 15 python analysis/derive_southern_countercurrent_velocity_curtains_v1.py --current current:indian-south-equatorial-countercurrent
          taskset -c "$cpu" nice -n 15 python analysis/derive_southern_countercurrent_velocity_curtains_v1.py --current current:pacific-south-equatorial-countercurrent
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: southern-countercurrent-velocity-curtains-indian-south-equatorial-countercurrent-v1
          path: southern-countercurrent-velocity-curtains-v1/indian-south-equatorial-countercurrent/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: southern-countercurrent-velocity-curtains-pacific-south-equatorial-countercurrent-v1
          path: southern-countercurrent-velocity-curtains-v1/pacific-south-equatorial-countercurrent/
          retention-days: 7
