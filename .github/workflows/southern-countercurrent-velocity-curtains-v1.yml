name: Indian and Pacific South Equatorial Countercurrent depth contours v1
"on":
  push:
    branches: [codex/current-measurement-gaps]
    paths:
      - .github/workflows/southern-countercurrent-velocity-curtains-v1.yml
      - analysis/derive_southern_countercurrent_velocity_curtains_v1.py
      - analysis/test_southern_countercurrent_velocity_curtains_v1.py
      - plans/southern-countercurrent-velocity-curtains-protocol-v1.md
      - research/southern-countercurrent-velocity-curtains-operator-v1.json
concurrency:
  group: osw-current-gap-delivery
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  derive:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
