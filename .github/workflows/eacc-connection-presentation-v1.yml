name: EACC saved-engine diagram presentation
on:
  workflow_dispatch:
  push:
    branches: [codex/current-measurement-gaps]
    paths:
      - research/eacc-connection-presentation-request-v1.json
      - .github/workflows/eacc-connection-presentation-v1.yml
concurrency:
  group: osw-current-gap-delivery
  cancel-in-progress: false
permissions:
  contents: read
env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
jobs:
  select-request:
    runs-on: ubuntu-latest
    outputs:
      execute: ${{ steps.request.outputs.execute }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: research/eacc-connection-presentation-request-v1.json
      - id: request
        run: |
          python - <<'PY'
          import json, os, pathlib
          r=json.loads(pathlib.Path('research/eacc-connection-presentation-request-v1.json').read_bytes())
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('execute='+str(r['execute'] is True).lower()+'\n')
          PY
  presentation:
    needs: select-request
    if: needs.select-request.outputs.execute == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          path: control
      - name: Check explicit presentation request before restoring saved data
        run: |
          python - <<'PY'
          import json, pathlib
          r=json.loads(pathlib.Path('control/research/eacc-connection-presentation-request-v1.json').read_bytes())
          assert r['execute'] is True and r['max_local_heavy_jobs']==0 and r['max_cloud_heavy_jobs']==1
          assert r['native_rebuild'] is False and r['wasm_rebuild'] is False and r['new_scientific_records']==0
          PY
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install pinned presentation dependencies
        run: python -m pip install playwright==1.58.0 pytest==8.4.2
      - name: Small overlay and UI checks
        working-directory: control
        run: |
          python - <<'PY'
          import os, subprocess
          os.sched_setaffinity(0,{min(os.sched_getaffinity(0))}); os.nice(10)
          subprocess.run(['python','-m','pytest','-q','analysis/test_eacc_connection_presentation_v1.py'],check=True)
          subprocess.run(['node','analysis/test_eacc_regional_connection_ui_v1.mjs'],check=True)
          PY
      - uses: actions/checkout@v6
        with:
          ref: 1d98d9768959f1a357f3aa9933b86f203a4290bd
          path: site
      - name: Install one browser
        run: python -m playwright install --with-deps chromium
      - name: Check unchanged saved engine and exact current evidence
        run: python control/analysis/check_eacc_connection_presentation_v1.py --site site --output control/.pytest_cache/eacc-connection-presentation-v1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eacc-connection-presentation-v1
          path: control/.pytest_cache/eacc-connection-presentation-v1/
          include-hidden-files: true
          if-no-files-found: ignore
