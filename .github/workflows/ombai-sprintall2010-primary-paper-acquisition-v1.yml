name: Ombai Sprintall2010 primary observation paper custody v1
"on":
  push:
    branches: [codex/current-measurement-gaps]
    paths:
      - .github/workflows/ombai-sprintall2010-primary-paper-acquisition-v1.yml
      - analysis/acquire_ombai_sprintall2010_primary_paper_v1.py
      - analysis/test_ombai_sprintall2010_primary_paper_acquisition_v1.py
      - plans/ombai-sprintall2010-primary-paper-custody-protocol-v1.md
      - research/ombai-sprintall2010-primary-paper-acquisition-operator-v1.json
concurrency:
  group: osw-current-gap-delivery
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            analysis/acquire_egcc_sutherland_primary_paper_v1.py
            analysis/acquire_ombai_sprintall2010_primary_paper_v1.py
            analysis/acquire_ncc_skagseth_table1_v1.py
            analysis/test_ombai_sprintall2010_primary_paper_acquisition_v1.py
            plans/ombai-sprintall2010-primary-paper-custody-protocol-v1.md
            research/current-depth-reference-inventory-v14.json
            research/ombai-sprintall2010-primary-paper-acquisition-operator-v1.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Check inherited custody bounds and acquire the original once
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_ombai_sprintall2010_primary_paper_acquisition_v1.py' -v
          taskset -c "$cpu" nice -n 15 python analysis/acquire_ombai_sprintall2010_primary_paper_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ombai-sprintall2010-primary-paper-v1
          path: ombai-sprintall2010-primary-paper-v1/
          retention-days: 7
