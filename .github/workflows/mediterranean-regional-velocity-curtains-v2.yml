      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Reproduce every original case and derive native depth variation without retrieval
        timeout-minutes: 5
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python -m pip install numpy==2.4.1 netCDF4==1.7.4 pyproj==3.7.2
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_mediterranean_regional_velocity_curtains_v2.py' -v
          taskset -c "$cpu" nice -n 15 python analysis/derive_mediterranean_regional_velocity_curtains_v2.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mediterranean-regional-velocity-curtains-v2
          path: mediterranean-regional-velocity-curtains-v2/
          retention-days: 7
