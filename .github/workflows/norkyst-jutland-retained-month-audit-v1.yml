name: NorKyst Jutland retained month reconstruction v1
"on":
  push:
    branches: [codex/current-measurement-gaps]
    paths:
      - .github/workflows/norkyst-jutland-retained-month-audit-v1.yml
      - analysis/audit_norkyst_jutland_retained_months_v1.py
      - research/norkyst-jutland-retained-month-audit-operator-v1.json
concurrency:
  group: osw-current-gap-delivery
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  retained-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Reconstruct retained responses with provider access forbidden
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python -m pip install numpy==2.3.4 pyproj==3.7.2
          taskset -c "$cpu" nice -n 15 python analysis/audit_norkyst_jutland_retained_months_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: norkyst-jutland-retained-month-audit-v1
          path: norkyst-jutland-retained-month-audit-v1/
          retention-days: 7
          if-no-files-found: error
