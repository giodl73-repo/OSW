name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  front-temperature-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install pinned thermodynamic dependencies
        run: python -m pip install numpy==2.4.1 gsw==3.6.23 h5py==3.16.0 netCDF4==1.7.4 pyproj==3.7.2 pytest==8.4.2
      - name: Verify complete Caribbean RU29 source arrays and page payload
        run: |
          python -m pytest -q analysis/test_caribbean_ru29_source_fields_v1.py analysis/test_caribbean_ru29_source_fields_v2.py analysis/test_caribbean_ru29_source_fields_admission.py analysis/test_caribbean_ru29_query.py
          python analysis/caribbean_ru29_source_fields_v2.py check
          python analysis/build_caribbean_ru29_source_page.py check
      - name: Check exact synthetic pressure salinity and temperature conversion
        run: python analysis/check_south_indian_front_temperature_portability.py
      - name: Check supplementary source methods and query adapters
        run: >-
          python -m pytest -q analysis/test_south_indian_front_levels.py
          analysis/test_south_indian_front_level_query.py
          analysis/test_south_indian_front_temperature.py
          analysis/test_south_indian_front_property_windows.py
          analysis/test_south_indian_front_property_windows_v2.py
      - name: Reconstruct supplementary native source products from retained originals
        run: python analysis/package_south_indian_front_levels.py reproduce
      - name: Reproduce complete actual-source potential temperature report exactly
        run: python analysis/check_south_indian_front_temperature_reproduction.py
      - name: Check every Indian SECC source boundary and retained attempt
        run: >-
          python -m pytest -q analysis/test_indian_secc_source_boundary_audit.py
          analysis/test_indian_secc_source_boundary_report.py
      - name: Check all REDSOX station metadata and original-source coverage
        run: >-
          python -m pytest -q analysis/test_redsox_provider_station_support.py
          analysis/test_redsox_provider_station_report.py
      - name: Check complete Angola native arrays and query mirrors
        run: >-
          python -m pytest -q analysis/test_angola_nansen_native_sections.py
          analysis/test_angola_nansen_native_report.py analysis/test_angola_nansen_query_mirrors.py
          analysis/test_angola_nansen_portable_sections_v2.py analysis/test_angola_nansen_portable_report.py
      - name: Check Labrador geographic floor and source-bound working admission
        run: >-
          python -m pytest -q analysis/test_labrador_latitude_gate_bound_v1.py
          analysis/test_labrador_gate_bound_admission.py
      - name: Check regional KE plotted length geometry, calibration and admission
        run: >-
          python -m pytest -q analysis/test_ke_qiu_plot_pathlength_v1.py
          analysis/test_ke_qiu_plot_pathlength_v2.py analysis/test_ke_qiu_plot_pathlength_v3.py
          analysis/test_ke_qiu_plot_pathlength_v4.py analysis/test_ke_qiu_plot_pathlength_admission.py
          analysis/test_ke_length_series_query.py
      - name: Reconstruct complete Indian SECC source boundary audit exactly
        run: python analysis/indian_secc_source_boundary_audit.py check
      - name: Reproduce complete conditional native property-window report exactly
        run: python analysis/south_indian_front_property_windows_v2.py check
  front-level-atlas:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: 1.95.0
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install pinned atlas dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Install pinned native and WASM Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --target wasm32-unknown-unknown
      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked --manifest-path rust/osw-query/Cargo.toml
      - name: Build and test native and WASM engines against the complete atlas
        run: python analysis/build_rust_query_engine.py
      - name: Retain rebuilt engine and complete dependency manifest
        uses: actions/upload-artifact@v4
        with:
          name: front-level-query-engine
          path: |
            almanac/query-engine.wasm
            almanac/query-engine.manifest.json
      - name: Install browser for actual supplementary atlas checks
        run: python -m playwright install --with-deps chromium
      - name: Read every supplementary cell through native and shipped WASM UI
        run: >-
          python analysis/run_rust_query_browser_checks.py --start-server --only-check
          test_caribbean_ru29_query_browser.py test_caribbean_ru29_source_browser.py
          test_ke_length_series_browser.py test_labrador_gate_bound_browser.py
          test_angola_nansen_sections_browser.py test_angola_nansen_query_browser.py
          test_redsox_station_support_browser.py test_redsox_station_support_query_browser.py
          test_current_gap_source_query_browser.py
          test_south_indian_front_level_browser.py test_south_indian_front_level_query_browser.py
          test_south_indian_front_property_browser.py test_south_indian_front_property_query_browser.py
          test_indian_secc_source_boundary_browser.py
      - name: Retain actual browser receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: front-level-browser-receipts
          if-no-files-found: ignore
          path: |
            .pytest_cache/south-indian-front-levels-2013/browser/result.json
            .pytest_cache/south-indian-front-levels-2013/query-browser/result.json
            .pytest_cache/south-indian-front-levels-2013/query-browser/current-card-profile-query-phone.png
            .pytest_cache/south-indian-front-properties-2013/browser/result.json
            .pytest_cache/south-indian-front-properties-2013/query-browser/result.json
            .pytest_cache/south-indian-front-properties-2013/query-browser/phone.png
            .pytest_cache/indian-secc-source-boundaries-2013/browser/result.json
            .pytest_cache/indian-secc-source-boundaries-2013/browser/phone.png
            .pytest_cache/current-gap-source-integration/browser/result.json
            .pytest_cache/current-gap-source-integration/browser/secc-phone.png
            .pytest_cache/current-gap-source-integration/browser/redsea-phone.png
            .pytest_cache/ke-qiu-delivery/browser/result.json
            .pytest_cache/ke-qiu-delivery/browser/card-phone.png
            .pytest_cache/ke-qiu-delivery/browser/figure.png
            .pytest_cache/labrador-bound-v1/browser/result.json
            .pytest_cache/labrador-bound-v1/browser/card-phone.png
            .pytest_cache/labrador-bound-v1/browser/figure.png
            .pytest_cache/angola-nansen-sections/browser/result.json
            .pytest_cache/angola-nansen-sections/browser/phone.png
            .pytest_cache/angola-nansen-sections/query-browser/result.json
            .pytest_cache/angola-nansen-sections/query-browser/phone.png
            .pytest_cache/redsox-station-support/browser/result.json
            .pytest_cache/redsox-station-support/browser/phone.png
            .pytest_cache/redsox-station-support/query-browser/result.json
            .pytest_cache/redsox-station-support/query-browser/phone.png
  scientific-reproduction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install pinned reconstruction dependencies
        run: >-
          python -m pip install numpy==2.4.1 xarray==2026.7.0 netCDF4==1.7.4
          pyproj==3.7.2 h5py==3.16.0 contourpy==1.3.3 shapely==2.1.2 gsw==3.6.23 pyshp==2.3.1
      - name: Report exact scientific rebuild differences without changing sources
        run: python analysis/inspect_scientific_reproduction.py
      - name: Diagnose Angola compressed transport versus complete decoded observations
        if: always()
        run: python analysis/diagnose_angola_transport_reproduction.py
      - name: Retain Angola replay diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: angola-native-v1-replay-diagnostic
          path: .pytest_cache/angola-nansen-sections/transport-replay-diagnostic.json
          include-hidden-files: true
      - name: Diagnose exact HYCOM source-product reconstruction
        run: python analysis/inspect_hycom_source_reproduction.py
      - name: Reconstruct Indian SECC HYCOM monthly products from retained originals
        run: python analysis/package_indian_secc_hycom_2013.py reproduce
      - name: Reconstruct South Indian paired hydrography from retained originals
        run: python analysis/package_south_indian_hycom_hydrography.py reproduce

  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install pinned test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Acquire checksum-pinned local paper fixtures
        run: python analysis/acquire_local_paper_fixtures.py
      - name: Install pinned native Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Test and build native query engine
        run: |
          cargo +1.95.0 test --locked --manifest-path rust/osw-query/Cargo.toml
          cargo +1.95.0 build --locked --manifest-path rust/osw-query/Cargo.toml --bin osw-query-cli
      - name: Run standard-library test baseline
        run: python -m unittest discover -s analysis -p "test_*.py"
      - name: Run complete offline test suite
        run: python -m pytest analysis -q
      - name: Install browser for shipped WASM checks
        run: python -m playwright install --with-deps chromium
      - name: Exercise shipped WASM UI and every query collection
        run: python analysis/run_rust_query_browser_checks.py --start-server
      - name: Compile Python sources
        run: python -m compileall -q analysis
      - name: Check browser JavaScript syntax
        run: node --check atlas/app.js && node --check column/app.js && node --check exchange/app.js && node --check exchange/exchange-stage.js && node --check exchange/stability-stage.js && node --check exchange/events-stage.js && node --check exchange/decisions-stage.js && node --check event/scenes.js && node --check event/app.js
      - name: Check every almanac JavaScript module
        run: python analysis/check_almanac_javascript.py
      - name: Check every almanac page has a validation assignment
        run: python analysis/check_almanac_page_coverage.py

  netcdf-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-observations.txt
      - name: Install pinned observation dependencies
        run: python -m pip install -r requirements-observations.txt
      - name: Exercise the local NetCDF fixture
        run: >-
          python -m unittest
          analysis.test_oisst_snapshot.OisstSnapshotTests.test_netcdf_fixture_preserves_dimensions_order_and_mask
          analysis.test_argo_snapshot.ArgoSnapshotTests.test_fixture_selects_exact_pressure_stride_and_mask
