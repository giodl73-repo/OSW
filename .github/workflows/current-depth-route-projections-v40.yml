name: Current depth additive inventory v40
"on":
  push:
    branches: [codex/current-measurement-gaps]
    paths:
      - .github/workflows/current-depth-route-projections-v40.yml
      - analysis/build_current_depth_route_projections_v40.py
      - analysis/test_current_depth_route_projections_v40.py
      - research/current-depth-route-projection-operator-v40.json
concurrency:
  group: osw-current-gap-delivery
  cancel-in-progress: false
permissions:
  contents: read
jobs:
