name: Current depth references v44 Hormuz moored velocity depth reference
"on":
  push:
    branches: [codex/current-measurement-gaps]
    paths:
      - analysis/build_current_depth_reference_inventory_v44.py
      - analysis/test_current_depth_reference_inventory_v44.py
      - analysis/compiled_depth_catalog_view_v7.py
      - plans/johns2003-hormuz-depth-admission-v1.md
      - research/johns2003-hormuz-depth-source-facts-v1.json
      - .github/workflows/current-depth-reference-inventory-v44.yml
      - research/current-depth-reference-inventory-operator-v44.json
concurrency:
  group: osw-current-gap-delivery
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  admit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
