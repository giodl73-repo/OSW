name: Current depth additive inventory v33
"on":
  push:
    branches: [codex/current-measurement-gaps]
    paths:
      - .github/workflows/current-depth-route-projections-v33.yml
      - analysis/build_current_depth_route_projections_v33.py
      - analysis/test_current_depth_route_projections_v33.py
      - research/current-depth-route-projection-operator-v33.json
concurrency:
  group: osw-current-gap-delivery
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  project:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            analysis/build_current_depth_route_projections_v33.py
            analysis/test_current_depth_route_projections_v33.py
            research/current-depth-route-projection-operator-v33.json
            research/current-depth-route-projection-inventory-v18.json
            research/current-depth-route-projection-inventory-source-review-v18.json
            research/current-depth-route-projections-v14.json
            research/current-depth-route-projections-v14.csv
            research/current-depth-unresolved-reference-cases-v1.csv
            research/current-depth-route-projection-addenda/north-brazil-full-sections-hycom2022-v1.json
            research/current-depth-route-projection-addenda/north-brazil-full-sections-hycom2022-v1.csv
