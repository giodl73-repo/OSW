            analysis/acquire_three_current_depth_sections_v1.py
            analysis/acquire_north_brazil_depth_sections_v1.py
            analysis/sample_eac_hycom_route_depth_v1.py
            analysis/sample_eac_hycom_route_depth_v2.py
            analysis/sample_atlantic_current_depth_v1.py
            analysis/sample_kuroshio_hycom_depth_v1.py
            analysis/derive_eac_connected_layer_thickness_v1.py
            analysis/bounded_hycom_component_reads_v1.py
            analysis/acquire_transverse_depth_sections_v2.py
            analysis/interval_transverse_section_audit_v1.py
            analysis/acquire_northern_interval_depth_sections_v1.py
            analysis/interval_depth_diagnostic_v1.py
            analysis/test_interval_depth_diagnostic_v1.py
            analysis/test_northern_interval_depth_sections_v1.py
            plans/northern-interval-depth-sections-protocol-v1.md
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build and verify northern interval additive inventory on one idle CPU
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python -m pip install netCDF4==1.7.4 numpy==2.3.4 pyproj==3.7.2
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_current_depth_route_projections_v33.py' -v
          taskset -c "$cpu" nice -n 15 python analysis/build_current_depth_route_projections_v33.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-depth-route-projections-v33
          path: current-depth-route-projections-v33/
          retention-days: 7
