name: Verify full Pacific SECC regional reference data and WASM delivery v1
"on":
  push:
    branches: [codex/current-measurement-gaps]
    paths:
      - research/pacific-secc-full-delivery-request-v1.json
      - .github/workflows/pacific-secc-full-delivery-v1.yml
concurrency:
  group: osw-current-gap-delivery
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
env:
  GH_TOKEN: ${{ github.token }}
  CARGO_BUILD_JOBS: "1"
  RUST_TEST_THREADS: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  OSW_PACIFIC_SECC_DELIVERY_V1: "1"
  PYTHONPATH: analysis
jobs:
  full-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - id: request
        name: Read exact full-delivery request
        run: |
          python - <<'PY'
          import json, os, pathlib
          r=json.loads(pathlib.Path('research/pacific-secc-full-delivery-request-v1.json').read_bytes())
          assert r['schema']=='osw.pacific-secc-full-delivery-request.v1'
          assert type(r['execute']) is bool
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('enabled='+str(r['execute']).lower()+'\n')
          PY
      - uses: actions/setup-node@v6
        if: steps.request.outputs.enabled == 'true'
        with:
          node-version: "24"
      - name: Verify frozen source and small preservation checks
        if: steps.request.outputs.enabled == 'true'
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python analysis/check_pacific_secc_full_delivery_v1.py preflight
          taskset -c "$cpu" nice -n 15 python -m unittest test_pacific_secc_engine_delivery_v1.PacificEngineDelivery test_pacific_secc_reference_delivery_v1.PacificDelivery test_pacific_secc_publication_admission_v1.PublicationAdmission test_pacific_secc_reference_runtime_v1.PacificRuntime test_pacific_secc_reference_query_v1.PacificReference -v
      - name: Install pinned compiler and locked dependencies on one CPU
        if: steps.request.outputs.enabled == 'true'
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 rustup toolchain install 1.95.0 --profile minimal --target wasm32-unknown-unknown
          taskset -c "$cpu" nice -n 15 cargo +1.95.0 fetch --locked --manifest-path rust/osw-query/Cargo.toml
      - name: Verify parent preservation and matching native/WASM queries and complete snapshots
        if: steps.request.outputs.enabled == 'true'
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python analysis/check_pacific_secc_full_delivery_v1.py engine
      - name: Install cloud browser after verified engine phase
        if: steps.request.outputs.enabled == 'true'
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python -m pip install playwright==1.58.0
          taskset -c "$cpu" nice -n 15 python -m playwright install --with-deps chromium
      - name: Verify direct atlas/query/card links and actual desktop/mobile rendering
        if: steps.request.outputs.enabled == 'true'
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python analysis/check_pacific_secc_full_delivery_v1.py browser
      - name: Retain compact checks and actual images
        if: always() && steps.request.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pacific-secc-full-delivery-evidence-v1
          path: |
            .pytest_cache/pacific-secc-full-delivery-v1/*-failure.json
            .pytest_cache/pacific-secc-full-delivery-v1/parent-custody.json
            .pytest_cache/pacific-secc-full-delivery-v1/parent-snapshots.json
            .pytest_cache/pacific-secc-full-delivery-v1/compile-inventory.json
            .pytest_cache/pacific-secc-full-delivery-v1/prepared.json
            .pytest_cache/pacific-secc-full-delivery-v1/*-tests.txt
            .pytest_cache/pacific-secc-full-delivery-v1/native-smoke.json
            .pytest_cache/pacific-secc-full-delivery-v1/*-parity.json
            .pytest_cache/pacific-secc-full-delivery-v1/snapshot-preservation.json
            .pytest_cache/pacific-secc-full-delivery-v1/engine.json
            .pytest_cache/pacific-secc-full-delivery-v1/browser.json
            .pytest_cache/pacific-secc-full-delivery-v1/result.json
            .pytest_cache/pacific-secc-full-delivery-v1/*.png
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 90
      - name: Retain derived candidate files only in cloud
        if: always() && steps.request.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pacific-secc-full-delivery-candidate-v1
          path: .pytest_cache/pacific-secc-full-delivery-v1/artifact/**
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 90
