name: North Cape frozen depth selection audit v1
"on":
  push:
    branches: [codex/current-measurement-gaps]
    paths:
      - .github/workflows/north-cape-selection-audit-v1.yml
      - analysis/audit_current_depth_north_cape_selection_v1.py
      - analysis/test_current_depth_north_cape_selection_audit_v1.py
      - research/current-depth-north-cape-selection-audit-operator-v1.json
concurrency:
  group: osw-current-gap-delivery
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            analysis/acquire_barents_makassar_interval_depth_sections_v1.py
            analysis/acquire_latitude_depth_sections_v2.py
            analysis/acquire_north_brazil_depth_sections_v1.py
            analysis/acquire_three_current_depth_sections_v1.py
            analysis/acquire_zonal_current_depth_sections_v1.py
            analysis/audit_current_depth_north_cape_selection_v1.py
            analysis/bounded_hycom_component_reads_v1.py
            analysis/bounded_hycom_latitude_reads_v1.py
            analysis/bounded_hycom_mixed_reads_v1.py
            analysis/derive_eac_connected_layer_thickness_v1.py
            analysis/interval_depth_diagnostic_v1.py
            analysis/interval_transverse_section_audit_v1.py
            analysis/latitude_depth_section_geometry_v1.py
            analysis/latitude_interval_section_audit_v1.py
            analysis/mixed_interval_section_geometry_v1.py
            analysis/sample_atlantic_current_depth_v1.py
            analysis/sample_eac_hycom_route_depth_v1.py
            analysis/sample_eac_hycom_route_depth_v2.py
            analysis/sample_kuroshio_hycom_depth_v1.py
            analysis/test_barents_makassar_interval_depth_sections_v1.py
            analysis/test_current_depth_north_cape_selection_audit_v1.py
            plans/barents-makassar-interval-depth-sections-protocol-v1.md
            research/barents-makassar-interval-depth-sections-operator-v1.json
            research/barents-makassar-interval-depth-sections-source-facts-v1.json
            research/barents-makassar-interval-depth-sections-source-review-v1.json
            research/current-depth-north-cape-selection-audit-operator-v1.json
            research/current-depth-route-projection-addenda/barents-makassar-interval-full-sections-hycom2022-v1.json
            research/current-depth-source-facts-v14.json
            research/current-depth-source-facts-v20.json
            research/greenland-depth-sections-operator-v1.json
            research/indonesian-throughflow-network-input.json
            research/indonesian-throughflow-network-scope-audit.json
            research/north-cape-branch-profile-scope-audit.json
            research/north-cape-northern-reach-reference-path-input.json
            research/source-data/barents-makassar-interval-depth-sections-v1/2022-03-15-north-cape-section-20e.json
            research/source-data/barents-makassar-interval-depth-sections-v1/2022-03-15-north-cape-section-22e.json
            research/source-data/barents-makassar-interval-depth-sections-v1/2022-03-15-north-cape-section-24e.json
            research/source-data/barents-makassar-interval-depth-sections-v1/2022-03-15-north-cape-section-26e.json
            research/source-data/barents-makassar-interval-depth-sections-v1/2022-06-15-north-cape-section-20e.json
            research/source-data/barents-makassar-interval-depth-sections-v1/2022-06-15-north-cape-section-22e.json
            research/source-data/barents-makassar-interval-depth-sections-v1/2022-06-15-north-cape-section-24e.json
            research/source-data/barents-makassar-interval-depth-sections-v1/2022-06-15-north-cape-section-26e.json
            research/source-data/barents-makassar-interval-depth-sections-v1/2022-09-15-north-cape-section-20e.json
            research/source-data/barents-makassar-interval-depth-sections-v1/2022-09-15-north-cape-section-22e.json
            research/source-data/barents-makassar-interval-depth-sections-v1/2022-09-15-north-cape-section-24e.json
            research/source-data/barents-makassar-interval-depth-sections-v1/2022-09-15-north-cape-section-26e.json
            research/source-data/barents-makassar-interval-depth-sections-v1/2022-12-15-north-cape-section-20e.json
            research/source-data/barents-makassar-interval-depth-sections-v1/2022-12-15-north-cape-section-22e.json
            research/source-data/barents-makassar-interval-depth-sections-v1/2022-12-15-north-cape-section-24e.json
            research/source-data/barents-makassar-interval-depth-sections-v1/2022-12-15-north-cape-section-26e.json
            research/source-data/barents-makassar-interval-depth-sections-v1/manifest.json
            research/source-data/barents-makassar-interval-depth-sections-v1/transport-ledger.json
            research/zonal-current-depth-sections-operator-v1.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Audit retained selections on one idle CPU without field retrieval
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python -m pip install netCDF4==1.7.4 numpy==2.3.4 pyproj==3.7.2
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_current_depth_north_cape_selection_audit_v1.py' -v
          taskset -c "$cpu" nice -n 15 python analysis/audit_current_depth_north_cape_selection_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: north-cape-selection-audit-v1
          path: north-cape-selection-audit-v1/
          retention-days: 7
