      - .github/workflows/current-depth-route-projections-v37.yml
      - analysis/build_current_depth_route_projections_v37.py
      - analysis/test_current_depth_route_projections_v37.py
      - research/current-depth-route-projection-operator-v37.json
concurrency:
  group: osw-current-gap-delivery
  cancel-in-progress: false
permissions:
