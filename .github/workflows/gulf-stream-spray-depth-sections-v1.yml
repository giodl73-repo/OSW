name: Gulf Stream Spray depth sections v1
"on":
  push:
    branches: [codex/current-measurement-gaps]
    paths:
      - .github/workflows/gulf-stream-spray-depth-sections-v1.yml
      - analysis/acquire_gulf_stream_spray_sections_v1.py
      - analysis/test_gulf_stream_spray_sections_v1.py
      - research/gulf-stream-spray-depth-sections-operator-v1.json
concurrency:
  group: osw-current-gap-delivery
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            analysis/acquire_gulf_stream_spray_sections_v1.py
            analysis/test_gulf_stream_spray_sections_v1.py
            analysis/acquire_florida_spray_seasonal_depth_v1.py
            analysis/test_florida_spray_seasonal_depth_v1.py
            analysis/derive_eac_connected_layer_thickness_v1.py
            analysis/test_eac_connected_layer_thickness_v1.py
            research/gulf-stream-spray-depth-sections-operator-v1.json
            research/florida-spray-seasonal-depth-source-review-v1.json
            research/current-depth-register-source-review-v47.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Test locked-direction operator and acquire batched section subsets
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python -m pip install netCDF4==1.7.4 numpy==2.3.4
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_eac_connected_layer_thickness_v1.py' -v
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_florida_spray_seasonal_depth_v1.py' -v
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_gulf_stream_spray_sections_v1.py' -v
          taskset -c "$cpu" nice -n 15 python analysis/acquire_gulf_stream_spray_sections_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gulf-stream-spray-depth-sections-v1
          path: gulf-stream-spray-depth-sections-v1/
          retention-days: 7
