name: Four Atlantic latitude current depth contours v1
"on":
  push:
    branches: [codex/current-measurement-gaps]
    paths:
      - .github/workflows/atlantic-latitude-velocity-curtains-v1.yml
      - analysis/derive_atlantic_latitude_velocity_curtains_v1.py
      - analysis/test_atlantic_latitude_velocity_curtains_v1.py
      - plans/atlantic-latitude-velocity-curtains-protocol-v1.md
      - research/atlantic-latitude-velocity-curtains-operator-v1.json
concurrency:
  group: osw-current-gap-delivery
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  derive:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
