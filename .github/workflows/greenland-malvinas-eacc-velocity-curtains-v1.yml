name: Greenland Malvinas and EACC depth contours v1
"on":
  push:
    branches: [codex/current-measurement-gaps]
    paths:
      - .github/workflows/greenland-malvinas-eacc-velocity-curtains-v1.yml
      - analysis/derive_greenland_malvinas_eacc_velocity_curtains_v1.py
      - analysis/test_greenland_malvinas_eacc_velocity_curtains_v1.py
      - plans/greenland-malvinas-eacc-velocity-curtains-protocol-v1.md
      - research/greenland-malvinas-eacc-velocity-curtains-operator-v1.json
concurrency:
  group: osw-current-gap-delivery
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  derive:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
