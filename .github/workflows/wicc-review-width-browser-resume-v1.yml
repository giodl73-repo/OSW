name: Sequential saved-engine WICC review width browser review v1
"on":
  push:
    branches: [codex/current-measurement-gaps]
    paths:
      - research/wicc-review-width-browser-resume-request-v1.json
      - .github/workflows/wicc-review-width-browser-resume-v1.yml
concurrency:
  group: osw-current-gap-delivery
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
env:
  GH_TOKEN: ${{ github.token }}
  OSW_WICC_REVIEW_WIDTH_DELIVERY_V1: "1"
  OSW_WICC_BROWSER_RESUME_V1: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  PYTHONPATH: analysis
jobs:
  select-request:
    runs-on: ubuntu-latest
    outputs:
      execute: ${{ steps.request.outputs.execute }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: research/wicc-review-width-browser-resume-request-v1.json
      - id: request
        run: |
          python - <<'PY'
          import json,os,pathlib
          r=json.loads(pathlib.Path('research/wicc-review-width-browser-resume-request-v1.json').read_bytes())
          assert type(r['execute']) is bool
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('execute='+str(r['execute']).lower()+'\n')
          PY
  browser:
    needs: select-request
    if: needs.select-request.outputs.execute == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Lightweight source and preservation checks
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_resume_wicc_review_width_browser_v1.py' -v
          taskset -c "$cpu" nice -n 15 node analysis/test_review_cited_widths_ui_v1.mjs
          taskset -c "$cpu" nice -n 15 node analysis/test_published_current_speeds_ui_v1.mjs
          taskset -c "$cpu" nice -n 15 node analysis/test_published_current_speed_source_links_v1.mjs
      - name: Install pinned browser
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python -m pip install playwright==1.58.0
          taskset -c "$cpu" nice -n 15 python -m playwright install --with-deps chromium
      - id: browser
        name: Verify exact saved candidate and browser views without rebuilding
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python analysis/resume_wicc_review_width_browser_v1.py
      - name: Retain browser evidence and exact engine metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wicc-review-width-browser-resume-evidence-v1
          path: |
            .pytest_cache/wicc-review-width-browser-resume-v1/browser-failure.json
            .pytest_cache/wicc-review-width-browser-resume-v1/browser.json
            .pytest_cache/wicc-review-width-browser-resume-v1/result.json
            .pytest_cache/wicc-review-width-browser-resume-v1/parent-snapshots.json
            .pytest_cache/wicc-review-width-browser-resume-v1/engine.json
            .pytest_cache/wicc-review-width-browser-resume-v1/*.png
            .pytest_cache/wicc-review-width-browser-resume-v1/*.geometry.json
          if-no-files-found: warn
          retention-days: 14
