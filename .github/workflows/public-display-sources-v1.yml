name: Public display source-use inventory v1
"on":
  push:
    branches: [codex/current-measurement-gaps]
    paths:
      - .github/workflows/public-display-sources-v1.yml
concurrency:
  group: osw-current-gap-delivery
  cancel-in-progress: false
permissions:
  contents: read
env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            almanac/display-data-v1
            research/ocean-motion-source-use-reviews.json
            analysis/audit_public_display_sources_v1.py
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Inventory actual public candidate source uses on one idle CPU
        run: |
          cpu=$(python -c 'import os; print(min(os.sched_getaffinity(0)))')
          timeout --kill-after=1s 60s taskset -c "$cpu" nice -n 15 python analysis/audit_public_display_sources_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-display-sources-v1
          path: .pytest_cache/public-display-sources-v1/result.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
