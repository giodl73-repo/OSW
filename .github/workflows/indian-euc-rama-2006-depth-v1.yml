name: Indian EUC RAMA positive IOD2006 depth v1
"on":
  push:
    branches: [codex/current-measurement-gaps]
    paths:
      - analysis/indian_euc_observed_profile_checks_v1.py
      - .github/workflows/indian-euc-rama-2006-depth-v1.yml
      - analysis/collect_indian_euc_rama_2006_depth_v1.py
      - analysis/test_indian_euc_rama_2006_depth_v1.py
      - plans/indian-euc-rama-2006-depth-protocol-v1.md
      - research/indian-euc-rama-2006-depth-operator-v1.json
      - research/indian-euc-rama-2006-depth-source-context-v1.json
concurrency:
  group: osw-current-gap-delivery
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/indian-euc-rama-2005-depth-v1.yml
            .github/workflows/indian-euc-rama-2006-depth-v1.yml
            analysis/collect_indian_euc_rama_2005_depth_v1.py
            analysis/collect_indian_euc_rama_2006_depth_v1.py
            analysis/collect_tao_pacific_euc_daily_depth_v1.py
            analysis/derive_eac_connected_layer_thickness_v1.py
            analysis/indian_euc_observed_profile_checks_v1.py
            analysis/test_indian_euc_rama_2005_depth_v1.py
            analysis/test_indian_euc_rama_2006_depth_v1.py
            plans/indian-euc-rama-2005-depth-protocol-v1.md
            plans/indian-euc-rama-2006-depth-protocol-v1.md
            research/current-depth-indian-euc-rama-2005-source-review-v1.json
            research/current-depth-tao-pacific-euc-daily-source-review-v1.json
            research/current-depth-tao-pacific-euc-direct-source-review-v2.json
            research/indian-euc-rama-2005-depth-operator-v1.json
            research/indian-euc-rama-2005-depth-source-context-v1.json
            research/indian-euc-rama-2006-depth-operator-v1.json
            research/indian-euc-rama-2006-depth-source-context-v1.json
            research/source-data/indian-euc-rama-2005-depth-v1/field-plan.json
            research/source-data/indian-euc-rama-2005-depth-v1/indian-field-04.raw
            research/source-data/indian-euc-rama-2005-depth-v1/indian-field-05.raw
            research/source-data/indian-euc-rama-2005-depth-v1/indian-field-06.raw
            research/source-data/indian-euc-rama-2005-depth-v1/indian-field-07.raw
            research/source-data/indian-euc-rama-2005-depth-v1/journal.json
            research/source-data/indian-euc-rama-2005-depth-v1/profiles.json
            research/source-data/tao-pacific-euc-daily-depth-v1/journal.json
            research/source-data/tao-pacific-euc-daily-depth-v1/metadata.raw
            research/source-data/tao-pacific-euc-direct-source-v2/field-plan.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Verify regional core, persistence and whole-case budget rules
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_indian_euc_rama_2006_depth_v1.py' -v
      - name: Collect independent Indian profiles sequentially with internal deadline
        timeout-minutes: 6
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python analysis/collect_indian_euc_rama_2006_depth_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: indian-euc-rama-2006-depth-v1
          path: indian-euc-rama-2006-depth-v1/
          retention-days: 7
          if-no-files-found: error
