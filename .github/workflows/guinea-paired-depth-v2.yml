name: Guinea paired component depths v2
"on":
  push:
    branches: [codex/current-measurement-gaps]
    paths:
      - analysis/derive_guinea_paired_depth_v2.py
      - analysis/test_guinea_paired_depth_v2.py
      - plans/guinea-paired-depth-v2.md
      - .github/workflows/guinea-paired-depth-v2.yml
      - research/guinea-paired-depth-operator-v1.json
concurrency:
  group: osw-current-gap-delivery
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  derive:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            analysis/derive_guinea_paired_depth_v2.py
            analysis/test_guinea_paired_depth_v2.py
            plans/guinea-paired-depth-v2.md
            .github/workflows/guinea-paired-depth-v2.yml
            research/guinea-paired-depth-operator-v1.json
            analysis/compiled_depth_catalog_query_guard_v3.py
            research/guinea-velocity-depth-curtains-v1.json
            research/current-depth-guinea-velocity-curtains-source-review-v1.json
            research/guinea-depth-sections-operator-v1.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Synthetic semantic checks then bounded offline geometry on one idle CPU
        timeout-minutes: 3
        run: |
          export OSW_DEPTH_CASE_CPU=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          export OSW_GUINEA_PAIRED_DEPTH_START=$(python -c "import time;print(time.monotonic())")
          timeout --signal=TERM --kill-after=2s 55s bash -e <<'OSW_DEPTH_CASE'
          taskset -c "$OSW_DEPTH_CASE_CPU" nice -n 15 python -m unittest discover -s analysis -p 'test_guinea_paired_depth_v2.py' -v
          taskset -c "$OSW_DEPTH_CASE_CPU" nice -n 15 python analysis/derive_guinea_paired_depth_v2.py
          OSW_DEPTH_CASE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guinea-paired-depth-v2
          path: guinea-paired-depth-v2/
          retention-days: 7
          if-no-files-found: error
