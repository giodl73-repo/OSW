name: Install verified saved coastal context

"on":
  push:
    branches: [codex/current-measurement-gaps]
    paths:
      - research/current-gap-delivery-phase.json
      - research/indian-coastal-context-installation-request-v1.json
      - .github/workflows/install-indian-coastal-context-v1.yml

concurrency:
  group: osw-current-gap-delivery
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  select-phase:
    runs-on: ubuntu-latest
    outputs:
      phase: ${{ steps.phase.outputs.phase }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: research/current-gap-delivery-phase.json
      - id: phase
        run: |
          python - <<'PY'
          import json, os, pathlib
          phase = json.loads(pathlib.Path('research/current-gap-delivery-phase.json').read_bytes())['phase']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('phase=' + phase + '\n')
          PY
  install-saved-context:
    needs: select-phase
    if: needs.select-phase.outputs.phase == 'indian-coastal-context-install-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - id: request
        name: Require the exact reviewed installation request
        run: |
          python - <<'PY'
          import json, os, pathlib, sys
          sys.path.insert(0, 'analysis')
          from install_indian_coastal_context_v1 import verify_request, REQUEST, PHASE, WORKFLOW
          request = json.loads(pathlib.Path(REQUEST).read_bytes())
          verify_request(request)
          phase = json.loads(pathlib.Path(PHASE).read_bytes())
          assert phase['phase'] == 'indian-coastal-context-install-v1'
          assert phase['execution_workflow'] == WORKFLOW and phase['heavy_work_permitted'] is True
          assert phase['max_heavy_local_jobs'] == 0
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('presentation_run_id=' + str(request['presentation_run_id']) + '\n')
          PY
      - name: Retrieve exact API run and source-control evidence
        env:
          GH_TOKEN: ${{ github.token }}
          PRESENTATION_RUN: ${{ steps.request.outputs.presentation_run_id }}
        run: |
          mkdir -p .pytest_cache/indian-coastal-install/audit
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/40100017734" > .pytest_cache/indian-coastal-install/audit/source-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/40100017734/jobs?per_page=100" > .pytest_cache/indian-coastal-install/audit/source-jobs.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRESENTATION_RUN" > .pytest_cache/indian-coastal-install/audit/presentation-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRESENTATION_RUN/jobs?per_page=100" > .pytest_cache/indian-coastal-install/audit/presentation-jobs.json
          gh api "repos/$GITHUB_REPOSITORY/compare/0c2f0dc67a9ba25cbf488f634702b05f30401f2f...$GITHUB_SHA" > .pytest_cache/indian-coastal-install/audit/control-compare.json
      - name: Verify both completed validation runs before restoring data
        run: |
          python - <<'PY'
          import json, pathlib, sys
          sys.path.insert(0, 'analysis')
          from indian_coastal_delivery_receipts_v1 import verify_run
          from verify_indian_coastal_installation_v1 import verify_presentation_run
          from install_indian_coastal_context_v1 import REQUEST
          folder = pathlib.Path('.pytest_cache/indian-coastal-install/audit')
          verify_run(json.loads((folder/'source-run.json').read_bytes()), json.loads((folder/'source-jobs.json').read_bytes()))
          request = json.loads(pathlib.Path(REQUEST).read_bytes())
          verify_presentation_run(json.loads((folder/'presentation-run.json').read_bytes()),
              json.loads((folder/'presentation-jobs.json').read_bytes()), request)
          PY
      - name: Install only the pinned receipt-test dependency
        run: python -m pip install pytest==8.4.2
      - name: Check installation, presentation and exact receipt guards
        run: >-
          python -m pytest -q analysis/test_install_indian_coastal_context_v1.py
          analysis/test_verify_indian_coastal_installation_v1.py
          analysis/test_indian_coastal_card_presentation_v1.py
          analysis/test_indian_coastal_delivery_receipts_v1.py
      - uses: actions/checkout@v6
        with:
          ref: 0c2f0dc67a9ba25cbf488f634702b05f30401f2f
          path: .pytest_cache/indian-coastal-install/site
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          run-id: 40100017734
          github-token: ${{ github.token }}
          name: indian-coastal-derived-candidate
          path: .pytest_cache/indian-coastal-install/site
      - uses: actions/download-artifact@v4
        with:
          run-id: 40100017734
          github-token: ${{ github.token }}
          name: indian-coastal-query-engine
          path: .pytest_cache/indian-coastal-install/site/almanac
      - uses: actions/download-artifact@v4
        with:
          run-id: 40100017734
          github-token: ${{ github.token }}
          name: indian-coastal-formatted-runtime
          path: .pytest_cache/indian-coastal-install/site/rust/osw-query/src
      - uses: actions/download-artifact@v4
        with:
          run-id: 40100017734
          github-token: ${{ github.token }}
          name: indian-coastal-candidate-audit
          path: .pytest_cache/indian-coastal-install/audit/source
      - uses: actions/download-artifact@v4
        with:
          run-id: 40100017734
          github-token: ${{ github.token }}
          name: indian-coastal-browser-receipts
          path: .pytest_cache/indian-coastal-install/audit/browser
      - uses: actions/download-artifact@v4
        with:
          run-id: 40100017734
          github-token: ${{ github.token }}
          name: indian-coastal-prior-card-receipts
          path: .pytest_cache/indian-coastal-install/prior
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.request.outputs.presentation_run_id }}
          github-token: ${{ github.token }}
          name: indian-coastal-card-presentation-v1
          path: .pytest_cache/indian-coastal-install/audit/presentation
      - name: Select the exact preceding current-card receipt
        run: |
          python - <<'PY'
          import pathlib, shutil
          found = list(pathlib.Path('.pytest_cache/indian-coastal-install/prior').rglob('current-gap-admission/browser/result.json'))
          assert len(found) == 1
          target = pathlib.Path('.pytest_cache/indian-coastal-install/audit/prior-cards/result.json')
          target.parent.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(found[0], target)
          PY
      - name: Verify exact saved cohorts, reviewed screenshots and transport then install
        run: >-
          python analysis/install_indian_coastal_context_v1.py --publish
          --site .pytest_cache/indian-coastal-install/site --audit .pytest_cache/indian-coastal-install/audit
      - name: Retain installation proof and exact published commit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: indian-coastal-context-installed-delivery-v1
          path: |
            research/indian-coastal-context-installed-delivery-v1.json
            .pytest_cache/indian-coastal-install/audit/installation-result.json
          include-hidden-files: true
          if-no-files-found: ignore
