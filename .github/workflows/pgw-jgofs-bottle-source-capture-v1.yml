name: Bounded JGOFS PGW bottle source capture v1
"on":
  push:
    branches: [codex/current-measurement-gaps]
    paths:
      - analysis/capture_pgw_jgofs_bottles_v1.py
      - analysis/test_pgw_jgofs_bottle_capture_v1.py
      - plans/pgw-jgofs-bounded-bottle-source-case-v1.md
      - .github/workflows/pgw-jgofs-bottle-source-capture-v1.yml
      - research/pgw-jgofs-bottle-source-case-operator-v1.json
concurrency:
  group: osw-current-gap-delivery
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            analysis/capture_pgw_jgofs_bottles_v1.py
            analysis/test_pgw_jgofs_bottle_capture_v1.py
            plans/pgw-jgofs-bounded-bottle-source-case-v1.md
            .github/workflows/pgw-jgofs-bottle-source-capture-v1.yml
            research/pgw-jgofs-bottle-source-case-operator-v1.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Synthetic link/header gates then original bounded source capture
        timeout-minutes: 3
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          export OSW_JGOFS_CAPTURE_START=$(python -c "import time;print(time.monotonic())")
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_pgw_jgofs_bottle_capture_v1.py' -v
          taskset -c "$cpu" nice -n 15 python analysis/capture_pgw_jgofs_bottles_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pgw-jgofs-bottle-source-capture-v1
          path: pgw-jgofs-bottle-source-capture-v1/
          retention-days: 7
          if-no-files-found: error
