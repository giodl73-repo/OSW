name: Current depth NEUC qualified meridional mean inventory v62
"on":
  push:
    branches: [codex/current-measurement-gaps]
    paths:
      - .github/workflows/current-depth-route-projections-v62.yml
      - analysis/build_current_depth_route_projections_v62.py
      - analysis/test_current_depth_route_projections_v62.py
      - plans/pacific-neuc-qualified-mean-meridional-depth-v1.md
      - research/current-depth-route-projection-operator-v62.json
concurrency:
  group: osw-current-gap-delivery
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  derive:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
