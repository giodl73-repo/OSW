      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Offline admitted descriptor join and semantics on one idle CPU
        timeout-minutes: 3
        run: |
          export OSW_DEPTH_CASE_CPU=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          export OSW_DEPTH_ALMANAC_START=$(python -c "import time;print(time.monotonic())")
          timeout --signal=TERM --kill-after=2s 60s bash -e <<'OSW_DEPTH_CASE'
          taskset -c "$OSW_DEPTH_CASE_CPU" nice -n 15 python -m unittest discover -s analysis -p 'test_current_depth_almanac_v1.py' -v
          taskset -c "$OSW_DEPTH_CASE_CPU" nice -n 15 python analysis/build_current_depth_almanac_v1.py
          OSW_DEPTH_CASE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-depth-almanac-v1
          path: current-depth-almanac-v1/
          retention-days: 7
          if-no-files-found: error
