name: Current depth almanac v1 admitted references and regional pairs
"on":
  push:
    branches: [codex/current-measurement-gaps]
    paths:
      - analysis/build_current_depth_almanac_v1.py
      - analysis/test_current_depth_almanac_v1.py
      - plans/current-depth-almanac-protocol-v1.md
      - .github/workflows/current-depth-almanac-v1.yml
      - research/current-depth-almanac-operator-v1.json
      - research/current-depth-almanac-inputs-v1.json
concurrency:
  group: osw-current-gap-delivery
  cancel-in-progress: false
permissions:
  contents: read
