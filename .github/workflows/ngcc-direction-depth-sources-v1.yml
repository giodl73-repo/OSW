name: NGCC reused native direction depth sources v1
"on":
  push:
    branches: [codex/current-measurement-gaps]
    paths:
      - .github/workflows/ngcc-direction-depth-sources-v1.yml
      - analysis/derive_ngcc_direction_depth_sources_v1.py
      - analysis/test_ngcc_direction_depth_sources_v1.py
      - plans/ngcc-direction-depth-source-protocol-v1.md
      - research/ngcc-direction-depth-source-operator-v1.json
      - research/current-depth-next-individual-source-scope-review-v1.json
concurrency:
  group: osw-current-gap-delivery
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  derive:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            analysis/acquire_barents_makassar_interval_depth_sections_v1.py
            analysis/acquire_latitude_depth_sections_v2.py
            analysis/acquire_ngcuc_interval_depth_sections_v1.py
            analysis/acquire_north_brazil_depth_sections_v1.py
            analysis/acquire_three_current_depth_sections_v1.py
            analysis/acquire_zonal_current_depth_sections_v1.py
            analysis/bounded_hycom_component_reads_v1.py
            analysis/bounded_hycom_latitude_reads_v1.py
            analysis/bounded_hycom_mixed_reads_v1.py
            analysis/derive_eac_connected_layer_thickness_v1.py
            analysis/derive_ngcc_direction_depth_sources_v1.py
            analysis/interval_depth_diagnostic_v1.py
            analysis/interval_transverse_section_audit_v1.py
            analysis/latitude_depth_section_geometry_v1.py
            analysis/latitude_interval_section_audit_v1.py
            analysis/mixed_interval_section_geometry_v1.py
            analysis/sample_atlantic_current_depth_v1.py
            analysis/sample_eac_hycom_route_depth_v1.py
            analysis/sample_eac_hycom_route_depth_v2.py
            analysis/sample_kuroshio_hycom_depth_v1.py
            analysis/test_barents_makassar_interval_depth_sections_v1.py
            analysis/test_ngcc_direction_depth_sources_v1.py
            analysis/test_ngcuc_interval_depth_sections_v1.py
            plans/barents-makassar-interval-depth-sections-protocol-v1.md
            plans/ngcc-direction-depth-source-protocol-v1.md
            plans/ngcuc-interval-depth-sections-protocol-v1.md
            research/barents-makassar-interval-depth-sections-operator-v1.json
            research/current-depth-next-individual-source-scope-review-v1.json
            research/current-depth-source-facts-v14.json
            research/current-depth-source-facts-v18.json
            research/current-depth-source-facts-v20.json
            research/current-depth-source-facts-v6.json
            research/greenland-depth-sections-operator-v1.json
            research/indonesian-throughflow-network-input.json
            research/indonesian-throughflow-network-scope-audit.json
            research/new-guinea-coastal-current-seasonal-direction-scope-audit.json
            research/new-guinea-coastal-undercurrent-reference-path-input.json
            research/ngcc-direction-depth-source-operator-v1.json
            research/ngcuc-interval-depth-sections-operator-v1.json
            research/ngcuc-interval-depth-sections-source-review-v1.json
            research/north-cape-branch-profile-scope-audit.json
            research/north-cape-northern-reach-reference-path-input.json
            research/norwegian-atlantic-slope-working-admission.json
            research/norwegian-naming-branch-scope-audit.json
            research/source-data/ngcuc-interval-depth-sections-v1/2022-03-15-new-guinea-coastal-undercurrent-section-142e.json
            research/source-data/ngcuc-interval-depth-sections-v1/2022-03-15-new-guinea-coastal-undercurrent-section-143p5e.json
            research/source-data/ngcuc-interval-depth-sections-v1/2022-03-15-new-guinea-coastal-undercurrent-section-145e.json
            research/source-data/ngcuc-interval-depth-sections-v1/2022-03-15-new-guinea-coastal-undercurrent-section-146e.json
            research/source-data/ngcuc-interval-depth-sections-v1/2022-06-15-new-guinea-coastal-undercurrent-section-142e.json
            research/source-data/ngcuc-interval-depth-sections-v1/2022-06-15-new-guinea-coastal-undercurrent-section-143p5e.json
            research/source-data/ngcuc-interval-depth-sections-v1/2022-06-15-new-guinea-coastal-undercurrent-section-145e.json
            research/source-data/ngcuc-interval-depth-sections-v1/2022-06-15-new-guinea-coastal-undercurrent-section-146e.json
            research/source-data/ngcuc-interval-depth-sections-v1/2022-09-15-new-guinea-coastal-undercurrent-section-142e.json
            research/source-data/ngcuc-interval-depth-sections-v1/2022-09-15-new-guinea-coastal-undercurrent-section-143p5e.json
            research/source-data/ngcuc-interval-depth-sections-v1/2022-09-15-new-guinea-coastal-undercurrent-section-145e.json
            research/source-data/ngcuc-interval-depth-sections-v1/2022-09-15-new-guinea-coastal-undercurrent-section-146e.json
            research/source-data/ngcuc-interval-depth-sections-v1/2022-12-15-new-guinea-coastal-undercurrent-section-142e.json
            research/source-data/ngcuc-interval-depth-sections-v1/2022-12-15-new-guinea-coastal-undercurrent-section-143p5e.json
            research/source-data/ngcuc-interval-depth-sections-v1/2022-12-15-new-guinea-coastal-undercurrent-section-145e.json
            research/source-data/ngcuc-interval-depth-sections-v1/2022-12-15-new-guinea-coastal-undercurrent-section-146e.json
            research/source-data/ngcuc-interval-depth-sections-v1/manifest.json
            research/west-australian-current-naming-seasonal-scope-audit.json
            research/west-australian-oscar-section-input.json
            research/zonal-current-depth-sections-operator-v1.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Verify reused native fields and opposite NGCC direction diagnostics on one idle CPU
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python -m pip install netCDF4==1.7.4 numpy==2.3.4 pyproj==3.7.2
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_ngcc_direction_depth_sources_v1.py' -v
          taskset -c "$cpu" nice -n 15 python analysis/derive_ngcc_direction_depth_sources_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ngcc-direction-depth-sources-v1
          path: ngcc-direction-depth-sources-v1/
          retention-days: 7
