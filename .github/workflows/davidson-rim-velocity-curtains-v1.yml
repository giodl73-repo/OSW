            research/zonal-current-depth-sections-operator-v1.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Reproduce every original case and derive native depth variation without retrieval
        timeout-minutes: 5
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python -m pip install numpy==2.4.1 netCDF4==1.7.4 pyproj==3.7.2
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_davidson_rim_surface_qualified_depth_sections_v1.py' -v
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_davidson_rim_velocity_curtains_v1.py' -v
          taskset -c "$cpu" nice -n 15 python analysis/derive_davidson_rim_velocity_curtains_v1.py --current current:davidson
          taskset -c "$cpu" nice -n 15 python analysis/derive_davidson_rim_velocity_curtains_v1.py --current current:black-sea-rim
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: davidson-rim-velocity-curtains-davidson-v1
          path: davidson-rim-velocity-curtains-v1/davidson/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: davidson-rim-velocity-curtains-black-sea-rim-v1
          path: davidson-rim-velocity-curtains-v1/black-sea-rim/
          retention-days: 7
