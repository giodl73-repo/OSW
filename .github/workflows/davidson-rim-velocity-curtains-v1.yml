name: Davidson and southern Black Sea Rim depth contours v1
"on":
  push:
    branches: [codex/current-measurement-gaps]
    paths:
      - .github/workflows/davidson-rim-velocity-curtains-v1.yml
      - analysis/derive_davidson_rim_velocity_curtains_v1.py
      - analysis/test_davidson_rim_velocity_curtains_v1.py
      - plans/davidson-rim-velocity-curtains-protocol-v1.md
      - research/davidson-rim-velocity-curtains-operator-v1.json
concurrency:
  group: osw-current-gap-delivery
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  derive:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
