name: Frozen OSNAP West Greenland source-header inspection v1

"on":
  workflow_call:

# Invoked only by the phase controller, which owns the shared delivery
# concurrency group. Repeating that group here would deadlock a reusable call.
permissions:
  contents: read

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  inspect-original-source-headers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Require the declared source phase and installed Baffin delivery
        run: |
          python - <<'PY'
          import json, os, pathlib
          assert os.environ['GITHUB_REF'] == 'refs/heads/codex/current-measurement-gaps'
          load = lambda path: json.loads(pathlib.Path(path).read_bytes())
          assert load('research/current-gap-delivery-phase.json')['phase'] == 'osnap-wg-source-inventory-v1'
          proof = load('research/baffin-bound-installed-delivery-v1.json')
          packet = load('almanac/query-data.json')
          assert proof['schema'] == 'osw.baffin-bound-installed-delivery.v1'
          assert proof['status'] == 'verified_cloud_delivery'
          assert proof['cohort_version'] == 'baffin-described-latitudes-v1'
          assert all(proof[key] is True for key in ('native_verified', 'browser_verified', 'working_dataset_delivery_verified'))
          assert proof['packet_logical_sha256'] == packet['logical_sha256']
          assert proof['scientific_release_published'] is False and proof['main_merged'] is False
          PY
      - name: Install the pinned inspection and fixture dependencies
        run: python -m pip install netCDF4==1.7.4 numpy==2.4.1 pytest==8.4.2
      - name: Run tiny synthetic guards and zero-observation header fixtures
        run: python -m pytest -q analysis/test_osnap_wg_2016_2018_source_inspection_v1.py
      - name: Verify the committed freeze and retain the pinned README with attribution
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, sys, urllib.request
          sys.path.insert(0, 'analysis')
          import inspect_osnap_wg_2016_2018_source_v1 as source
          source.verify_preflight()
          review = json.loads(pathlib.Path(source.REVIEW).read_bytes())
          source.OUTPUT.mkdir(parents=True, exist_ok=True)
          spec = review['readme']
          with urllib.request.urlopen(spec['url'], timeout=30) as response:
              raw = response.read(100001)
          assert len(raw) == spec['bytes'] and hashlib.sha256(raw).hexdigest() == spec['sha256']
          source.write_once(source.OUTPUT / spec['name'], raw)
          credit = (
              'Source: Pickart, Robert (2020), Microcat, Aquadopp, and ADCP data from the 2016-2018 '
              'Labrador Sea eastern boundary mooring array as part of OSNAP.\n'
              'Publisher: Georgia Institute of Technology. DOI: https://doi.org/10.35090/fz80-6c32\n'
              'Repository: https://repository.gatech.edu/entities/publication/d6deff89-49e2-4476-bb25-07cd9b7dfa86\n'
              'Provider license link: ' + review['metadata_page']['license_link_observed'] + '\n'
              'Original ZIP and README bytes are unchanged. OSW creates custody and header metadata only.\n'
              'No sample-validity, current dimension, annual range, geometry or scientific-release claim.\n'
          )
          source.write_once(source.OUTPUT / 'SOURCE_CREDIT.txt', credit.encode('utf8'))
          PY
      - name: Inspect exact original custody and all declared instrument headers on one CPU
        run: python analysis/inspect_osnap_wg_2016_2018_source_v1.py --cloud-inspect
      - name: Retain original custody, attribution, README and source-header report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osnap-wg-2016-2018-source-custody-v1
          path: .pytest_cache/osnap-wg-2016-2018-source/
          include-hidden-files: true
          if-no-files-found: ignore
          compression-level: 0
