name: Public fast-map first visitor review v1
"on":
  push:
    branches: [codex/current-measurement-gaps]
    paths:
      - .github/workflows/public-map-browser-v1.yml
concurrency:
  group: osw-current-gap-delivery
  cancel-in-progress: false
permissions:
  contents: read
env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            almanac/public-map.html
            almanac/public-map.js
            almanac/public-map.css
            almanac/display-data-v1
            figures/ocean-motion-dashboard-ground.svg
            analysis/review_public_map_browser_v1.py
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install pinned browser on one idle CPU
        run: |
          cpu=$(python -c 'import os; print(min(os.sched_getaffinity(0)))')
          taskset -c "$cpu" nice -n 15 python -m pip install playwright==1.58.0
          taskset -c "$cpu" nice -n 15 python -m playwright install --with-deps chromium
      - name: Check map and record tasks without the full research store
        run: |
          cpu=$(python -c 'import os; print(min(os.sched_getaffinity(0)))')
          timeout --kill-after=1s 8s taskset -c "$cpu" nice -n 15 python analysis/review_public_map_browser_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-map-browser-usability-v1
          path: .pytest_cache/public-map-browser-usability-v1/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
