name: Current depth additive inventory v26
"on":
  push:
    branches: [codex/current-measurement-gaps]
    paths:
      - .github/workflows/current-depth-route-projections-v26.yml
      - analysis/build_current_depth_route_projections_v26.py
      - analysis/test_current_depth_route_projections_v26.py
      - research/current-depth-route-projection-operator-v26.json
concurrency:
  group: osw-current-gap-delivery
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  project:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            analysis/build_current_depth_route_projections_v26.py
            analysis/test_current_depth_route_projections_v26.py
            research/current-depth-route-projection-operator-v26.json
            research/current-depth-route-projection-inventory-v11.json
            research/current-depth-route-projection-inventory-source-review-v11.json
            research/current-depth-route-projections-v14.json
            research/current-depth-route-projections-v14.csv
            research/current-depth-unresolved-reference-cases-v1.csv
            research/current-depth-route-projection-addenda/north-brazil-full-sections-hycom2022-v1.json
            research/current-depth-route-projection-addenda/north-brazil-full-sections-hycom2022-v1.csv
            research/current-depth-route-projection-addenda/three-currents-full-sections-hycom2022-v1.json
            research/current-depth-route-projection-addenda/three-currents-full-sections-hycom2022-v1.csv
            research/current-depth-route-projection-addenda/pacific-madagascar-full-sections-hycom2022-v1.json
            research/current-depth-route-projection-addenda/pacific-madagascar-full-sections-hycom2022-v1.csv
            research/current-depth-route-projection-addenda/zonal-current-full-sections-hycom2022-v1.json
            research/current-depth-route-projection-addenda/zonal-current-full-sections-hycom2022-v1.csv
            research/current-depth-route-projection-addenda/nec-subarctic-full-sections-hycom2022-v1.json
            research/current-depth-route-projection-addenda/nec-subarctic-full-sections-hycom2022-v1.csv
            research/current-depth-route-projection-addenda/countercurrents-sioc-full-sections-hycom2022-v1.json
            research/current-depth-route-projection-addenda/countercurrents-sioc-full-sections-hycom2022-v1.csv
            research/current-depth-route-projection-addenda/guinea-full-sections-hycom2022-v1.json
            research/current-depth-route-projection-addenda/guinea-full-sections-hycom2022-v1.csv
            research/current-depth-route-projection-addenda/southern-reaches-full-sections-hycom2022-v1.json
            research/current-depth-route-projection-addenda/southern-reaches-full-sections-hycom2022-v1.csv
            research/current-depth-route-projection-addenda/greenland-full-sections-hycom2022-v1.json
            research/current-depth-route-projection-addenda/greenland-full-sections-hycom2022-v1.csv
            research/current-depth-route-projection-addenda/irminger-wsc-full-sections-hycom2022-v1.json
            research/current-depth-route-projection-addenda/irminger-wsc-full-sections-hycom2022-v1.csv
            research/current-depth-route-projection-addenda/wsc-interval20-500-hycom2022-v1.json
            research/current-depth-route-projection-addenda/wsc-interval20-500-hycom2022-v1.csv
            research/florida-portugal-depth-sections-source-facts-v1.json
            research/florida-portugal-depth-sections-source-review-v1.json
            research/florida-portugal-depth-sections-operator-v1.json
            research/source-data/florida-portugal-depth-sections-v1/manifest.json
            analysis/build_current_depth_route_projections_v12.py
            analysis/build_current_depth_route_projections_v15.py
            analysis/build_current_depth_route_projections_v16.py
            analysis/build_current_depth_route_projections_v18.py
            analysis/load_current_depth_projection_inventory_v1.py
            research/source-data/florida-portugal-depth-sections-v1/2022-01-15-florida-section-25p5n.json
            research/source-data/florida-portugal-depth-sections-v1/2022-01-15-florida-section-26n.json
            research/source-data/florida-portugal-depth-sections-v1/2022-01-15-florida-section-26p5n.json
            research/source-data/florida-portugal-depth-sections-v1/2022-01-15-florida-section-27n.json
            research/source-data/florida-portugal-depth-sections-v1/2022-01-15-florida-section-27p5n.json
            research/source-data/florida-portugal-depth-sections-v1/2022-01-15-portugal-section-44n.json
            research/source-data/florida-portugal-depth-sections-v1/2022-01-15-portugal-section-42n.json
            research/source-data/florida-portugal-depth-sections-v1/2022-01-15-portugal-section-40n.json
            research/source-data/florida-portugal-depth-sections-v1/2022-01-15-portugal-section-38n.json
            research/source-data/florida-portugal-depth-sections-v1/2022-01-15-portugal-section-36n.json
            research/source-data/florida-portugal-depth-sections-v1/2022-07-15-florida-section-25p5n.json
            research/source-data/florida-portugal-depth-sections-v1/2022-07-15-florida-section-26n.json
            research/source-data/florida-portugal-depth-sections-v1/2022-07-15-florida-section-26p5n.json
            research/source-data/florida-portugal-depth-sections-v1/2022-07-15-florida-section-27n.json
            research/source-data/florida-portugal-depth-sections-v1/2022-07-15-florida-section-27p5n.json
            research/source-data/florida-portugal-depth-sections-v1/2022-07-15-portugal-section-44n.json
            research/source-data/florida-portugal-depth-sections-v1/2022-07-15-portugal-section-42n.json
            research/source-data/florida-portugal-depth-sections-v1/2022-07-15-portugal-section-40n.json
            research/source-data/florida-portugal-depth-sections-v1/2022-07-15-portugal-section-38n.json
            research/source-data/florida-portugal-depth-sections-v1/2022-07-15-portugal-section-36n.json
            research/source-data/florida-portugal-depth-sections-v1/transport-ledger.json
            research/wsc-interval20-500-depth-reanalysis-v1.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build and verify Florida Portugal additive inventory on one idle CPU
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python -m pip install pyproj==3.7.2
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_current_depth_route_projections_v26.py' -v
          taskset -c "$cpu" nice -n 15 python analysis/build_current_depth_route_projections_v26.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-depth-route-projections-v26
          path: current-depth-route-projections-v26/
          retention-days: 7
