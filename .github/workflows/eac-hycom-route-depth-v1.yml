name: EAC HYCOM route depth v1
"on":
  push:
    branches: [codex/current-measurement-gaps]
    paths:
      - .github/workflows/eac-hycom-route-depth-v1.yml
      - analysis/sample_eac_hycom_route_depth_v1.py
      - analysis/test_eac_hycom_route_depth_v1.py
      - research/eac-hycom-route-depth-operator-v1.json
concurrency:
  group: osw-current-gap-delivery
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  sample:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            analysis/sample_eac_hycom_route_depth_v1.py
            analysis/test_eac_hycom_route_depth_v1.py
            research/eac-hycom-route-depth-operator-v1.json
            research/east-australian-reference-path-candidate.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Test and sample bounded model subsets on one idle CPU
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python -m pip install netCDF4==1.7.4 numpy==2.3.4 pyproj==3.7.2
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p test_eac_hycom_route_depth_v1.py -v
          taskset -c "$cpu" nice -n 15 python analysis/sample_eac_hycom_route_depth_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eac-hycom-route-depth-v1
          path: eac-hycom-route-depth-v1/
          retention-days: 7
