      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Project admitted descriptors without provider requests or new measurements
        run: |
          cpu=$(python -c 'import os; print(min(os.sched_getaffinity(0)))')
          timeout --kill-after=1s 56s taskset -c "$cpu" nice -n 15 python analysis/build_preview_data_projection_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-data-projection-v1
          path: .pytest_cache/preview-data-projection-v1/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
