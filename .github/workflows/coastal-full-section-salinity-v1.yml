            research/source-data/ncc-original-core-salinity-v1/target-5.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Validate original and cohort rules then collect sequentially on one idle CPU
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python -m pip install numpy==2.4.1 netCDF4==1.7.4 pyproj==3.7.2
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_ncc_original_core_salinity_v1.py' -v
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_coastal_full_section_salinity_v1.py' -v
          taskset -c "$cpu" nice -n 15 python analysis/coastal_full_section_salinity_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coastal-full-section-salinity-v1
          path: coastal-full-section-salinity-v1/
          retention-days: 7
