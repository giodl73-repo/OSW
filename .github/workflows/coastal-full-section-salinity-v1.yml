name: Coastal full section collocated fresh layer audit v1
"on":
  push:
    branches: [codex/current-measurement-gaps]
    paths:
      - .github/workflows/coastal-full-section-salinity-v1.yml
      - analysis/coastal_full_section_salinity_v1.py
      - analysis/egcc_core_salinity_diagnostic_v1.py
      - analysis/test_coastal_full_section_salinity_v1.py
      - plans/coastal-full-section-fresh-layer-protocol-v1.md
      - research/coastal-full-section-salinity-operator-v1.json
concurrency:
  group: osw-current-gap-delivery
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            analysis/acquire_ncc_original_core_salinity_v1.py
            analysis/coastal_full_section_salinity_v1.py
            analysis/derive_eac_connected_layer_thickness_v1.py
            analysis/egcc_core_salinity_diagnostic_v1.py
            analysis/interval_depth_diagnostic_v1.py
            analysis/ncc_core_salinity_diagnostic_v1.py
            analysis/test_coastal_full_section_salinity_v1.py
            analysis/test_ncc_original_core_salinity_v1.py
            plans/coastal-full-section-fresh-layer-protocol-v1.md
            plans/ncc-original-core-salinity-protocol-v1.md
            research/coastal-full-section-salinity-operator-v1.json
            research/coastal-upper-layer-interval-depth-sections-operator-v1.json
            research/current-depth-egcc-sutherland2008-original-depth-source-review-v1.json
            research/current-depth-ncc-original-core-salinity-source-review-v1.json
            research/current-depth-reference-inventory-v11.json
            research/current-depth-reference-inventory-v9.json
            research/eddy-measurement-register-v1.csv
            research/eddy-measurement-register-v1.json
            research/egcc-sutherland2008-coastal-front-depth-source-facts-v1.json
            research/guiana-egcc-upper-layer-interval-depth-sections-operator-v1.json
            research/interval-core-connected-reach-source-report-v1.json
            research/ncc-enge2025-depth-identity-source-scope-review-v1.json
            research/ncc-original-core-salinity-operator-v1.json
            research/source-data/coastal-upper-layer-interval-depth-sections-v1/2022-03-15-norwegian-coastal-section-58p5n.json
            research/source-data/coastal-upper-layer-interval-depth-sections-v1/2022-03-15-norwegian-coastal-section-59p25n.json
            research/source-data/coastal-upper-layer-interval-depth-sections-v1/2022-03-15-norwegian-coastal-section-60n.json
