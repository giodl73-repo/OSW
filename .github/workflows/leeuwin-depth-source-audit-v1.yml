name: Leeuwin depth source audit v1
"on":
  push:
    branches: [codex/current-measurement-gaps]
    paths:
      - .github/workflows/leeuwin-depth-source-audit-v1.yml
      - analysis/audit_leeuwin_depth_source_v1.py
concurrency:
  group: osw-current-gap-delivery
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: analysis/audit_leeuwin_depth_source_v1.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Inspect only the cited TR50 product on one idle CPU
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python -m pip install netCDF4==1.7.4 numpy==2.3.4
          taskset -c "$cpu" nice -n 15 python analysis/audit_leeuwin_depth_source_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: leeuwin-depth-source-audit-v1
          path: leeuwin-depth-source-audit-v1/
          retention-days: 7
