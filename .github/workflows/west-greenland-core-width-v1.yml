name: Frozen West Greenland regional core diagnostic v1

"on":
  workflow_call:

# The calling phase controller holds the shared single-heavy-job lock.
permissions:
  contents: read
  actions: read

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  calculate-regional-core-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          # Restore only the preflight/phase first, then the exact pinned files.
          sparse-checkout: |
            research/west-greenland-core-width-preflight-v1.json
            research/current-gap-delivery-phase.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Require the declared core phase and restore all committed frozen inputs
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess
          assert os.environ['GITHUB_REF'] == 'refs/heads/codex/current-measurement-gaps'
          root = pathlib.Path.cwd()
          phase = json.loads((root / 'research/current-gap-delivery-phase.json').read_bytes())
          assert phase['phase'] == 'west-greenland-core-width-v1'
          path = 'research/west-greenland-core-width-preflight-v1.json'
          raw = (root / path).read_bytes()
          assert subprocess.check_output(['git', 'show', 'HEAD:' + path]) == raw
          pins = json.loads(raw)['input_sha256']
          assert 20 <= len(pins) <= 40
          for name in pins:
              assert name and not name.startswith('-') and (root / name).resolve().is_relative_to(root)
          subprocess.run(['git', 'sparse-checkout', 'set', '--no-cone', path, 'research/current-gap-delivery-phase.json', *sorted(pins)], check=True)
          load = lambda p: json.loads((root / p).read_bytes())
          support = load('research/osnap-wg-2016-2018-sample-support-execution-review-v1.json')
          view = load('research/osnap-observation-support-view-delivery-review-v1.json')
          assert support['source_run_id'] == 40093031002 and support['run_conclusion'] == 'success'
          assert view['workflow_run_id'] == 40094342378 and view['run_conclusion'] == 'success'
          assert view['status'] == 'VERIFIED_CLOUD_VIEW_AND_PHONE_SCREENSHOTS'
          PY
      - name: Install the pinned numeric readers and fixture dependencies
        run: python -m pip install numpy==2.4.1 scipy==1.17.1 netCDF4==1.7.4 pyproj==3.7.2 pytest==8.4.2
      - name: Run synthetic kernels, original-reader guards and fictional deployment
        run: >-
          python -m pytest -q analysis/test_west_greenland_core_width_math_v1.py
          analysis/test_west_greenland_core_width_operator_v1.py
      - name: Verify the full committed prospective freeze before original restoration
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'analysis')
          import build_west_greenland_core_width_v1 as core
          core.verify_preflight()
          PY
      - name: Restore the first original archive and acquisition receipt
        uses: actions/download-artifact@v4
        with:
          name: osnap-wg-2016-2018-source-custody-v1
          run-id: 40092026859
          github-token: ${{ github.token }}
          path: .pytest_cache/osnap-core-restored-source
      - name: Calculate the frozen regional diagnostic on one CPU without provider access
        run: python analysis/build_west_greenland_core_width_v1.py --cloud-core-width
      - name: Retain every diagnostic outcome, hourly trace and static figure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: west-greenland-regional-core-diagnostic-v1
          path: .pytest_cache/west-greenland-core-width-v1/
          include-hidden-files: true
          if-no-files-found: ignore
          compression-level: 0
