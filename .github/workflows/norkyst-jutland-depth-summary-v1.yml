name: NorKyst Jutland dated depth profile audit v1
"on":
  push:
    branches: [codex/current-measurement-gaps]
    paths:
      - analysis/audit_norkyst_jutland_depth_v1.py
      - analysis/test_norkyst_jutland_depth_summary_v1.py
      - plans/norkyst-jutland-depth-summary-protocol-v1.md
      - research/norkyst-jutland-depth-summary-operator-v1.json
      - .github/workflows/norkyst-jutland-depth-summary-v1.yml
concurrency:
  group: osw-current-gap-delivery
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/norkyst-jutland-depth-v1.yml
            analysis/audit_norkyst_jutland_depth_v1.py
            analysis/collect_norkyst_jutland_depth_v1.py
            analysis/derive_eac_connected_layer_thickness_v1.py
            analysis/interval_depth_diagnostic_v1.py
            analysis/test_norkyst_jutland_depth_summary_v1.py
            analysis/test_norkyst_jutland_depth_v1.py
            plans/norkyst-jutland-depth-protocol-v1.md
            plans/norkyst-jutland-depth-summary-protocol-v1.md
            research/current-depth-norkyst-jutland-sections-source-review-v1.json
            research/jutland-current-naming-scope-audit.json
            research/jutland-kuijpers1993-bedform-depth-source-facts-v1.json
            research/norkyst-ingoy-source-metadata-20240315.das
            research/norkyst-ingoy-source-metadata-20240615.das
            research/norkyst-ingoy-source-metadata-20240915.das
            research/norkyst-ingoy-source-metadata-20241215.das
            research/norkyst-jutland-depth-operator-v1.json
            research/norkyst-jutland-depth-summary-operator-v1.json
            research/source-data/norkyst-ingoy-months-2024/20240101.das
            research/source-data/norkyst-ingoy-months-2024/20240101.dds
            research/source-data/norkyst-ingoy-months-2024/metadata-probe.json
            research/source-data/norkyst-jutland-depth-v1/case-00.ascii
            research/source-data/norkyst-jutland-depth-v1/case-00.json
            research/source-data/norkyst-jutland-depth-v1/case-01.ascii
            research/source-data/norkyst-jutland-depth-v1/case-01.json
            research/source-data/norkyst-jutland-depth-v1/case-02.ascii
            research/source-data/norkyst-jutland-depth-v1/case-02.json
            research/source-data/norkyst-jutland-depth-v1/case-03.ascii
            research/source-data/norkyst-jutland-depth-v1/case-03.json
            research/source-data/norkyst-jutland-depth-v1/case-04.ascii
            research/source-data/norkyst-jutland-depth-v1/case-04.json
            research/source-data/norkyst-jutland-depth-v1/case-05.ascii
            research/source-data/norkyst-jutland-depth-v1/case-05.json
            research/source-data/norkyst-jutland-depth-v1/case-06.ascii
            research/source-data/norkyst-jutland-depth-v1/case-06.json
            research/source-data/norkyst-jutland-depth-v1/case-07.ascii
            research/source-data/norkyst-jutland-depth-v1/case-07.json
            research/source-data/norkyst-jutland-depth-v1/case-08.ascii
            research/source-data/norkyst-jutland-depth-v1/case-08.json
            research/source-data/norkyst-jutland-depth-v1/case-09.ascii
            research/source-data/norkyst-jutland-depth-v1/case-09.json
            research/source-data/norkyst-jutland-depth-v1/case-10.ascii
            research/source-data/norkyst-jutland-depth-v1/case-10.json
            research/source-data/norkyst-jutland-depth-v1/case-11.ascii
            research/source-data/norkyst-jutland-depth-v1/case-11.json
            research/source-data/norkyst-jutland-depth-v1/manifest.json
            research/source-data/norkyst-jutland-depth-v1/preflight.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify frozen collector and exact retained source reconstruction
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python -m pip install pyproj==3.7.2
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_norkyst_jutland_depth_v1.py' -v
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_norkyst_jutland_depth_summary_v1.py' -v
      - name: Build dated regional depth anchors without provider access
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python analysis/audit_norkyst_jutland_depth_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: norkyst-jutland-depth-summary-v1
          path: norkyst-jutland-depth-summary-v1/
          retention-days: 7
