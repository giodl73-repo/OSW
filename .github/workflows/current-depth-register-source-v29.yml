name: Current depth register source review v29
"on":
  push:
    branches: [codex/current-measurement-gaps]
    paths:
      - .github/workflows/current-depth-register-source-v29.yml
      - analysis/build_current_depth_register_v29.py
      - analysis/test_current_depth_register_v29.py
      - research/current-depth-rules-v29.json
      - research/current-depth-source-facts-v29.json
      - research/current-depth-register-v29.json
      - research/current-depth-register-v29.csv
concurrency:
  group: osw-current-gap-delivery
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  source-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            analysis/build_current_depth_register_v*.py
            analysis/build_atlantic_cruise_widths.py
            analysis/test_current_depth_register_v29.py
            research/current-depth-*.json
            research/caribbean-current-depth-*.json
            research/current-depth-register-v*.csv
            research/current-length-estimate-register-v1.json
            research/current-length-reference-extents-v1.json
            research/current-length-reference-extents-v5.json
            research/ocean-current-width-inventory.json
            research/antarctic-coastal-schubert-2021-composite-width-scope-audit.json
            research/source-data/cainzos-atlantic-2023/table-*.xlsx
            research/source-data/cainzos-atlantic-2023/article.xml
            research/source-data/li-neuc-2018/journal-article.xml
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Verify historical Aleutian name mapping and geostrophic curve reach
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_current_depth_register_v29.py' -v
