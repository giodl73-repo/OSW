name: Bounded native client full coordinate diagnosis v1
"on":
  push:
    branches: [codex/current-measurement-gaps]
    paths:
      - .github/workflows/hycom-native-client-coordinate-probe-v1.yml
      - analysis/probe_hycom_native_client_coordinates_v1.py
      - analysis/test_hycom_native_client_coordinate_probe_v1.py
      - plans/hycom-native-client-coordinate-probe-protocol-v1.md
      - research/hycom-native-client-coordinate-probe-operator-v1.json
concurrency:
  group: osw-current-gap-delivery
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            analysis/probe_hycom_native_client_coordinates_v1.py
            analysis/test_hycom_native_client_coordinate_probe_v1.py
            plans/hycom-native-client-coordinate-probe-protocol-v1.md
            research/current-depth-hycom-ncc-metadata-diagnosis-source-review-v1.json
            research/current-depth-ncc-mid-norway-source-attempt-result-v1.json
            research/hycom-native-client-coordinate-probe-operator-v1.json
            research/source-data/hycom-ncc-mid-norway-metadata-probe-v1/probe-report.json
            research/source-data/hycom-ncc-mid-norway-metadata-probe-v1/response-1.json
            research/source-data/hycom-ncc-mid-norway-metadata-probe-v1/response-7.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Verify coordinate guards exact pairing and durable timeout diagnostics
        timeout-minutes: 2
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python -m pip install numpy==2.4.1 netCDF4==1.7.4
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_hycom_native_client_coordinate_probe_v1.py' -v
      - name: Probe native client and full coordinates with a two minute worker deadline
        timeout-minutes: 4
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python analysis/probe_hycom_native_client_coordinates_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hycom-native-client-coordinate-probe-v1
          path: hycom-native-client-coordinate-probe-v1/
          retention-days: 7
