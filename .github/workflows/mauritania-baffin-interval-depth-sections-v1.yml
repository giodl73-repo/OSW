name: Mauritania Baffin interval depth sections v1
"on":
  push:
    branches: [codex/current-measurement-gaps]
    paths:
      - analysis/acquire_mauritania_baffin_interval_depth_sections_v1.py
      - analysis/latitude_interval_section_audit_v1.py
      - plans/mauritania-baffin-interval-depth-sections-protocol-v1.md
      - analysis/test_mauritania_baffin_interval_depth_sections_v1.py
      - .github/workflows/mauritania-baffin-interval-depth-sections-v1.yml
      - analysis/acquire_latitude_depth_sections_v2.py
      - analysis/latitude_depth_section_geometry_v1.py
      - analysis/bounded_hycom_latitude_reads_v1.py
      - analysis/test_bounded_hycom_latitude_reads_v1.py
      - analysis/test_latitude_depth_section_geometry_v1.py
      - research/mauritania-baffin-interval-depth-sections-operator-v1.json
concurrency:
  group: osw-current-gap-delivery
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            analysis/acquire_mauritania_baffin_interval_depth_sections_v1.py
            analysis/test_mauritania_baffin_interval_depth_sections_v1.py
            research/mauritania-baffin-interval-depth-sections-operator-v1.json
            analysis/latitude_depth_section_geometry_v1.py
            analysis/bounded_hycom_latitude_reads_v1.py
            analysis/bounded_hycom_component_reads_v1.py
            analysis/acquire_three_current_depth_sections_v1.py
            analysis/acquire_north_brazil_depth_sections_v1.py
            analysis/sample_eac_hycom_route_depth_v1.py
            analysis/sample_eac_hycom_route_depth_v2.py
            analysis/sample_atlantic_current_depth_v1.py
            analysis/sample_kuroshio_hycom_depth_v1.py
            analysis/derive_eac_connected_layer_thickness_v1.py
            analysis/acquire_latitude_depth_sections_v2.py
            analysis/interval_depth_diagnostic_v1.py
            analysis/interval_transverse_section_audit_v1.py
            analysis/latitude_interval_section_audit_v1.py
            analysis/acquire_zonal_current_depth_sections_v1.py
            research/greenland-depth-sections-operator-v1.json
            plans/mauritania-baffin-interval-depth-sections-protocol-v1.md
            research/current-depth-source-facts-v2.json
            research/current-depth-source-facts-v15.json
            research/baffin-reach-reference-path-input.json
            research/mauritanian-summer-reach-reference-path-input.json
            research/mauritanian-summer-reach-scope-audit.json
            analysis/test_eac_connected_layer_thickness_v1.py
            analysis/test_interval_depth_diagnostic_v1.py
            analysis/test_bounded_hycom_component_reads_v1.py
            analysis/test_bounded_hycom_latitude_reads_v1.py
            analysis/test_latitude_depth_section_geometry_v1.py
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Verify latitude geometry and acquire bounded slices on one idle CPU
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python -m pip install netCDF4==1.7.4 numpy==2.3.4 pyproj==3.7.2
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_eac_connected_layer_thickness_v1.py' -v
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_interval_depth_diagnostic_v1.py' -v
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_bounded_hycom_component_reads_v1.py' -v
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_bounded_hycom_latitude_reads_v1.py' -v
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_latitude_depth_section_geometry_v1.py' -v
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_mauritania_baffin_interval_depth_sections_v1.py' -v
          taskset -c "$cpu" nice -n 15 python analysis/acquire_mauritania_baffin_interval_depth_sections_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mauritania-baffin-interval-depth-sections-v1
          path: mauritania-baffin-interval-depth-sections-v1/
          retention-days: 7
