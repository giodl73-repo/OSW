name: Paired regional depth and section geometry v1
"on":
  push:
    branches: [codex/current-measurement-gaps]
    paths:
      - analysis/derive_barents_makassar_section_geometry_v1.py
      - analysis/test_barents_makassar_section_geometry_v1.py
      - plans/barents-makassar-paired-section-geometry-v1.md
      - .github/workflows/barents-makassar-section-geometry-v1.yml
      - research/barents-makassar-section-geometry-operator-v1.json
concurrency:
  group: osw-current-gap-delivery
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  derive:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            analysis/derive_barents_makassar_section_geometry_v1.py
            analysis/test_barents_makassar_section_geometry_v1.py
            plans/barents-makassar-paired-section-geometry-v1.md
            .github/workflows/barents-makassar-section-geometry-v1.yml
            research/barents-makassar-section-geometry-operator-v1.json
            analysis/compiled_depth_catalog_query_guard_v3.py
            research/barents-makassar-velocity-depth-curtains-v1.json
            research/current-depth-barents-makassar-velocity-curtains-source-review-v1.json
            research/barents-makassar-interval-depth-sections-operator-v1.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Synthetic semantic checks then bounded offline geometry on one idle CPU
        timeout-minutes: 3
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          export OSW_SECTION_GEOMETRY_START=$(python -c "import time;print(time.monotonic())")
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_barents_makassar_section_geometry_v1.py' -v
          taskset -c "$cpu" nice -n 15 python analysis/derive_barents_makassar_section_geometry_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: barents-makassar-section-geometry-v1
          path: barents-makassar-section-geometry-v1/
          retention-days: 7
          if-no-files-found: error
