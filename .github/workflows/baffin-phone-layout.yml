name: Baffin saved-cohort phone layout

"on":
  workflow_call:

# The calling phase controller owns the single-heavy-job concurrency lock.
permissions:
  contents: read
  actions: read

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  phone-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install the pinned browser check dependency
        run: python -m pip install playwright==1.58.0
      - name: Retrieve saved Baffin data in an isolated cloud workspace
        uses: actions/download-artifact@v4
        with:
          name: baffin-derived-candidate
          run-id: 40083318018
          github-token: ${{ github.token }}
          path: .pytest_cache/baffin-phone-layout/site
      - name: Retrieve its exact matching engine
        uses: actions/download-artifact@v4
        with:
          name: baffin-query-engine
          run-id: 40083318018
          github-token: ${{ github.token }}
          path: .pytest_cache/baffin-phone-layout/site/almanac
      - name: Retrieve its source and preservation receipt
        uses: actions/download-artifact@v4
        with:
          name: baffin-candidate-audit
          run-id: 40083318018
          github-token: ${{ github.token }}
          path: .pytest_cache/baffin-phone-layout/source
      - name: Install Chromium after downloads finish
        run: python -m playwright install --with-deps chromium
      - name: Verify exact saved cohort and every phone scenario column
        run: python analysis/check_baffin_bound_phone_layout.py
      - name: Retain phone layout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baffin-compact-phone-layout
          path: |
            .pytest_cache/baffin-phone-layout/result.json
            .pytest_cache/baffin-phone-layout/card-320px.png
            .pytest_cache/baffin-phone-layout/card-390px.png
          include-hidden-files: true
          if-no-files-found: ignore
