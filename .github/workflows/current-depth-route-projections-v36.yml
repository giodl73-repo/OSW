      - .github/workflows/current-depth-route-projections-v36.yml
      - analysis/build_current_depth_route_projections_v36.py
      - analysis/test_current_depth_route_projections_v36.py
      - research/current-depth-route-projection-operator-v36.json
concurrency:
  group: osw-current-gap-delivery
  cancel-in-progress: false
permissions:
