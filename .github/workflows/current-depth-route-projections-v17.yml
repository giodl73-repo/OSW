            research/source-data/pacific-madagascar-depth-sections-v1/2022-07-15-southern-east-madagascar-section-20s.json
            research/source-data/pacific-madagascar-depth-sections-v1/2022-07-15-southern-east-madagascar-section-21s.json
            research/source-data/pacific-madagascar-depth-sections-v1/2022-07-15-southern-east-madagascar-section-22s.json
            research/source-data/pacific-madagascar-depth-sections-v1/2022-07-15-southern-east-madagascar-section-23s.json
            research/source-data/pacific-madagascar-depth-sections-v1/2022-07-15-southern-east-madagascar-section-24s.json
            research/source-data/pacific-madagascar-depth-sections-v1/2022-07-15-southern-east-madagascar-section-25p5s.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build and verify Pacific Madagascar additive inventory on one idle CPU
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python -m pip install pyproj==3.7.2
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_current_depth_route_projections_v17.py' -v
          taskset -c "$cpu" nice -n 15 python analysis/build_current_depth_route_projections_v17.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-depth-route-projections-v17
          path: current-depth-route-projections-v17/
          retention-days: 7
