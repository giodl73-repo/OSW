            research/source-data/pacific-madagascar-depth-sections-v1/2022-01-15-southern-east-madagascar-section-21s.json
            research/source-data/pacific-madagascar-depth-sections-v1/2022-01-15-southern-east-madagascar-section-22s.json
            research/source-data/pacific-madagascar-depth-sections-v1/2022-01-15-southern-east-madagascar-section-23s.json
            research/source-data/pacific-madagascar-depth-sections-v1/2022-01-15-southern-east-madagascar-section-24s.json
            research/source-data/pacific-madagascar-depth-sections-v1/2022-01-15-southern-east-madagascar-section-25p5s.json
            research/source-data/pacific-madagascar-depth-sections-v1/2022-07-15-california-section-43n.json
            research/source-data/pacific-madagascar-depth-sections-v1/2022-07-15-california-section-40n.json
