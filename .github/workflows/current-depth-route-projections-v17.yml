name: Current depth additive inventory v17
"on":
  push:
    branches: [codex/current-measurement-gaps]
    paths:
      - .github/workflows/current-depth-route-projections-v17.yml
      - analysis/build_current_depth_route_projections_v17.py
      - analysis/test_current_depth_route_projections_v17.py
      - research/current-depth-route-projection-operator-v17.json
concurrency:
  group: osw-current-gap-delivery
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  project:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            analysis/build_current_depth_route_projections_v17.py
            analysis/test_current_depth_route_projections_v17.py
            research/current-depth-route-projection-operator-v17.json
            research/current-depth-route-projection-inventory-v2.json
            research/current-depth-route-projection-inventory-source-review-v2.json
            research/current-depth-route-projections-v14.json
            research/current-depth-route-projections-v14.csv
            research/current-depth-unresolved-reference-cases-v1.csv
            research/current-depth-route-projection-addenda/north-brazil-full-sections-hycom2022-v1.json
            research/current-depth-route-projection-addenda/north-brazil-full-sections-hycom2022-v1.csv
            research/current-depth-route-projection-addenda/three-currents-full-sections-hycom2022-v1.json
            research/current-depth-route-projection-addenda/three-currents-full-sections-hycom2022-v1.csv
            research/pacific-madagascar-depth-sections-source-facts-v1.json
            research/pacific-madagascar-depth-sections-source-review-v1.json
            research/pacific-madagascar-depth-sections-operator-v1.json
            research/source-data/pacific-madagascar-depth-sections-v1/manifest.json
            analysis/build_current_depth_route_projections_v12.py
            analysis/build_current_depth_route_projections_v15.py
            analysis/build_current_depth_route_projections_v16.py
            analysis/load_current_depth_projection_inventory_v1.py
            research/source-data/pacific-madagascar-depth-sections-v1/2022-01-15-california-section-43n.json
            research/source-data/pacific-madagascar-depth-sections-v1/2022-01-15-california-section-40n.json
            research/source-data/pacific-madagascar-depth-sections-v1/2022-01-15-california-section-37n.json
            research/source-data/pacific-madagascar-depth-sections-v1/2022-01-15-california-section-34n.json
            research/source-data/pacific-madagascar-depth-sections-v1/2022-01-15-california-section-31n.json
            research/source-data/pacific-madagascar-depth-sections-v1/2022-01-15-california-section-28n.json
            research/source-data/pacific-madagascar-depth-sections-v1/2022-01-15-california-section-25n.json
            research/source-data/pacific-madagascar-depth-sections-v1/2022-01-15-california-section-23n.json
            research/source-data/pacific-madagascar-depth-sections-v1/2022-01-15-alaska-section-48n.json
            research/source-data/pacific-madagascar-depth-sections-v1/2022-01-15-alaska-section-50n.json
            research/source-data/pacific-madagascar-depth-sections-v1/2022-01-15-alaska-section-52n.json
            research/source-data/pacific-madagascar-depth-sections-v1/2022-01-15-alaska-section-54n.json
            research/source-data/pacific-madagascar-depth-sections-v1/2022-01-15-alaska-section-56n.json
            research/source-data/pacific-madagascar-depth-sections-v1/2022-01-15-alaska-section-57n.json
