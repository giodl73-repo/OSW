            research/source-data/pacific-madagascar-depth-sections-v1/2022-07-15-california-section-23n.json
            research/source-data/pacific-madagascar-depth-sections-v1/2022-07-15-alaska-section-48n.json
            research/source-data/pacific-madagascar-depth-sections-v1/2022-07-15-alaska-section-50n.json
            research/source-data/pacific-madagascar-depth-sections-v1/2022-07-15-alaska-section-52n.json
            research/source-data/pacific-madagascar-depth-sections-v1/2022-07-15-alaska-section-54n.json
