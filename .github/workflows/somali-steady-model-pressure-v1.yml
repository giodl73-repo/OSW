name: Somali seasonal steady-model reported pressure extents v1
"on":
  push:
    branches: [codex/current-measurement-gaps]
    paths:
      - analysis/acquire_somali_steady_model_pressures_v1.py
      - analysis/test_somali_steady_model_pressures_v1.py
      - plans/somali-steady-model-pressure-protocol-v1.md
      - research/somali-steady-model-pressure-operator-v1.json
      - .github/workflows/somali-steady-model-pressure-v1.yml
concurrency:
  group: osw-current-gap-delivery
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            analysis/acquire_somali_steady_model_pressures_v1.py
            analysis/test_somali_steady_model_pressures_v1.py
            plans/somali-steady-model-pressure-protocol-v1.md
            .github/workflows/somali-steady-model-pressure-v1.yml
            research/somali-steady-model-pressure-operator-v1.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Sequential one CPU checks and original primary document capture
        run: |
          cpu=$(python -c "import os;print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python -m pip install PyMuPDF==1.28.2
          export OSW_SOMALI_PRESSURE_START=$(python -c "import time;print(time.monotonic())")
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_somali_steady_model_pressures_v1.py' -v
          taskset -c "$cpu" nice -n 15 timeout --signal=TERM --kill-after=5s 70s python analysis/acquire_somali_steady_model_pressures_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: somali-steady-model-pressure-v1
          path: somali-steady-model-pressure-v1/
          retention-days: 7
