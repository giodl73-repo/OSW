name: Current depth published REDSOX statistical thickness inventory v1
"on":
  push:
    branches: [codex/current-measurement-gaps]
    paths:
      - .github/workflows/current-depth-reference-inventory-v1.yml
      - analysis/build_current_depth_reference_inventory_v1.py
      - analysis/load_current_depth_reference_inventory_v1.py
      - analysis/test_current_depth_reference_inventory_v1.py
      - plans/redsox-published-plume-thickness-reference-admission-v1.md
      - research/current-depth-reference-inventory-operator-v1.json
      - research/redsox-published-plume-thickness-source-facts-v1.json
concurrency:
  group: osw-current-gap-delivery
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  derive:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            analysis/build_current_depth_reference_inventory_v1.py
            analysis/load_current_depth_reference_inventory_v1.py
            analysis/test_current_depth_reference_inventory_v1.py
            plans/redsox-published-plume-thickness-reference-admission-v1.md
            research/current-depth-reference-inventory-operator-v1.json
            research/current-depth-register-source-review-v48.json
            research/current-depth-register-v48.csv
            research/current-depth-register-v48.json
            research/current-depth-route-projection-inventory-source-review-v48.json
            research/current-depth-route-projection-inventory-v48.json
            research/current-depth-rules-v48.json
            research/eddy-measurement-register-v1.csv
            research/eddy-measurement-register-v1.json
            research/red-sea-redsox-branch-reach-scope-audit.json
            research/redsox-published-plume-thickness-source-facts-v1.json
            research/source-data/peters-redsox-2005/acquisition.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Verify original table facts and additive reference queries on one idle CPU
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_current_depth_reference_inventory_v1.py' -v
          taskset -c "$cpu" nice -n 15 python analysis/build_current_depth_reference_inventory_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-depth-reference-inventory-v1
          path: current-depth-reference-inventory-v1/
          retention-days: 7
