name: Sequential current-gap delivery

"on":
  push:
    branches: [codex/current-measurement-gaps]
    paths-ignore:
      - almanac/query-data.json
      - almanac/query-parts/**
      - almanac/query-engine.wasm
      - almanac/query-engine.manifest.json
      - almanac/index-catalog.json
      - almanac/index-sources.json
      - almanac/index-data.json.gz
      - research/ocean-motion-dashboard.json
      - research/davidson-width-installed-delivery-v1.json
      - research/baffin-bound-installed-delivery-v1.json

concurrency:
  group: osw-current-gap-delivery
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  CARGO_BUILD_JOBS: "1"
  CARGO_INCREMENTAL: "0"
  RUSTUP_TOOLCHAIN: 1.95.0

jobs:
  select-delivery-phase:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      phase: ${{ steps.phase.outputs.phase }}
    steps:
      - uses: actions/checkout@v6
      - id: phase
        run: |
          python - <<'PY'
          import json, os, pathlib
          path = pathlib.Path('research/current-gap-delivery-phase.json')
          phase = json.loads(path.read_bytes())['phase'] if path.exists() else 'davidson'
          assert phase in ('davidson', 'baffin-bound-v1', 'baffin-bound-recovery-v1', 'osnap-wg-source-inventory-v1', 'source-review-only-v1'), phase
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('phase=' + phase + '\n')
          PY
  davidson-candidate-and-views:
    needs: select-delivery-phase
    if: needs.select-delivery-phase.outputs.phase == 'davidson'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Check small admission and preservation fixtures
        run: >-
          python -m pytest -q analysis/test_davidson_wallace_width_admission.py
          analysis/test_davidson_width_candidate_metadata.py
          analysis/test_davidson_width_candidate_export.py
          analysis/test_davidson_width_delivery.py
          analysis/test_current_gap_index_extension.py
          analysis/test_browser_current_catalogue_fixture.py
          analysis/test_current_card_navigation_probe.py
      - name: Retrieve saved candidate data for the early navigation diagnostic
        uses: actions/download-artifact@v4
        with:
          name: davidson-derived-candidate
          run-id: 40070679739
          github-token: ${{ github.token }}
          path: .pytest_cache/navigation-probe/site
      - name: Retrieve the matching saved engine
        uses: actions/download-artifact@v4
        with:
          name: davidson-query-engine
          run-id: 40070679739
          github-token: ${{ github.token }}
          path: .pytest_cache/navigation-probe/site/almanac
      - name: Retrieve the saved source audit
        uses: actions/download-artifact@v4
        with:
          name: davidson-candidate-audit
          run-id: 40070679739
          github-token: ${{ github.token }}
          path: .pytest_cache/navigation-probe/source
      - name: Install Chromium for the early diagnostic
        run: python -m playwright install --with-deps chromium
      - name: Check navigation before rebuilding data and WASM
        run: >-
          python analysis/probe_current_card_navigation.py
          --site .pytest_cache/navigation-probe/site
          --source-audit .pytest_cache/navigation-probe/source/result.json
          --source-run 40070679739
      - name: Retain the early navigation diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: early-current-card-navigation
          path: |
            .pytest_cache/navigation-probe/result.json
            .pytest_cache/nwasc-card-navigation/
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Export complete candidate and preserve the installed parent
        run: python analysis/export_davidson_width_candidate.py --cloud-candidate
      - name: Retain candidate audit before compilation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: davidson-candidate-audit
          path: .pytest_cache/davidson-width-candidate/result.json
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Install the pinned native and WASM toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --target wasm32-unknown-unknown
      - name: Fetch locked dependencies
        run: cargo fetch --locked --manifest-path rust/osw-query/Cargo.toml
      - name: Build and check native then WASM on one CPU
        run: python analysis/build_rust_query_engine.py
      - name: Retain candidate data for reproducible browser diagnosis
        uses: actions/upload-artifact@v4
        with:
          name: davidson-derived-candidate
          path: .pytest_cache/davidson-width-candidate/artifact/
          if-no-files-found: error
          compression-level: 1
      - name: Retain the matching compiled engine before browser checks
        uses: actions/upload-artifact@v4
        with:
          name: davidson-query-engine
          path: |
            almanac/query-engine.wasm
            almanac/query-engine.manifest.json
          compression-level: 1
      - name: Install the browser after compilation finishes
        run: python -m playwright install --with-deps chromium
      - name: Check the Davidson card and scalar caption
        run: >-
          python analysis/run_rust_query_browser_checks.py --start-server --only-check
          test_davidson_reported_width_browser.py
      - name: Retain Davidson card and scalar render evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: davidson-browser-receipts
          path: .pytest_cache/davidson-reported-width-browser/
          include-hidden-files: true
          if-no-files-found: ignore
      - name: "Source matrix 01/14: complete REDSOX station queries (early)"
        run: >-
          python analysis/run_rust_query_browser_checks.py --start-server --only-check
          test_redsox_station_support_query_browser.py
      - name: Retain REDSOX query progress and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redsox-query-browser-receipts
          path: .pytest_cache/redsox-station-support/query-browser/
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Check existing current cards and the 106-current dashboard
        run: >-
          python analysis/run_rust_query_browser_checks.py --start-server --only-check
          test_current_gap_admission_browser.py
      - name: Retain preceding current-card evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: davidson-prior-card-receipts
          path: .pytest_cache/current-gap-admission/browser/
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Check published regional reaches
        run: >-
          python analysis/run_rust_query_browser_checks.py --start-server --only-check
          test_published_regional_reaches_browser.py
      - name: Check catalogue cards and current-card navigation
        run: >-
          python analysis/run_rust_query_browser_checks.py --start-server --only-check
          test_nwasc_working_admission_browser.py
      - name: Retain catalogue and navigation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-catalogue-navigation-receipts
          path: |
            .pytest_cache/nwasc-admission-browser/
            .pytest_cache/nwasc-card-navigation/
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Check complete atlas selectors sources and corruption rejection
        run: >-
          python analysis/run_rust_query_browser_checks.py --start-server --only-check
          test_rust_atlas_snapshot_browser.py
      - name: Retain complete atlas diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complete-atlas-diagnostics
          path: .pytest_cache/rust-atlas-snapshot-browser/
          include-hidden-files: true
          if-no-files-found: ignore
      - name: "Source matrix 02/14: Caribbean queries"
        run: >-
          python analysis/run_rust_query_browser_checks.py --start-server --only-check
          test_caribbean_ru29_query_browser.py
      - name: "Source matrix 03/14: Caribbean source evidence"
        run: >-
          python analysis/run_rust_query_browser_checks.py --start-server --only-check
          test_caribbean_ru29_source_browser.py
      - name: "Source matrix 04/14: Kuroshio Extension length series"
        run: >-
          python analysis/run_rust_query_browser_checks.py --start-server --only-check
          test_ke_length_series_browser.py
      - name: "Source matrix 05/14: Labrador geographic bound"
        run: >-
          python analysis/run_rust_query_browser_checks.py --start-server --only-check
          test_labrador_gate_bound_browser.py
      - name: "Source matrix 06/14: Angola Nansen sections"
        run: >-
          python analysis/run_rust_query_browser_checks.py --start-server --only-check
          test_angola_nansen_sections_browser.py
      - name: "Source matrix 07/14: Angola Nansen queries"
        run: >-
          python analysis/run_rust_query_browser_checks.py --start-server --only-check
          test_angola_nansen_query_browser.py
      - name: "Source matrix 08/14: REDSOX station support"
        run: >-
          python analysis/run_rust_query_browser_checks.py --start-server --only-check
          test_redsox_station_support_browser.py
      - name: "Source matrix 09/14: Current-gap source queries"
        run: >-
          python analysis/run_rust_query_browser_checks.py --start-server --only-check
          test_current_gap_source_query_browser.py
      - name: "Source matrix 10/14: South Indian front levels"
        run: >-
          python analysis/run_rust_query_browser_checks.py --start-server --only-check
          test_south_indian_front_level_browser.py
      - name: "Source matrix 11/14: South Indian front-level queries"
        run: >-
          python analysis/run_rust_query_browser_checks.py --start-server --only-check
          test_south_indian_front_level_query_browser.py
      - name: "Source matrix 12/14: South Indian front properties"
        run: >-
          python analysis/run_rust_query_browser_checks.py --start-server --only-check
          test_south_indian_front_property_browser.py
      - name: "Source matrix 13/14: South Indian front-property queries"
        run: >-
          python analysis/run_rust_query_browser_checks.py --start-server --only-check
          test_south_indian_front_property_query_browser.py
      - name: "Source matrix 14/14: Indian SECC source boundaries"
        run: >-
          python analysis/run_rust_query_browser_checks.py --start-server --only-check
          test_indian_secc_source_boundary_browser.py

  publish-davidson-working-data:
    needs: davidson-candidate-and-views
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: davidson-derived-candidate
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: davidson-query-engine
          path: almanac
      - uses: actions/download-artifact@v4
        with:
          name: davidson-candidate-audit
          path: .pytest_cache/davidson-publication/source
      - uses: actions/download-artifact@v4
        with:
          name: davidson-browser-receipts
          path: .pytest_cache/davidson-publication/browser
      - uses: actions/download-artifact@v4
        with:
          name: davidson-prior-card-receipts
          path: .pytest_cache/davidson-publication/prior-cards
      - name: Read this run and its completed sequential gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > .pytest_cache/davidson-publication/run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" > .pytest_cache/davidson-publication/jobs.json
      - name: Verify all artifact bindings and publish generated working data
        run: >-
          python analysis/prepare_davidson_width_delivery.py --publish
          --audit-dir .pytest_cache/davidson-publication
      - name: Retain the installed working-data receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: davidson-installed-delivery
          path: research/davidson-width-installed-delivery-v1.json
          if-no-files-found: ignore

  osnap-source-inventory:
    needs: select-delivery-phase
    if: needs.select-delivery-phase.outputs.phase == 'osnap-wg-source-inventory-v1'
    uses: ./.github/workflows/osnap-wg-source-inspection-v1.yml
