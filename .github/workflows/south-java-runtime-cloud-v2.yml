            /rust/osw-query/
      - name: Verify exact source, archive and fixture custody before compilation
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python analysis/check_south_java_runtime_cloud_v2.py preflight
      - name: Install pinned native compiler and locked dependencies
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 rustup toolchain install 1.95.0 --profile minimal
          taskset -c "$cpu" nice -n 15 cargo +1.95.0 fetch --locked --manifest-path rust/osw-query/Cargo.toml
      - name: Run Python, atlas syntax and24 native tests sequentially
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python analysis/check_south_java_runtime_cloud_v2.py tests
      - name: Retain compact source-check evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: south-java-runtime-source-evidence-v2
          path: .pytest_cache/south-java-runtime-cloud-v2/*
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 90
