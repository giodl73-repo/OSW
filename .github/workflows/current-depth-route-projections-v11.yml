name: Current depth route projections v11
"on":
  push:
    branches: [codex/current-measurement-gaps]
    paths:
      - .github/workflows/current-depth-route-projections-v11.yml
      - analysis/build_current_depth_route_projections_v11.py
      - analysis/test_current_depth_route_projections_v11.py
      - research/current-depth-route-projection-operator-v11.json
concurrency:
  group: osw-current-gap-delivery
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  project:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            analysis/build_current_depth_route_projections_v11.py
            analysis/test_current_depth_route_projections_v11.py
            research/current-depth-route-projection-operator-v11.json
            research/current-depth-route-projections-v10.json
            research/current-depth-route-projections-v10.csv
            research/current-depth-route-projections-source-review-v10.json
            research/current-depth-register-v47.json
            research/current-depth-register-source-review-v47.json
            research/gulf-stream-spray-depth-sections-source-facts-v1.json
            research/gulf-stream-spray-depth-sections-source-review-v1.json
            research/gulf-stream-spray-depth-sections-operator-v1.json
            research/source-data/gulf-stream-spray-depth-sections-v1/manifest.json
            research/source-data/gulf-stream-spray-depth-sections-v1/coastal-30n.json
            research/source-data/gulf-stream-spray-depth-sections-v1/coastal-32n.json
            research/source-data/gulf-stream-spray-depth-sections-v1/coastal-34n.json
            research/source-data/gulf-stream-spray-depth-sections-v1/offshore-73w.json
            research/source-data/gulf-stream-spray-depth-sections-v1/offshore-70w.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build and test regional source connectors on one idle CPU
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python -m pip install pyproj==3.7.2
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_current_depth_route_projections_v11.py' -v
          taskset -c "$cpu" nice -n 15 python analysis/build_current_depth_route_projections_v11.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-depth-route-projections-v11
          path: current-depth-route-projections-v11/
          retention-days: 7
