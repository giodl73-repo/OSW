name: Audit installed Pacific SECC parent and publication registry v1
"on":
  push:
    branches: [codex/current-measurement-gaps]
    paths:
      - research/pacific-secc-parent-audit-request-v1.json
      - .github/workflows/pacific-secc-parent-audit-cloud-v1.yml
concurrency:
  group: osw-current-gap-delivery
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
env:
  GH_TOKEN: ${{ github.token }}
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
jobs:
  parent-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - id: request
        name: Read read-only parent audit request
        run: |
          python - <<'PY'
          import json, os, pathlib
          r=json.loads(pathlib.Path('research/pacific-secc-parent-audit-request-v1.json').read_bytes())
          assert r['schema']=='osw.pacific-secc-parent-audit-request.v1'
          assert type(r['execute']) is bool
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('enabled='+str(r['execute']).lower()+'\n')
          PY
      - name: Verify exact installed packet and select publication evidence on one CPU
        if: steps.request.outputs.enabled == 'true'
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python analysis/check_pacific_secc_parent_audit_v1.py
      - name: Retain compact selected records and audit receipts
        if: always() && steps.request.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pacific-secc-installed-parent-audit-v1
          path: .pytest_cache/pacific-secc-parent-audit-v1/*.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 90
