name: Caribbean and Azores native depth contours v1
"on":
  push:
    branches: [codex/current-measurement-gaps]
    paths:
      - .github/workflows/caribbean-azores-velocity-curtains-v1.yml
      - analysis/derive_caribbean_azores_velocity_curtains_v1.py
      - analysis/test_caribbean_azores_velocity_curtains_v1.py
      - plans/caribbean-azores-velocity-curtains-protocol-v1.md
      - research/caribbean-azores-velocity-curtains-operator-v1.json
concurrency:
  group: osw-current-gap-delivery
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  derive:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/caribbean-azores-depth-sections-v1.yml
            analysis/acquire_caribbean_azores_depth_sections_v1.py
            analysis/acquire_north_brazil_depth_sections_v1.py
            analysis/acquire_three_current_depth_sections_v1.py
            analysis/acquire_transverse_depth_sections_v2.py
            analysis/acquire_zonal_current_depth_sections_v1.py
            analysis/bounded_hycom_component_reads_v1.py
            analysis/derive_barents_makassar_velocity_curtains_v1.py
            analysis/derive_caribbean_azores_velocity_curtains_v1.py
            analysis/derive_eac_connected_layer_thickness_v1.py
            analysis/derive_guinea_velocity_curtains_v1.py
            analysis/derive_surface_regional_velocity_curtains_v1.py
            analysis/interval_depth_diagnostic_v1.py
            analysis/interval_transverse_section_audit_v1.py
            analysis/latitude_depth_section_geometry_v1.py
            analysis/latitude_interval_section_audit_v1.py
            analysis/mixed_interval_section_geometry_v1.py
            analysis/sample_atlantic_current_depth_v1.py
            analysis/sample_eac_hycom_route_depth_v1.py
            analysis/sample_eac_hycom_route_depth_v2.py
            analysis/sample_kuroshio_hycom_depth_v1.py
            analysis/test_bounded_hycom_component_reads_v1.py
            analysis/test_caribbean_azores_depth_sections_v1.py
            analysis/test_caribbean_azores_velocity_curtains_v1.py
            analysis/test_eac_connected_layer_thickness_v1.py
            analysis/test_three_current_depth_sections_v1.py
            analysis/test_zonal_current_depth_sections_v1.py
            plans/caribbean-azores-velocity-curtains-protocol-v1.md
            research/caribbean-azores-depth-sections-operator-v1.json
            research/caribbean-azores-depth-sections-source-facts-v1.json
            research/caribbean-azores-depth-sections-source-review-v1.json
            research/caribbean-azores-velocity-curtains-operator-v1.json
            research/caribbean-current-depth-operator-v1.json
            research/caribbean-current-depth-source-review-v1.json
            research/current-depth-reference-inventory-v18.json
            research/source-data/caribbean-azores-depth-sections-v1/2022-01-15-azores-section-21w.json
            research/source-data/caribbean-azores-depth-sections-v1/2022-01-15-azores-section-24p5w.json
            research/source-data/caribbean-azores-depth-sections-v1/2022-01-15-azores-section-27w.json
            research/source-data/caribbean-azores-depth-sections-v1/2022-01-15-azores-section-31w.json
            research/source-data/caribbean-azores-depth-sections-v1/2022-01-15-azores-section-35w.json
            research/source-data/caribbean-azores-depth-sections-v1/2022-01-15-caribbean-section-68w.json
            research/source-data/caribbean-azores-depth-sections-v1/2022-01-15-caribbean-section-71w.json
            research/source-data/caribbean-azores-depth-sections-v1/2022-01-15-caribbean-section-74w.json
            research/source-data/caribbean-azores-depth-sections-v1/2022-01-15-caribbean-section-77w.json
            research/source-data/caribbean-azores-depth-sections-v1/2022-01-15-caribbean-section-80w.json
            research/source-data/caribbean-azores-depth-sections-v1/2022-07-15-azores-section-21w.json
            research/source-data/caribbean-azores-depth-sections-v1/2022-07-15-azores-section-24p5w.json
            research/source-data/caribbean-azores-depth-sections-v1/2022-07-15-azores-section-27w.json
            research/source-data/caribbean-azores-depth-sections-v1/2022-07-15-azores-section-31w.json
            research/source-data/caribbean-azores-depth-sections-v1/2022-07-15-azores-section-35w.json
            research/source-data/caribbean-azores-depth-sections-v1/2022-07-15-caribbean-section-68w.json
            research/source-data/caribbean-azores-depth-sections-v1/2022-07-15-caribbean-section-71w.json
            research/source-data/caribbean-azores-depth-sections-v1/2022-07-15-caribbean-section-74w.json
            research/source-data/caribbean-azores-depth-sections-v1/2022-07-15-caribbean-section-77w.json
            research/source-data/caribbean-azores-depth-sections-v1/2022-07-15-caribbean-section-80w.json
            research/source-data/caribbean-azores-depth-sections-v1/manifest.json
            research/source-data/caribbean-azores-depth-sections-v1/transport-ledger.json
            research/zonal-current-depth-sections-operator-v1.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Reproduce every original case and derive native depth variation without retrieval
        timeout-minutes: 5
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python -m pip install numpy==2.4.1 netCDF4==1.7.4 pyproj==3.7.2
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_caribbean_azores_depth_sections_v1.py' -v
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_caribbean_azores_velocity_curtains_v1.py' -v
          taskset -c "$cpu" nice -n 15 python analysis/derive_caribbean_azores_velocity_curtains_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: caribbean-azores-velocity-curtains-v1
          path: caribbean-azores-velocity-curtains-v1/
          retention-days: 7
