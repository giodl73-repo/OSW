      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Reproduce frozen source studies and audit lower reach on one idle CPU
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python -m pip install numpy==2.4.1 netCDF4==1.7.4 pyproj==3.7.2
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_barents_makassar_interval_depth_sections_v1.py' -v
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_coastal_upper_layer_interval_depth_sections_v1.py' -v
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_guiana_egcc_upper_layer_interval_depth_sections_v1.py' -v
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_interval_core_connected_reach_audit_v1.py' -v
          taskset -c "$cpu" nice -n 15 python analysis/audit_interval_core_connected_reach_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interval-core-connected-reach-audit-v1
          path: interval-core-connected-reach-audit-v1/
          retention-days: 7
