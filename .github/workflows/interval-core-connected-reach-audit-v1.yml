name: Interval current primary core connected minimum reach audit v1
"on":
  push:
    branches: [codex/current-measurement-gaps]
    paths:
      - .github/workflows/interval-core-connected-reach-audit-v1.yml
      - analysis/audit_interval_core_connected_reach_v1.py
      - analysis/test_interval_core_connected_reach_audit_v1.py
      - plans/interval-core-connected-reach-audit-protocol-v1.md
      - research/interval-core-connected-reach-audit-operator-v1.json
concurrency:
  group: osw-current-gap-delivery
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
