name: Boundary and northern subsurface depth contours v1
"on":
  push:
    branches: [codex/current-measurement-gaps]
    paths:
      - .github/workflows/boundary-subsurface-velocity-curtains-v1.yml
      - analysis/derive_boundary_subsurface_velocity_curtains_v1.py
      - analysis/test_boundary_subsurface_velocity_curtains_v1.py
