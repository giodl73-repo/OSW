name: Malvinas bathymetry screen v1
"on":
  push:
    branches: [codex/current-measurement-gaps]
    paths:
      - .github/workflows/malvinas-bathymetry-screen-v1.yml
      - analysis/derive_malvinas_bathymetry_screen_v1.py
      - analysis/test_malvinas_bathymetry_screen_v1.py
      - research/malvinas-bathymetry-screen-operator-v1.json
concurrency:
  group: osw-current-gap-delivery
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            analysis/audit_malvinas_adcp_depth_v1.py
            analysis/derive_malvinas_branch_core_scenarios_v1.py
            analysis/derive_malvinas_bathymetry_screen_v1.py
            analysis/test_malvinas_bathymetry_screen_v1.py
            analysis/test_malvinas_branch_core_scenarios_v1.py
            research/malvinas-bathymetry-screen-operator-v1.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Verify screening and derive bounded GEBCO scenarios sequentially
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python -m pip install pyproj==3.7.2
          taskset -c "$cpu" nice -n 15 python -c "import sys,unittest; loader=unittest.TestLoader(); suite=unittest.TestSuite([loader.discover('analysis',pattern='test_malvinas_bathymetry_screen_v1.py'),loader.discover('analysis',pattern='test_malvinas_branch_core_scenarios_v1.py')]); result=unittest.TextTestRunner(verbosity=2).run(suite); sys.exit(not result.wasSuccessful())"
          taskset -c "$cpu" nice -n 15 python analysis/derive_malvinas_bathymetry_screen_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: malvinas-bathymetry-screen-v1
          path: malvinas-bathymetry-screen-v1/
          retention-days: 7
