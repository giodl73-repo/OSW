name: Five regional surface current native depth curtains v1
"on":
  push:
    branches: [codex/current-measurement-gaps]
    paths:
      - .github/workflows/surface-regional-velocity-curtains-v1.yml
      - analysis/derive_surface_regional_velocity_curtains_v1.py
      - analysis/test_surface_regional_velocity_curtains_v1.py
      - plans/surface-regional-velocity-curtains-protocol-v1.md
      - research/surface-regional-velocity-curtains-operator-v1.json
concurrency:
  group: osw-current-gap-delivery
  cancel-in-progress: false
permissions:
