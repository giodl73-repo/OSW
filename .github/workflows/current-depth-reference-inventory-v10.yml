name: Current depth reproduced NCC fresh component references v10
"on":
  push:
    branches: [codex/current-measurement-gaps]
    paths:
      - .github/workflows/current-depth-reference-inventory-v10.yml
      - analysis/build_current_depth_reference_inventory_v10.py
      - analysis/load_current_depth_reference_inventory_v10.py
