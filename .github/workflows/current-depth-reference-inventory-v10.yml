      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Reproduce retained fields and preserve all prior source classes on one idle CPU
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python -m pip install numpy==2.4.1 netCDF4==1.7.4 pyproj==3.7.2
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_current_depth_reference_inventory_v1.py' -v
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_current_depth_reference_inventory_v2.py' -v
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_current_depth_reference_inventory_v3.py' -v
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_current_depth_reference_inventory_v4.py' -v
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_current_depth_reference_inventory_v5.py' -v
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_current_depth_reference_inventory_v6.py' -v
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_current_depth_reference_inventory_v7.py' -v
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_current_depth_reference_inventory_v8.py' -v
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_current_depth_reference_inventory_v9.py' -v
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_current_depth_reference_inventory_v10.py' -v
          taskset -c "$cpu" nice -n 15 python analysis/build_current_depth_reference_inventory_v10.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-depth-reference-inventory-v10
          path: current-depth-reference-inventory-v10/
          retention-days: 7
