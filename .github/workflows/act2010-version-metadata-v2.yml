name: Agulhas ACT observed version metadata continuation v2
"on":
  push:
    branches: [codex/current-measurement-gaps]
    paths:
      - .github/workflows/act2010-version-metadata-v2.yml
      - research/act2010-version-metadata-operator-v2.json
      - analysis/discover_act2010_version_metadata_v2.py
      - analysis/test_act2010_version_metadata_v2.py
      - plans/act2010-version-metadata-continuation-protocol-v2.md
concurrency:
  group: osw-current-gap-delivery
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/act2010-instrument-metadata-v1.yml
            .github/workflows/act2010-version-metadata-v2.yml
            analysis/discover_act2010_instrument_metadata_v1.py
            analysis/discover_act2010_version_metadata_v2.py
            analysis/test_act2010_instrument_metadata_v1.py
            analysis/test_act2010_version_metadata_v2.py
            plans/act2010-instrument-metadata-protocol-v1.md
            plans/act2010-version-metadata-continuation-protocol-v2.md
            research/act2010-instrument-depth-source-context-v1.json
            research/act2010-instrument-metadata-operator-v1.json
            research/act2010-version-metadata-operator-v2.json
            research/current-depth-act2010-instrument-metadata-source-review-v1.json
            research/source-data/act2010-instrument-metadata-v1/journal.json
            research/source-data/act2010-instrument-metadata-v1/listing-01.raw
            research/source-data/act2010-instrument-metadata-v1/report.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Verify durable bounded metadata-only operations
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_act2010_version_metadata_v2.py' -v
      - name: Discover original published ACT instrument archive without reading fields
        timeout-minutes: 5
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python analysis/discover_act2010_version_metadata_v2.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: act2010-version-metadata-v2
          path: act2010-version-metadata-v2/
          retention-days: 7
          if-no-files-found: error
