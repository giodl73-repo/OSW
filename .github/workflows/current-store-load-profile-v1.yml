name: Sequential saved current dataset load profiling v1
"on":
  push:
    branches: [codex/current-measurement-gaps]
    paths:
      - research/current-store-load-profile-request-v1.json
      - .github/workflows/current-store-load-profile-v1.yml
concurrency:
  group: osw-current-gap-delivery
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
env:
  GH_TOKEN: ${{ github.token }}
  OSW_CURRENT_STORE_LOAD_PROFILE_V1: "1"
  CARGO_BUILD_JOBS: "1"
  CARGO_INCREMENTAL: "0"
  RUST_TEST_THREADS: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
jobs:
  select-request:
    runs-on: ubuntu-24.04
    outputs:
      execute: ${{ steps.request.outputs.execute }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: research/current-store-load-profile-request-v1.json
      - id: request
        run: |
          python - <<'PY'
          import json,os,pathlib
          r=json.loads(pathlib.Path('research/current-store-load-profile-request-v1.json').read_bytes())
          assert r['schema']=='osw.current-store-load-profile-request.v1' and type(r['execute']) is bool
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('execute='+str(r['execute']).lower()+'\n')
          PY
  profile:
    needs: select-request
    if: needs.select-request.outputs.execute == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Verify diagnostic scope without local payload access
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p test_current_store_load_profile_v1.py -v
      - name: Install pinned native toolchain on one low-priority CPU
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 rustup toolchain install 1.95.0 --profile minimal
      - name: Profile saved data validation without producing a production engine
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python analysis/profile_current_store_load_v1.py
      - name: Retain compact diagnostic timings and logs only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-store-load-profile-evidence-v1
          path: |
            .pytest_cache/current-store-load-profile-v1/*.json
            .pytest_cache/current-store-load-profile-v1/*.txt
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
