name: Solomon undercurrents interval depth sections v1
"on":
  push:
    branches: [codex/current-measurement-gaps]
    paths:
      - .github/workflows/solomon-undercurrents-interval-depth-sections-v1.yml
      - analysis/acquire_solomon_undercurrents_interval_depth_sections_v1.py
      - analysis/test_solomon_undercurrents_interval_depth_sections_v1.py
      - research/solomon-undercurrents-interval-depth-sections-operator-v1.json
      - plans/solomon-undercurrents-interval-depth-sections-protocol-v1.md
concurrency:
  group: osw-current-gap-delivery
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            analysis/acquire_barents_makassar_interval_depth_sections_v1.py
            analysis/acquire_latitude_depth_sections_v2.py
            analysis/acquire_ngcuc_interval_depth_sections_v1.py
            analysis/acquire_north_brazil_depth_sections_v1.py
            analysis/acquire_solomon_undercurrents_interval_depth_sections_v1.py
            analysis/acquire_three_current_depth_sections_v1.py
            analysis/acquire_zonal_current_depth_sections_v1.py
            analysis/bounded_hycom_component_reads_v1.py
            analysis/bounded_hycom_latitude_reads_v1.py
            analysis/bounded_hycom_mixed_reads_v1.py
            analysis/derive_eac_connected_layer_thickness_v1.py
            analysis/interval_depth_diagnostic_v1.py
            analysis/interval_transverse_section_audit_v1.py
            analysis/latitude_depth_section_geometry_v1.py
            analysis/latitude_interval_section_audit_v1.py
            analysis/mixed_interval_section_geometry_v1.py
            analysis/sample_atlantic_current_depth_v1.py
            analysis/sample_eac_hycom_route_depth_v1.py
            analysis/sample_eac_hycom_route_depth_v2.py
            analysis/sample_kuroshio_hycom_depth_v1.py
            analysis/test_barents_makassar_interval_depth_sections_v1.py
            analysis/test_bounded_hycom_component_reads_v1.py
            analysis/test_bounded_hycom_latitude_reads_v1.py
            analysis/test_eac_connected_layer_thickness_v1.py
            analysis/test_interval_depth_diagnostic_v1.py
            analysis/test_latitude_depth_section_geometry_v1.py
            analysis/test_ngcuc_interval_depth_sections_v1.py
            analysis/test_solomon_undercurrents_interval_depth_sections_v1.py
            analysis/test_zonal_current_depth_sections_v1.py
            plans/barents-makassar-interval-depth-sections-protocol-v1.md
            plans/ngcuc-interval-depth-sections-protocol-v1.md
            plans/solomon-undercurrents-interval-depth-sections-protocol-v1.md
            research/barents-makassar-interval-depth-sections-operator-v1.json
            research/current-depth-source-facts-v14.json
            research/current-depth-source-facts-v20.json
            research/current-depth-source-facts-v6.json
            research/current-depth-source-facts-v8.json
            research/greenland-depth-sections-operator-v1.json
            research/indonesian-throughflow-network-input.json
            research/indonesian-throughflow-network-scope-audit.json
            research/new-guinea-coastal-undercurrent-reference-path-input.json
            research/new-ireland-coastal-undercurrent-reference-path-input.json
            research/ngcuc-interval-depth-sections-operator-v1.json
            research/north-cape-branch-profile-scope-audit.json
            research/north-cape-northern-reach-reference-path-input.json
            research/solomon-island-coastal-undercurrent-reference-path-input.json
            research/solomon-melet-2010-coastal-confinement-scope-audit.json
            research/solomon-undercurrents-interval-depth-sections-operator-v1.json
            research/source-data/melet-solomon-2010/acquisition.json
            research/zonal-current-depth-sections-operator-v1.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Verify frozen kernels and collect declared Solomon-region sections
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python -m pip install netCDF4==1.7.4 numpy==2.3.4 pyproj==3.7.2
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_eac_connected_layer_thickness_v1.py' -v
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_interval_depth_diagnostic_v1.py' -v
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_bounded_hycom_component_reads_v1.py' -v
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_bounded_hycom_latitude_reads_v1.py' -v
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_latitude_depth_section_geometry_v1.py' -v
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_zonal_current_depth_sections_v1.py' -v
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_barents_makassar_interval_depth_sections_v1.py' -v
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_solomon_undercurrents_interval_depth_sections_v1.py' -v
          taskset -c "$cpu" nice -n 15 python analysis/acquire_solomon_undercurrents_interval_depth_sections_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: solomon-undercurrents-interval-depth-sections-v1
          path: solomon-undercurrents-interval-depth-sections-v1/
          retention-days: 7
