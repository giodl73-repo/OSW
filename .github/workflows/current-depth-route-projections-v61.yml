      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Audit exact mean rows and preserve all prior profiles on one idle CPU
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python -m pip install pyproj==3.7.2
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_current_depth_route_projections_v61.py' -v
          taskset -c "$cpu" nice -n 15 python analysis/build_current_depth_route_projections_v61.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-depth-route-projections-v61
          path: current-depth-route-projections-v61/
          retention-days: 7
