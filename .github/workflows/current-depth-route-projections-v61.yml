name: Current depth qualified mean field inventory v61
"on":
  push:
    branches: [codex/current-measurement-gaps]
    paths:
      - .github/workflows/current-depth-route-projections-v61.yml
      - analysis/build_current_depth_route_projections_v61.py
      - analysis/test_current_depth_route_projections_v61.py
      - plans/west-australian-qualified-mean-field-sections-v1.md
      - research/current-depth-route-projection-operator-v61.json
concurrency:
  group: osw-current-gap-delivery
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  derive:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
