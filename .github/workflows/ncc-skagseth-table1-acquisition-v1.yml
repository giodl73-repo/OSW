name: NCC Skagseth primary ADCP Table1 custody v1
"on":
  push:
    branches: [codex/current-measurement-gaps]
    paths:
      - .github/workflows/ncc-skagseth-table1-acquisition-v1.yml
      - analysis/acquire_ncc_skagseth_table1_v1.py
      - analysis/test_ncc_skagseth_table1_acquisition_v1.py
      - research/ncc-skagseth-table1-acquisition-operator-v1.json
      - plans/ncc-skagseth-table1-primary-custody-protocol-v1.md
concurrency:
  group: osw-current-gap-delivery
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            analysis/acquire_ncc_skagseth_table1_v1.py
            analysis/test_ncc_skagseth_table1_acquisition_v1.py
            research/ncc-skagseth-table1-acquisition-operator-v1.json
            research/norwegian-coastal-skagseth-2011-cross-section-lead-v1.json
            plans/ncc-skagseth-table1-primary-custody-protocol-v1.md
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Check custody guards then attempt the primary table once
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_ncc_skagseth_table1_acquisition_v1.py' -v
          taskset -c "$cpu" nice -n 15 python analysis/acquire_ncc_skagseth_table1_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ncc-skagseth-table1-acquisition-v1
          path: ncc-skagseth-table1-acquisition-v1/
          retention-days: 7
