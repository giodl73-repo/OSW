name: Caribbean current velocity depth layers v1
"on":
  push:
    branches: [codex/current-measurement-gaps]
    paths:
      - .github/workflows/caribbean-current-depth-layers-v1.yml
      - analysis/measure_caribbean_depth_layers_v1.py
      - analysis/test_caribbean_depth_layers_v1.py
      - research/caribbean-current-depth-operator-v1.json
concurrency:
  group: osw-current-gap-delivery
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  depth-layers:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            analysis/measure_caribbean_depth_layers_v1.py
            analysis/test_caribbean_depth_layers_v1.py
            research/caribbean-current-depth-operator-v1.json
            research/caribbean-current-depth-source-inventory-result-v1.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check netCDF4==1.7.4
      - name: Check boundary censoring and time rules on one CPU
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_caribbean_depth_layers_v1.py' -v
      - name: Retrieve pinned member with ranges and compute candidate layers
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python analysis/measure_caribbean_depth_layers_v1.py --output output/caribbean-current-depth-layers-v1.json
      - uses: actions/upload-artifact@v4
        with:
          name: caribbean-current-depth-layers-v1
          path: output/caribbean-current-depth-layers-v1.json
          if-no-files-found: error
          retention-days: 14
