name: Frozen OSNAP sample-support audit v1

"on":
  workflow_call:

# The parent phase controller holds the shared single-heavy-job lock.
permissions:
  contents: read
  actions: read

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  audit-restored-sample-support:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Require the declared support phase and verified original source
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib
          assert os.environ['GITHUB_REF'] == 'refs/heads/codex/current-measurement-gaps'
          load = lambda name: json.loads(pathlib.Path(name).read_bytes())
          assert load('research/current-gap-delivery-phase.json')['phase'] == 'osnap-wg-sample-support-v1'
          review = load('research/osnap-wg-2016-2018-source-header-execution-review-v1.json')
          assert review['source_run_id'] == 40092026859 and review['source_run_conclusion'] == 'success'
          assert review['instrument_count'] == 78 and review['new_physical_measurements'] == 0
          for key in ('header_report', 'original_custody'):
              spec = review[key]
              raw = pathlib.Path(spec['path']).read_bytes()
              assert len(raw) == spec['bytes'] and hashlib.sha256(raw).hexdigest() == spec['sha256']
          PY
      - name: Install pinned numeric readers and synthetic test dependencies
        run: python -m pip install netCDF4==1.7.4 numpy==2.4.1 pytest==8.4.2
      - name: Run tiny synthetic samples before original access
        run: python -m pytest -q analysis/test_osnap_wg_sample_support_v1.py
      - name: Verify the committed support freeze before restoring originals
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'analysis')
          import audit_osnap_wg_sample_support_v1 as support
          support.verify_preflight()
          PY
      - name: Restore the original source artifact and first acquisition receipt
        uses: actions/download-artifact@v4
        with:
          name: osnap-wg-2016-2018-source-custody-v1
          run-id: 40092026859
          github-token: ${{ github.token }}
          path: .pytest_cache/osnap-restored-source
      - name: Audit original sample support on one CPU without provider access
        run: python analysis/audit_osnap_wg_sample_support_v1.py --cloud-audit
      - name: Retain sample-support audit without dataset admission
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osnap-wg-sample-support-v1
          path: .pytest_cache/osnap-sample-support-v1/result.json
          include-hidden-files: true
          if-no-files-found: ignore
          compression-level: 0
