          python-version: "3.13"
      - name: Audit provenance and depth processing gaps without raw ocean fields
        timeout-minutes: 5
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_current_depth_coverage_audit_v12.py' -v
          taskset -c "$cpu" nice -n 15 python analysis/audit_current_depth_coverage_v12.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-depth-coverage-audit-v12
          path: current-depth-coverage-audit-v12/
          retention-days: 7
