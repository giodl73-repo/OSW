            research/source-data/loop-antilles-interval-depth-sections-v1/transport-ledger.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Reproduce every original case and derive native depth variation without retrieval
        timeout-minutes: 5
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python -m pip install numpy==2.4.1 netCDF4==1.7.4 pyproj==3.7.2
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_loop_antilles_interval_depth_sections_v1.py' -v
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_loop_antilles_regional_velocity_curtains_v1.py' -v
          taskset -c "$cpu" nice -n 15 python analysis/derive_loop_antilles_regional_velocity_curtains_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loop-antilles-regional-velocity-curtains-v1
          path: loop-antilles-regional-velocity-curtains-v1/
          retention-days: 7
