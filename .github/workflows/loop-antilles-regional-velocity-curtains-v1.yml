name: Loop and Antilles source-threshold depth contours v1
"on":
  push:
    branches: [codex/current-measurement-gaps]
    paths:
      - .github/workflows/loop-antilles-regional-velocity-curtains-v1.yml
      - analysis/derive_loop_antilles_regional_velocity_curtains_v1.py
      - analysis/test_loop_antilles_regional_velocity_curtains_v1.py
      - plans/loop-antilles-regional-velocity-curtains-protocol-v1.md
      - research/loop-antilles-regional-velocity-curtains-operator-v1.json
concurrency:
  group: osw-current-gap-delivery
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  derive:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/loop-antilles-interval-depth-sections-v1.yml
            analysis/acquire_latitude_depth_sections_v2.py
