name: Regional Guinea native velocity depth curtains v1
"on":
  push:
    branches: [codex/current-measurement-gaps]
    paths:
      - .github/workflows/guinea-velocity-curtains-v1.yml
      - analysis/derive_guinea_velocity_curtains_v1.py
      - analysis/test_guinea_velocity_curtains_v1.py
      - plans/guinea-velocity-curtains-protocol-v1.md
      - research/guinea-velocity-curtains-operator-v1.json
concurrency:
  group: osw-current-gap-delivery
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  derive:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/guinea-depth-sections-v1.yml
            analysis/acquire_barents_makassar_interval_depth_sections_v1.py
