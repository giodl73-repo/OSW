      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Verify frozen inputs and derive native depth variation without ocean retrieval
        timeout-minutes: 4
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python -m pip install numpy==2.4.1 netCDF4==1.7.4 pyproj==3.7.2
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_barents_makassar_velocity_curtains_v1.py' -v
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_guinea_depth_sections_v1.py' -v
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_guinea_velocity_curtains_v1.py' -v
          taskset -c "$cpu" nice -n 15 python analysis/derive_guinea_velocity_curtains_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guinea-velocity-curtains-v1
          path: guinea-velocity-curtains-v1/
          retention-days: 7
