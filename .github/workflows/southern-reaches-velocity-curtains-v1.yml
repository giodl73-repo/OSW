name: South Pacific and South Australian regional depth contours v1
"on":
  push:
    branches: [codex/current-measurement-gaps]
    paths:
      - .github/workflows/southern-reaches-velocity-curtains-v1.yml
      - analysis/derive_southern_reaches_velocity_curtains_v1.py
      - analysis/test_southern_reaches_velocity_curtains_v1.py
      - plans/southern-reaches-velocity-curtains-protocol-v1.md
      - research/southern-reaches-velocity-curtains-operator-v1.json
concurrency:
  group: osw-current-gap-delivery
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  derive:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/southern-reaches-depth-sections-v1.yml
            analysis/acquire_north_brazil_depth_sections_v1.py
            analysis/acquire_three_current_depth_sections_v1.py
            analysis/acquire_transverse_depth_sections_v2.py
            analysis/acquire_zonal_current_depth_sections_v1.py
            analysis/assemble_nec_subarctic_depth_completion_v1.py
            analysis/bounded_hycom_component_reads_v1.py
            analysis/derive_barents_makassar_velocity_curtains_v1.py
            analysis/derive_eac_connected_layer_thickness_v1.py
            analysis/derive_nec_subarctic_velocity_curtains_v1.py
            analysis/derive_southern_reaches_velocity_curtains_v1.py
            analysis/derive_surface_regional_velocity_curtains_v1.py
            analysis/interval_depth_diagnostic_v1.py
            analysis/interval_transverse_section_audit_v1.py
            analysis/latitude_depth_section_geometry_v1.py
            analysis/latitude_interval_section_audit_v1.py
            analysis/mixed_interval_section_geometry_v1.py
            analysis/native_velocity_depth_curtain_v2.py
            analysis/sample_atlantic_current_depth_v1.py
            analysis/sample_eac_hycom_route_depth_v1.py
            analysis/sample_eac_hycom_route_depth_v2.py
            analysis/sample_kuroshio_hycom_depth_v1.py
            analysis/test_bounded_hycom_component_reads_v1.py
            analysis/test_southern_reaches_depth_sections_v1.py
            analysis/test_southern_reaches_velocity_curtains_v1.py
            plans/southern-reaches-velocity-curtains-protocol-v1.md
            research/current-depth-reference-inventory-v18.json
            research/source-data/southern-reaches-depth-sections-v1/2022-01-15-south-australian-section-135p5e.json
            research/source-data/southern-reaches-depth-sections-v1/2022-01-15-south-australian-section-138e.json
            research/source-data/southern-reaches-depth-sections-v1/2022-01-15-south-australian-section-140e.json
            research/source-data/southern-reaches-depth-sections-v1/2022-01-15-south-australian-section-142p5e.json
            research/source-data/southern-reaches-depth-sections-v1/2022-01-15-south-pacific-section-100w.json
            research/source-data/southern-reaches-depth-sections-v1/2022-01-15-south-pacific-section-103w.json
            research/source-data/southern-reaches-depth-sections-v1/2022-01-15-south-pacific-section-88w.json
            research/source-data/southern-reaches-depth-sections-v1/2022-01-15-south-pacific-section-92w.json
            research/source-data/southern-reaches-depth-sections-v1/2022-01-15-south-pacific-section-96w.json
            research/source-data/southern-reaches-depth-sections-v1/2022-07-15-south-australian-section-135p5e.json
            research/source-data/southern-reaches-depth-sections-v1/2022-07-15-south-australian-section-138e.json
            research/source-data/southern-reaches-depth-sections-v1/2022-07-15-south-australian-section-140e.json
            research/source-data/southern-reaches-depth-sections-v1/2022-07-15-south-australian-section-142p5e.json
            research/source-data/southern-reaches-depth-sections-v1/2022-07-15-south-pacific-section-100w.json
            research/source-data/southern-reaches-depth-sections-v1/2022-07-15-south-pacific-section-103w.json
            research/source-data/southern-reaches-depth-sections-v1/2022-07-15-south-pacific-section-88w.json
            research/source-data/southern-reaches-depth-sections-v1/2022-07-15-south-pacific-section-92w.json
            research/source-data/southern-reaches-depth-sections-v1/2022-07-15-south-pacific-section-96w.json
            research/source-data/southern-reaches-depth-sections-v1/manifest.json
            research/source-data/southern-reaches-depth-sections-v1/transport-ledger.json
            research/south-australian-reference-path-candidate.json
            research/south-pacific-eastern-front-reach-layer-time-scope-audit.json
            research/south-pacific-eastern-front-reach-reference-path-candidate.json
            research/southern-reaches-depth-sections-operator-v1.json
            research/southern-reaches-depth-sections-source-facts-v1.json
            research/southern-reaches-depth-sections-source-review-v1.json
            research/southern-reaches-velocity-curtains-operator-v1.json
            research/zonal-current-depth-sections-operator-v1.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Reproduce every original case and derive native depth variation without retrieval
        timeout-minutes: 5
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python -m pip install numpy==2.4.1 netCDF4==1.7.4 pyproj==3.7.2
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_southern_reaches_depth_sections_v1.py' -v
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_southern_reaches_velocity_curtains_v1.py' -v
          taskset -c "$cpu" nice -n 15 python analysis/derive_southern_reaches_velocity_curtains_v1.py --current current:south-pacific
          taskset -c "$cpu" nice -n 15 python analysis/derive_southern_reaches_velocity_curtains_v1.py --current current:south-australian
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: southern-reaches-velocity-curtains-south-pacific-v1
          path: southern-reaches-velocity-curtains-v1/south-pacific/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: southern-reaches-velocity-curtains-south-australian-v1
          path: southern-reaches-velocity-curtains-v1/south-australian/
          retention-days: 7
