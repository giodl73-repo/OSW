name: Sequential EACC cited width constraint delivery v2
"on":
  push:
    branches: [codex/current-measurement-gaps]
    paths:
      - research/eacc-cited-width-delivery-request-v2.json
      - .github/workflows/eacc-cited-width-delivery-v2.yml
concurrency:
  group: osw-current-gap-delivery
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
env:
  GH_TOKEN: ${{ github.token }}
  OSW_EACC_CITED_WIDTH_DELIVERY_V2: "1"
  CARGO_BUILD_JOBS: "1"
  RUST_TEST_THREADS: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  PYTHONPATH: analysis
jobs:
  select-request:
    runs-on: ubuntu-latest
    outputs:
      execute: ${{ steps.request.outputs.execute }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: research/eacc-cited-width-delivery-request-v2.json
      - id: request
        run: |
          python - <<'PY'
          import json,os,pathlib
          r=json.loads(pathlib.Path('research/eacc-cited-width-delivery-request-v2.json').read_bytes())
          assert r['schema']=='osw.eacc-cited-width-delivery-request.v2'
          assert type(r['execute']) is bool
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('execute='+str(r['execute']).lower()+'\n')
          PY
  delivery:
    needs: select-request
    if: needs.select-request.outputs.execute == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Verify frozen inputs and lightweight checks
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python analysis/check_eacc_cited_width_delivery_v2.py preflight
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_eacc_cited_width_delivery_v2.py' -v
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_eacc_cited_width_cloud_v2.py' -v
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_published_eacc_cited_width_constraint_v1.py' -v
          taskset -c "$cpu" nice -n 15 node analysis/test_cited_width_constraints_ui_v1.mjs
          taskset -c "$cpu" nice -n 15 node analysis/test_published_current_speeds_ui_v1.mjs
          taskset -c "$cpu" nice -n 15 node analysis/test_published_current_speed_source_links_v1.mjs
      - name: Install pinned Rust toolchain and locked dependencies
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 rustup toolchain install 1.95.0 --profile minimal --target wasm32-unknown-unknown
          taskset -c "$cpu" nice -n 15 cargo +1.95.0 fetch --locked --manifest-path rust/osw-query/Cargo.toml
      - id: engine
        name: Assemble indexed candidate, build once and verify parity
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python analysis/check_eacc_cited_width_delivery_v2.py engine
      - name: Install browser after engine verification
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python -m pip install playwright==1.58.0
          taskset -c "$cpu" nice -n 15 python -m playwright install --with-deps chromium
      - name: Verify desktop and narrow query, atlas, seasons, dashboard updates and source links
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python analysis/check_eacc_cited_width_delivery_v2.py browser
      - name: Retain compact evidence and actual screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eacc-cited-width-delivery-evidence-v2
          path: |
            .pytest_cache/eacc-cited-width-delivery-v2/*-failure.json
            .pytest_cache/eacc-cited-width-delivery-v2/engine-manifest.json
            .pytest_cache/eacc-cited-width-delivery-v2/engine.json
            .pytest_cache/eacc-cited-width-delivery-v2/browser.json
            .pytest_cache/eacc-cited-width-delivery-v2/result.json
            .pytest_cache/eacc-cited-width-delivery-v2/compile-inventory.json
            .pytest_cache/eacc-cited-width-delivery-v2/dependency-proof.json
            .pytest_cache/eacc-cited-width-delivery-v2/source-index-audit.json
            .pytest_cache/eacc-cited-width-delivery-v2/main-parity.json
            .pytest_cache/eacc-cited-width-delivery-v2/index-parity.json
            .pytest_cache/eacc-cited-width-delivery-v2/snapshots-parity.json
            .pytest_cache/eacc-cited-width-delivery-v2/parent-snapshots.json
            .pytest_cache/eacc-cited-width-delivery-v2/parent-speeds.json
            .pytest_cache/eacc-cited-width-delivery-v2/rust-tests.txt
            .pytest_cache/eacc-cited-width-delivery-v2/*.png
            .pytest_cache/eacc-cited-width-delivery-v2/*.geometry.json
          if-no-files-found: warn
          retention-days: 14
      - name: Retain verified engine candidate
        if: always() && steps.engine.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: eacc-cited-width-delivery-candidate-v2
          path: |
            .pytest_cache/eacc-cited-width-delivery-v2/artifact/**
            .pytest_cache/eacc-cited-width-delivery-v2/engine.json
          retention-days: 14
