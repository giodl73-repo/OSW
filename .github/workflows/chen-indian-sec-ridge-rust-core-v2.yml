name: Verify Indian SEC regional-length Rust core v2
"on":
  push:
    branches: [codex/current-measurement-gaps]
    paths:
      - research/chen-indian-sec-ridge-rust-core-request-v2.json
      - .github/workflows/chen-indian-sec-ridge-rust-core-v2.yml
concurrency:
  group: osw-current-gap-delivery
  cancel-in-progress: false
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: "1"
  CARGO_INCREMENTAL: "0"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
jobs:
  select-request:
    runs-on: ubuntu-latest
    outputs:
      execute: ${{ steps.request.outputs.execute }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: research/chen-indian-sec-ridge-rust-core-request-v2.json
      - id: request
        run: |
          python - <<'PY'
          import json,os,pathlib
          r=json.loads(pathlib.Path('research/chen-indian-sec-ridge-rust-core-request-v2.json').read_bytes())
          assert r['schema']=='osw.chen-indian-sec-ridge-rust-core-request.v2'
          assert type(r['execute']) is bool
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('execute='+str(r['execute']).lower()+'\n')
          PY
  native-core:
    needs: select-request
    if: needs.select-request.outputs.execute == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Prove local native compilation is refused before access
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p test_chen_indian_sec_ridge_rust_core_v2.py -v
      - name: Install the frozen Rust toolchain on one CPU
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 rustup toolchain install 1.95.0 --profile minimal
      - name: Verify exact source and installed parent, then run native unit tests
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python analysis/check_chen_indian_sec_ridge_rust_core_v2.py
      - name: Retain compact native evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chen-indian-sec-ridge-rust-core-v2
          path: .pytest_cache/chen-indian-sec-ridge-rust-core-v2/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
