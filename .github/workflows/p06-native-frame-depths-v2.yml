name: P06 native UV frame local depths v2
"on":
  push:
    branches: [codex/current-measurement-gaps]
    paths:
      - .github/workflows/p06-native-frame-depths-v2.yml
      - analysis/sample_p06_native_frame_depths_v2.py
      - analysis/test_p06_native_frame_depths_v2.py
      - research/p06-native-frame-depth-operator-v2.json
      - plans/p06-native-frame-depth-protocol-v2.md
concurrency:
  group: osw-current-gap-delivery
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/p06-native-frame-depths-v2.yml
            analysis/sample_p06_native_frame_depths_v2.py
            analysis/test_p06_native_frame_depths_v2.py
            analysis/acquire_a20_gulf_stream_cast_headers_v1.py
            analysis/sample_a20_gulf_stream_depth_brackets_v1.py
            analysis/sample_a20_gulf_stream_core_direction_depths_v2.py
            plans/p06-native-frame-depth-protocol-v2.md
            research/p06-eac-native-source-review-v1.json
            research/p06-native-frame-depth-operator-v2.json
            research/source-data/p06-eac-native-casts-v1/*
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install offline native dependencies on one CPU
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python -m pip install numpy==2.3.4 netCDF4==1.7.4
      - name: Check native-basis invariants and sample original retained casts once
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          export OSW_P06_NATIVE_PHASE_START=$(python -c "import time;print(time.monotonic())")
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_p06_native_frame_depths_v2.py' -v
          taskset -c "$cpu" nice -n 15 python analysis/sample_p06_native_frame_depths_v2.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p06-native-frame-depths-v2
          path: p06-native-frame-depths-v2/
          retention-days: 7
          if-no-files-found: error
