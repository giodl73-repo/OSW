        with:
          name: partitioned-ocean-velocity-curtains-tasman-north-bank-search-v1
          path: partitioned-ocean-velocity-curtains-v1/tasman-north-bank-search/
          retention-days: 7
      - uses: actions/upload-artifact@v4
