name: Atlantic current depth sampling v1
"on":
  push:
    branches: [codex/current-measurement-gaps]
    paths:
      - .github/workflows/atlantic-current-depth-v1.yml
      - analysis/sample_atlantic_current_depth_v1.py
      - analysis/test_atlantic_current_depth_v1.py
      - research/atlantic-current-depth-operator-v1.json
concurrency:
  group: osw-current-gap-delivery
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  sample:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            analysis/sample_atlantic_current_depth_v1.py
            analysis/test_atlantic_current_depth_v1.py
            research/atlantic-current-depth-operator-v1.json
            research/brazil-reference-path-candidate.json
            research/benguela-reference-path-candidate.json
            research/canary-reference-path-candidate.json
            analysis/sample_eac_hycom_route_depth_v1.py
            analysis/sample_eac_hycom_route_depth_v2.py
            analysis/derive_eac_connected_layer_thickness_v1.py
            analysis/sample_kuroshio_hycom_depth_v1.py
            research/current-depth-register-source-review-v48.json
            research/current-depth-route-projections-source-review-v12.json
            research/kuroshio-hycom-depth-source-review-v1.json
            analysis/test_eac_hycom_route_depth_v1.py
            analysis/test_eac_hycom_route_depth_v2.py
            analysis/test_eac_connected_layer_thickness_v1.py
            analysis/test_kuroshio_hycom_depth_v1.py
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Verify fixed rules and sample three current corridors sequentially on one idle CPU
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python -m pip install netCDF4==1.7.4 numpy==2.3.4 pyproj==3.7.2
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_eac_hycom_route_depth_v*.py' -v
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_eac_connected_layer_thickness_v1.py' -v
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_kuroshio_hycom_depth_v1.py' -v
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_atlantic_current_depth_v1.py' -v
          taskset -c "$cpu" nice -n 15 python analysis/sample_atlantic_current_depth_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlantic-current-depth-v1
          path: atlantic-current-depth-v1/
          retention-days: 7
