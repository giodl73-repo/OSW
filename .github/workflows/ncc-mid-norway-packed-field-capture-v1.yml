name: Original NCC mid Norway packed field format capture v1
"on":
  push:
    branches: [codex/current-measurement-gaps]
    paths:
      - .github/workflows/ncc-mid-norway-packed-field-capture-v1.yml
      - analysis/capture_ncc_mid_norway_packed_field_v1.py
      - analysis/hycom_packed_int16_v1.py
      - analysis/test_hycom_packed_int16_v1.py
      - plans/ncc-mid-norway-packed-field-capture-protocol-v1.md
      - research/ncc-mid-norway-packed-field-capture-operator-v1.json
concurrency:
  group: osw-current-gap-delivery
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            analysis/acquire_ncc_mid_norway_joint_sections_v1.py
            analysis/acquire_ncc_north_joint_sections_v1.py
            analysis/acquire_north_brazil_depth_sections_v1.py
            analysis/acquire_three_current_depth_sections_v1.py
            analysis/capture_ncc_mid_norway_packed_field_v1.py
            analysis/derive_eac_connected_layer_thickness_v1.py
            analysis/hycom_packed_int16_v1.py
            analysis/interval_depth_diagnostic_v1.py
            analysis/latitude_depth_section_geometry_v1.py
            analysis/ncc_core_salinity_diagnostic_v1.py
            analysis/probe_hycom_http_coordinates_v1.py
            analysis/probe_hycom_http_coordinates_v2.py
            analysis/probe_hycom_native_client_coordinates_v1.py
            analysis/sample_atlantic_current_depth_v1.py
            analysis/sample_eac_hycom_route_depth_v1.py
            analysis/sample_eac_hycom_route_depth_v2.py
            analysis/sample_kuroshio_hycom_depth_v1.py
            analysis/test_hycom_http_coordinates_v1.py
            analysis/test_hycom_http_coordinates_v2.py
            analysis/test_hycom_native_client_coordinate_probe_v1.py
            analysis/test_hycom_packed_int16_v1.py
            analysis/test_ncc_mid_norway_joint_sections_v1.py
            analysis/test_ncc_north_joint_sections_v1.py
            plans/hycom-http-coordinate-probe-protocol-v1.md
            plans/hycom-native-client-coordinate-probe-protocol-v1.md
            plans/hycom-projected-dds-coordinate-probe-protocol-v2.md
            plans/ncc-mid-norway-joint-depth-extension-protocol-v1.md
            plans/ncc-mid-norway-packed-field-capture-protocol-v1.md
            plans/ncc-north-joint-depth-extension-protocol-v1.md
            research/current-depth-hycom-http-coordinate-source-review-v1.json
            research/current-depth-hycom-http-coordinate-source-review-v2.json
            research/current-depth-hycom-native-client-coordinate-source-review-v1.json
            research/current-depth-hycom-ncc-metadata-diagnosis-source-review-v1.json
            research/current-depth-ncc-mid-norway-source-attempt-result-v1.json
            research/hycom-http-coordinate-probe-operator-v1.json
            research/hycom-http-coordinate-probe-operator-v2.json
            research/hycom-native-client-coordinate-probe-operator-v1.json
            research/ncc-enge2025-depth-identity-source-scope-review-v1.json
            research/ncc-mid-norway-joint-sections-operator-v1.json
            research/ncc-mid-norway-packed-field-capture-operator-v1.json
            research/ncc-north-joint-sections-operator-v1.json
            research/norwegian-coastal-reference-path-input.json
            research/source-data/hycom-http-coordinate-probe-v2/http-ledger.json
            research/source-data/hycom-http-coordinate-probe-v2/http-response-1.json
            research/source-data/hycom-http-coordinate-probe-v2/http-response-10.json
            research/source-data/hycom-http-coordinate-probe-v2/http-response-11.json
            research/source-data/hycom-http-coordinate-probe-v2/http-response-12.json
            research/source-data/hycom-http-coordinate-probe-v2/http-response-2.json
            research/source-data/hycom-http-coordinate-probe-v2/http-response-3.json
            research/source-data/hycom-http-coordinate-probe-v2/http-response-4.json
            research/source-data/hycom-http-coordinate-probe-v2/http-response-5.json
            research/source-data/hycom-http-coordinate-probe-v2/http-response-6.json
            research/source-data/hycom-http-coordinate-probe-v2/http-response-7.json
            research/source-data/hycom-http-coordinate-probe-v2/http-response-8.json
            research/source-data/hycom-http-coordinate-probe-v2/http-response-9.json
            research/source-data/hycom-http-coordinate-probe-v2/probe-report.json
            research/source-data/hycom-http-coordinate-probe-v2/process-log.json
            research/source-data/hycom-http-coordinate-probe-v2/ts3z-depth.json
            research/source-data/hycom-http-coordinate-probe-v2/ts3z-lat.json
            research/source-data/hycom-http-coordinate-probe-v2/ts3z-lon.json
            research/source-data/hycom-http-coordinate-probe-v2/ts3z-time.json
            research/source-data/hycom-http-coordinate-probe-v2/uv3z-depth.json
            research/source-data/hycom-http-coordinate-probe-v2/uv3z-lat.json
            research/source-data/hycom-http-coordinate-probe-v2/uv3z-lon.json
            research/source-data/hycom-http-coordinate-probe-v2/uv3z-time.json
            research/source-data/hycom-http-coordinate-probe-v2/worker-report.json
            research/source-data/hycom-ncc-mid-norway-metadata-probe-v1/probe-report.json
            research/source-data/hycom-ncc-mid-norway-metadata-probe-v1/response-1.json
            research/source-data/hycom-ncc-mid-norway-metadata-probe-v1/response-2.json
            research/source-data/hycom-ncc-mid-norway-metadata-probe-v1/response-7.json
            research/source-data/hycom-ncc-mid-norway-metadata-probe-v1/response-8.json
            research/source-data/ncc-north-joint-sections-v1/2022-03-15-section-61p5n.json
            research/source-data/ncc-north-joint-sections-v1/2022-12-15-section-62p25n.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Check original numerics and independent packed field decoding
        timeout-minutes: 3
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python -m pip install numpy==2.4.1 netCDF4==1.7.4 pyproj==3.7.2
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_ncc_north_joint_sections_v1.py' -v
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_ncc_mid_norway_joint_sections_v1.py' -v
          taskset -c "$cpu" nice -n 15 python -m unittest discover -s analysis -p 'test_hycom_packed_int16_v1.py' -v
      - name: Reserve full cohort and capture its first original field once
        timeout-minutes: 2
        run: |
          cpu=$(python -c "import os; print(min(os.sched_getaffinity(0)))")
          taskset -c "$cpu" nice -n 15 python analysis/capture_ncc_mid_norway_packed_field_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ncc-mid-norway-packed-field-capture-v1
          path: ncc-mid-norway-packed-field-capture-v1/
          retention-days: 7
