name: Current depth additive inventory v54
"on":
  push:
    branches: [codex/current-measurement-gaps]
    paths:
      - .github/workflows/current-depth-route-projections-v54.yml
      - analysis/build_current_depth_route_projections_v54.py
      - analysis/test_current_depth_route_projections_v54.py
      - research/current-depth-route-projection-operator-v54.json
concurrency:
  group: osw-current-gap-delivery
  cancel-in-progress: false
permissions:
  contents: read
