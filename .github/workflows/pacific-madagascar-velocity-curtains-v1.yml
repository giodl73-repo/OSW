            research/source-data/pacific-madagascar-depth-sections-v1/2022-07-15-alaska-section-57n.json
            research/source-data/pacific-madagascar-depth-sections-v1/2022-07-15-california-section-23n.json
            research/source-data/pacific-madagascar-depth-sections-v1/2022-07-15-california-section-25n.json
            research/source-data/pacific-madagascar-depth-sections-v1/2022-07-15-california-section-28n.json
            research/source-data/pacific-madagascar-depth-sections-v1/2022-07-15-california-section-31n.json
            research/source-data/pacific-madagascar-depth-sections-v1/2022-07-15-california-section-34n.json
            research/source-data/pacific-madagascar-depth-sections-v1/2022-07-15-california-section-37n.json
            research/source-data/pacific-madagascar-depth-sections-v1/2022-07-15-california-section-40n.json
            research/source-data/pacific-madagascar-depth-sections-v1/2022-07-15-california-section-43n.json
            research/source-data/pacific-madagascar-depth-sections-v1/2022-07-15-southern-east-madagascar-section-20s.json
            research/source-data/pacific-madagascar-depth-sections-v1/2022-07-15-southern-east-madagascar-section-21s.json
