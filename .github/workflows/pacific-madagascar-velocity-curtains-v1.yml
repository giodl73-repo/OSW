            research/source-data/pacific-madagascar-depth-sections-v1/2022-01-15-alaska-section-57n.json
            research/source-data/pacific-madagascar-depth-sections-v1/2022-01-15-california-section-23n.json
            research/source-data/pacific-madagascar-depth-sections-v1/2022-01-15-california-section-25n.json
            research/source-data/pacific-madagascar-depth-sections-v1/2022-01-15-california-section-28n.json
