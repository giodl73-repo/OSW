name: California Alaska and Madagascar depth contours v1
"on":
  push:
    branches: [codex/current-measurement-gaps]
    paths:
      - .github/workflows/pacific-madagascar-velocity-curtains-v1.yml
      - analysis/derive_pacific_madagascar_velocity_curtains_v1.py
      - analysis/test_pacific_madagascar_velocity_curtains_v1.py
      - plans/pacific-madagascar-velocity-curtains-protocol-v1.md
      - research/pacific-madagascar-velocity-curtains-operator-v1.json
concurrency:
  group: osw-current-gap-delivery
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  derive:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/pacific-madagascar-depth-sections-v1.yml
            analysis/acquire_north_brazil_depth_sections_v1.py
            analysis/acquire_pacific_madagascar_depth_sections_v1.py
            analysis/acquire_three_current_depth_sections_v1.py
            analysis/acquire_zonal_current_depth_sections_v1.py
            analysis/derive_barents_makassar_velocity_curtains_v1.py
            analysis/derive_eac_connected_layer_thickness_v1.py
            analysis/derive_pacific_madagascar_velocity_curtains_v1.py
            analysis/derive_surface_regional_velocity_curtains_v1.py
            analysis/interval_depth_diagnostic_v1.py
            analysis/interval_transverse_section_audit_v1.py
            analysis/latitude_depth_section_geometry_v1.py
            analysis/latitude_interval_section_audit_v1.py
            analysis/mixed_interval_section_geometry_v1.py
            analysis/native_velocity_depth_curtain_v2.py
            analysis/sample_atlantic_current_depth_v1.py
            analysis/sample_eac_hycom_route_depth_v1.py
            analysis/sample_eac_hycom_route_depth_v2.py
            analysis/sample_kuroshio_hycom_depth_v1.py
            analysis/test_pacific_madagascar_depth_sections_v1.py
            analysis/test_pacific_madagascar_velocity_curtains_v1.py
            analysis/test_three_current_depth_sections_v1.py
            plans/pacific-madagascar-velocity-curtains-protocol-v1.md
            research/alaska-reference-path-candidate.json
            research/california-2011-abstract-width-scope-audit.json
            research/current-depth-reference-inventory-v18.json
            research/current-depth-source-facts-v11.json
            research/current-depth-source-facts-v7.json
            research/pacific-madagascar-depth-sections-operator-v1.json
            research/pacific-madagascar-depth-sections-source-facts-v1.json
            research/pacific-madagascar-depth-sections-source-review-v1.json
            research/pacific-madagascar-velocity-curtains-operator-v1.json
            research/source-data/pacific-madagascar-depth-sections-v1/2022-01-15-alaska-section-48n.json
